                          required: [question, projectName, taskTitle]
                          properties:
                            question: { $ref: '#/components/schemas/AgentQuestion' }
                            projectName: { type: string }
                            taskTitle: { type: string }

  /projects/{projectId}/decisions:
    get:
      tags: [질문]
      summary: 질문으로 정해진 결정 (인계 노트처럼 보기)
      description: |
        에이전트가 AskUserQuestion으로 묻고 사람이 답해 정해진 결정을 **질문 문장 하나당 한 줄**로 본다(사람 전용, 읽기 전용 — 조회는 이벤트를 남기지 않는다).
        볼 수 있는 범위는 태스크와 같다. 기본은 답이 있는 것(`answered`·`agent_answered`), `status=all`이면 대기·만료·자기 소관도.
        `role`은 묻는 쪽 또는 답할 쪽이 그 역할인 결정. 정렬은 답한 시각 최신순(답이 없으면 질문 시각). `limit`은 줄 수.
        여기에는 범위 제한 없이 전부 나온다. 이 중 `answered`(확정된 결정)는 다른 태스크에 전달된다 — PM 대상은 모든 태스크, FE·BE 대상은 질문한 태스크와
        명세가 같은 태스크만(브리핑 `decisions`, 제출 시 409 `DECISIONS_UNACKNOWLEDGED`).
        실시간 신호 토픽은 questions(신호를 받으면 다시 읽는다).
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: status, in: query, required: false, schema: { type: string, enum: [answered, all], default: answered } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [FRONTEND, BACKEND, PM] } }
        - { name: taskId, in: query, required: false, schema: { type: string, format: uuid }, description: '질문한 태스크' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 답한 시각 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [decisions]
                    properties:
                      decisions: { type: array, items: { $ref: '#/components/schemas/QuestionDecision' } }
        '401':
          description: 사람 토큰이 아니다(에이전트 토큰 포함)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: 다른 조직이거나 볼 수 없는 프로젝트
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /projects/{projectId}/questions:
    get:
