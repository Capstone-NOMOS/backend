      responses:
        '200':
          description: 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [questions]
                    properties:
                      questions: { type: array, items: { $ref: '#/components/schemas/AgentQuestion' } }
  /questions/{questionId}/answer:
    post:
      tags: [질문]
      summary: 질문에 답하기·확인·뒤집기 (대상 역할 담당 또는 대표, 실험)
      description: |
        대기 중(pending)이면 직접 답한다. 에이전트가 이미 답했으면(agent_answered) 같은 답을 보내면 확인, 다른 답이면 뒤집기다
        (뒤집으면 묻는 쪽이 이미 그 답으로 구현했을 수 있다 — 고치는 태스크 자동 생성은 아직 없다).
        키는 질문 문장 **그대로**여야 한다(다르면 에이전트가 "답하지 않음"으로 받는다 — 그래서 422로 막는다).
        값은 선택지 label이거나 자유 문장. 근거를 덧붙이면 에이전트가 그것까지 따른다.
      security: [{ userToken: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: { type: object, additionalProperties: { type: string } }
            example:
              answers:
                'GET /api/studies/:id/members 의 응답 본문 형태는 무엇인가요?': '{ members: [...] } — 백엔드 공통 목록 형식'
      responses:
        '200':
          description: 답함(status=answered). 기다리던 에이전트가 바로 이어서 작업한다
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentQuestion' } } }
        '403':
          description: 대상 역할 담당도 대표도 아님(NOT_QUESTION_TARGET)
        '409':
          description: 이미 답했거나 만료됨(QUESTION_CLOSED)
        '422':
          description: 키가 질문과 다르거나 답이 비었음(QUESTION_INVALID) — error.details에 전부
  /projects/{projectId}/events:
    get:
      tags: [프로젝트]
      summary: 이벤트 로그 (최신순)
      description: |
        프로젝트에서 일어난 일을 최신순으로 준다(활동 화면·대시보드 최근 활동). events는 지워지지 않는 기록이라 그대로 읽는다.
        볼 수 있는 범위는 태스크·노트와 같다 — 대표는 전부, 팀원은 자기 에이전트가 배정된 프로젝트.

        - 페이지: 응답의 `nextBefore`를 다음 요청의 `before`로 넘긴다. null이면 끝이다. 시각이 아니라 id로 넘긴다(같은 순간의 이벤트가 경계에서 빠지지 않게).
        - `types`로 거른다(쉼표로 여러 개). `payload` 모양은 `type`마다 다르다.
        - `onBehalfOf`는 사람(user id)이거나 시스템 주체 문자열(`system:pm`, `system:device-flow` 등)이다.
        - `tokenCost`는 그 행의 비용(USD) — 지금은 PM 호출(`PM_CALL`)에만 있다. 태스크별·사람별 비용 집계는 별도 API로 다룬다.
        - 화면이 문구를 만들 때 자주 쓰는 type과 payload(전체 목록은 서버 `domain/events/types.ts`):
          - `TASK_CANCELLED` — `taskId, title, previousState, reason, expiredQuestionIds[], unblockedDependents[]`(대표가 취소, 027)
          - `TASK_COMPLETED_MANUALLY` — `taskId, title, artifactId, commitSha, changedPaths[], previousState, v3('PASS'), note`(사람이 직접 완료, 027)
          - `TASK_RESUMED` — `taskId, note, from('AGENT_STOPPED'|'ESCALATED'), previousRetryCount?`
          - `QUESTION_ASKED` — `questionId, taskId, askerRole, targetRole('FRONTEND'|'BACKEND'|'PM'|'SELF'), routedBy, confidence, latencyMs, fallback, costUsd, questionCount`
          - `QUESTION_GOLD_LABELED` — `questionId, goldTarget('FRONTEND'|'BACKEND'|'PM'|'SELF'), previousGoldTarget`(대표가 정답 담당자를 붙임, 026)
          - `MEMBER_AGENT_DETACHED` — `agentId, agentName?, teamRole, userId, cause('agent_disconnected')`(에이전트만 떨어짐 — 사람은 담당으로 남음, 028. 그 역할 룸에 줄로도 나온다)
          - `MEMBER_AGENT_ATTACHED` — `agentId, agentName?, teamRole, userId, cause('reconnected'|'assigned')`(빈 담당 자리에 에이전트가 다시 붙음, 028. 그 역할 룸에 줄로도 나온다)
          - `AGENT_RUN_ENDED` — `taskId, attempt, outcome('completed'|'timeout'|'failed'|'disconnected'), committed, submitted, durationMs, exitCode, taskState, waitingQuestion?`.
            `disconnected`는 에이전트 연결이 해제(연결 해제·조직 탈퇴·해산)되어 서버가 열린 실행을 대신 닫은 것이다(Executor의 종료 보고는 오지 않는다).
            서버 시작 때도 연결 해제된 에이전트에 남은 열린 실행을 같은 방식으로 닫는다(명의는 그 에이전트의 주인).
          - `MEMBER_UNASSIGNED` — `agentId(없으면 null), teamRole, userId, cause?`(사람이 역할에서 빠짐)
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: before, in: query, required: false, schema: { type: string, pattern: '^[0-9]+$' }, description: '이 id보다 오래된 이벤트만' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: types, in: query, required: false, schema: { type: string }, example: 'TASK_CLAIMED,NOTE_PUBLISHED' }
      responses:
        '200':
          description: 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [events, nextBefore]
                    properties:
                      events: { type: array, items: { $ref: '#/components/schemas/ProjectEvent' } }
                      nextBefore: { type: string, nullable: true, description: '다음 페이지의 before. null이면 끝' }
              example:
                data:
                  events:
                    - { id: '1042', type: NOTE_PUBLISHED, ts: '2026-10-02T00:58:05.640Z', onBehalfOf: e8227252-a58b-4266-839b-8674f99b1e4a, actorAgentId: e6c879be-2a69-4f82-a30d-5063ff664262, payload: { noteId: 5c457d82-8804-4408-a76e-3f5a355b8484, kind: DECIDED }, tokenCost: null, pathViolation: null }
                  nextBefore: null
  /projects/{projectId}/rooms:
    get:
      tags: [룸]
      summary: 내가 볼 수 있는 룸 목록
      description: |
        룸 = 프로젝트 × 역할. **팀원은 자기 에이전트가 배정된 역할 룸만, 대표는 전부** 본다.
        룸마다 담당 에이전트(온라인 여부)와 진행 중 태스크를 준다 — 룸 화면 머리.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 룸 목록(FRONTEND, BACKEND 순)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [rooms], properties: { rooms: { type: array, items: { $ref: '#/components/schemas/RoomSummary' } } } } } }

  /projects/{projectId}/rooms/{role}/messages:
    post:
      tags: [룸]
      summary: 사람 → 그 역할 에이전트 메시지 (그 역할 담당·대표)
      description: |
        룸 대화창에서 그 역할의 에이전트에게 말을 걸거나 지시한다. 보낼 수 있는 사람은 그 룸을 볼 수 있는 사람 — 그 역할 담당과 대표(아니면 403 `ROOM_NOT_VISIBLE`).
        **실행 중인 에이전트에게 바로 끼워 넣지 않는다.** 다음 실행의 브리핑(`humanMessages`, 프롬프트 "담당자가 보낸 메시지")으로 전달된다 —
        지금 실행에 바로 반영하려면 그 태스크를 멈추고 재개한다. 에이전트가 꺼져 있거나 태스크가 없어도 받아 두었다가 다음 실행에 전달한다(409 없음).
        메시지로 권한이 넓어지지 않는다 — 경로 금지·제출 시 판정·V3가 그대로 막는다. 이벤트 `ROOM_MESSAGE_SENT`(보낸 사람 명의, 본문 포함 — 비밀값을 적지 말 것).
        끝난 프로젝트면 409 `PROJECT_NOT_OPEN`. 길이는 1~1000자(넘으면 400 `VALIDATION_ERROR`).
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: role, in: path, required: true, schema: { type: string, enum: [FRONTEND, BACKEND] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000 }
            example: { text: '목록 화면은 페이지네이션 없이 전부 보여 주세요' }
      responses:
        '201':
          description: 남김 — 피드에 나올 줄(speaker human)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/RoomMessage' } } }

  /projects/{projectId}/rooms/{role}/feed:
    get:
      tags: [룸]
      summary: 룸 피드 (최신부터)
      description: |
        서버(PM)의 지시·판정, Executor의 실행 상태, 에이전트의 도구 사용을 시각순으로 섞은 한 줄씩. **문장(`text`)은 서버가 만든다** — 화면은 그대로 보여 주면 된다.

        예(오래된 것부터):
        ```
        [pm]    T-3 회원가입 API 실행해 주세요
        [nomos] 에이전트를 실행합니다
        [nomos] 태스크 수령 — T-3 회원가입 API · 구현을 시작합니다
        [agent] src/routes/auth.ts 읽는 중
        [agent] src/routes/auth.ts 수정
        [agent] npm test 실행
        [nomos] 제출했습니다 (커밋 a1b2c3d, 파일 3개)
        [pm]    검증 완료 — V3 통과, V1A·V1B·V2·V4 건너뜀 → 완료되었습니다
        [nomos] 실행을 마쳤습니다 (240초)
        ```
        태스크에 딸린 줄은 그 태스크의 역할 룸에만(역할 제한 없는 태스크는 모든 룸), 프로젝트 단위 PM 알림(시작·계획 적용)은 모든 룸에 나온다.
        응답은 **최신부터**이고, `nextBefore`를 `before`로 넘기면 더 오래된 줄을 읽는다(없으면 null).
        실시간: `/api/stream`에서 그 프로젝트를 구독하면 `room` 토픽이 올 때 다시 읽는다.
        팀원이 다른 역할 룸을 읽으면 403 `ROOM_NOT_VISIBLE`.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [FRONTEND, BACKEND] }
          example: BACKEND
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: 이전 응답의 nextBefore
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 피드
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [messages, nextBefore], properties: { messages: { type: array, items: { $ref: '#/components/schemas/RoomMessage' } }, nextBefore: { type: string, nullable: true } } } } }
        '403':
          description: 자기 역할이 아닌 룸
          content:
            application/json:
              example:
                error: { code: ROOM_NOT_VISIBLE, message: you cannot see the BACKEND room of this project }

  /projects/{projectId}/members:
    post:
      tags: [프로젝트]
      summary: 역할 배정 (대표 전용)
      description: |
        **배정 뒤 그 에이전트는 토큰을 재발급해야 한다.** 배정 전에 발급된 토큰에는 `project_id`가 없어
        태스크·노트 API가 403 `NOT_PROJECT_MEMBER`로 막힌다. `POST /agents/token/refresh`를 한 번 부르면 된다.
        응답의 `notice`에도 같은 안내가 들어 있다.

        프로젝트당 역할은 **하나씩만** 배정된다(`uq_project_members_role`). 실험 통제를 위해서다.
        시작(G1) 뒤에도 배정할 수 있다(021) — 빠진 역할을 채울 때 쓴다. 끝난 프로젝트(completed·aborted)는 409 `PROJECT_NOT_OPEN`. 연결 해제된 에이전트는 배정할 수 없다(403 `AGENT_NOT_IN_ORG`).

        **GitHub 협업자 자동 초대**: 배정과 함께 그 에이전트 주인을 프로젝트의 GitHub 레포(`githubRepoId`가 있는 것)마다
        push 권한 협업자로 초대한다(대표의 GitHub 토큰). 결과는 `githubInvites`(레포마다 한 줄). 초대가 실패해도 배정은 유효하다 —
        멤버가 GitHub를 연결하지 않았으면 `skipped`이고, 연결한 뒤 `POST .../members/{agentId}/github-invite`로 다시 보낸다.
        GitHub 레포가 없는 프로젝트(로컬 데모)는 빈 배열이다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, teamRole]
              properties:
                agentId: { type: string, format: uuid }
                teamRole: { type: string, enum: [FRONTEND, BACKEND] }
            example:
              agentId: '{{AGENT_BE}}'
              teamRole: BACKEND
      responses:
        '201':
          description: 배정됨. 남은 멤버 목록과 재발급 안내를 함께 준다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [members, githubInvites, notice], properties: { members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }, githubInvites: { type: array, items: { $ref: '#/components/schemas/GithubInviteResult' } }, notice: { type: string } } } } }
              example:
                data:
                  members:
                    - { agentId: '{{AGENT_BE}}', agentName: be-laptop, teamRole: BACKEND, githubInvites: [] }
                  githubInvites:
                    - { repoId: '{{REPO_API}}', fullName: acme/study-api, status: invited }
                  notice: 배정된 에이전트는 POST /api/agents/token/refresh로 토큰을 재발급해야 태스크·노트 API를 쓸 수 있습니다.
        '403':
          description: 대표가 아님 · 다른 조직(또는 연결 해제된) 에이전트
          content:
            application/json:
              examples:
                남의조직에이전트:
                  value: { error: { code: AGENT_NOT_IN_ORG, message: agent does not belong to this organization } }
        '409':
          description: 역할이 이미 찼거나, 그 에이전트가 이미 배정됐거나, 다른 진행 중 프로젝트를 맡고 있음
          content:
            application/json:
              examples:
                다른프로젝트:
                  value: { error: { code: AGENT_IN_ANOTHER_PROJECT, message: 'agent ... is already assigned to active project ...; unassign it there first' } }
                역할중복:
                  value: { error: { code: ROLE_ALREADY_ASSIGNED, message: BACKEND is already assigned in this project } }
                에이전트중복:
                  value: { error: { code: AGENT_ALREADY_ASSIGNED, message: this agent is already a member of the project } }

  /projects/{projectId}/members/{agentId}/github-invite:
    post:
      tags: [프로젝트]
      summary: GitHub 협업자 초대 다시 보내기 (대표 전용)
      description: |
        역할 배정 때 멤버가 GitHub를 연결하지 않았거나 GitHub 호출이 실패했을 때 다시 보낸다.
        멤버 구성을 바꾸는 게 아니라 접근을 주는 일이라 **시작(G1) 뒤에도 된다.** 실패해도 200이고 결과는 `githubInvites`에 적힌다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: agentId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{AGENT_BE}}'
      responses:
        '200':
          description: 레포마다 초대 결과
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [githubInvites], properties: { githubInvites: { type: array, items: { $ref: '#/components/schemas/GithubInviteResult' } } } } } }
              example:
                data:
                  githubInvites:
                    - { repoId: '{{REPO_API}}', fullName: acme/study-api, status: skipped, reason: 멤버가 GitHub를 연결하지 않았다 }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '404':
          description: 이 프로젝트의 멤버가 아닌 에이전트
          content:
            application/json:
              example:
                error: { code: MEMBER_NOT_FOUND, message: agent ... is not a member of this project }

  /projects/{projectId}/abort:
    post:
      tags: [프로젝트]
      summary: 프로젝트 중단 (대표 전용)
      description: |
        진행 중(planning·active·halted)인 프로젝트를 중단한다(021). **지우지 않고 `aborted`로 닫는다** — 이벤트·태스크·노트가 가리킨다.
        - 에이전트가 풀린다(다른 프로젝트에 배정 가능). 실행 중인 CLI는 배정이 풀린 것을 보고 다시 배정을 기다린다.
        - 레포를 다른 프로젝트에 쓸 수 있게 된다. 대기 질문은 만료로 닫히고, 대기 승인 카드는 대기열에서 빠지며 결정할 수 없다(409 `PROJECT_NOT_OPEN`).
        - 룸에 "프로젝트가 중단되었습니다"가 모든 역할에 나온다. GitHub 협업자 권한은 회수하지 않는다(레포와 코드는 팀의 것).
        이미 끝난 프로젝트(completed·aborted)는 409 `PROJECT_NOT_OPEN`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, nullable: true, description: '룸·기록에 남는 사유(선택)' }
            example:
              reason: 범위가 바뀌어 다시 계획한다
      responses:
        '200':
          description: 중단됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [project], properties: { project: { $ref: '#/components/schemas/Project' } } } } }
        '409':
          description: 이미 끝난 프로젝트
          content:
            application/json:
              example:
                error: { code: PROJECT_NOT_OPEN, message: project is completed; only an ongoing project can be aborted }

  /projects/{projectId}/members/{agentId}:
    delete:
      tags: [프로젝트]
      summary: 배정 해제 (대표 전용)
      description: |
        역할 담당(사람)을 역할에서 뺀다 — 그 사람의 프로젝트 접근과 GitHub 레포 접근도 빠진다.
        경로의 `agentId` 자리에는 붙어 있는 에이전트 id를, **에이전트가 없는 담당(`agentId: null`)이면 그 담당의 `userId`**를 넣는다(028).
        **역할 교체는 해제 후 재배정으로 한다.** UPDATE 경로를 두면 한 역할에 둘이 잠깐 겹칠 수 있다.
        시작(G1) 뒤에도 된다(021) — 단 그 에이전트가 진행 중 태스크(CLAIMED·IN_PROGRESS·VERIFYING)를 붙잡고 있으면 409 `ACTIVE_TASKS_HELD`(details에 태스크 목록).
        빠진 역할의 태스크는 새 사람을 배정할 때까지 READY로 기다린다. 끝난 프로젝트(completed·aborted)는 409 `PROJECT_NOT_OPEN`.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: agentId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{AGENT_BE}}'
      responses:
        '200':
          description: 해제됨. 남은 멤버 목록과, 빠진 사람의 GitHub 레포 접근 회수 결과
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [members, githubRevocations], properties: { members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }, githubRevocations: { type: array, items: { $ref: '#/components/schemas/GithubRevokeResult' }, description: '빠진 사람의 GitHub 레포 접근 회수 결과(대표 토큰). 대표 본인·GitHub 레포가 없으면 빈 배열' } } } } }
              example:
                data: { members: [], githubRevocations: [] }
        '403':
          description: 대표가 아님
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 진행 중 태스크를 붙잡고 있음 · 끝난 프로젝트
          content:
            application/json:
              example:
                error: { code: ACTIVE_TASKS_HELD, message: agent still holds 1 task(s) in progress; finish or stop them first }
        '404':
          description: 배정되지 않은 에이전트
          content:
            application/json:
              example:
                error: { code: MEMBER_NOT_FOUND, message: agent is not a member of this project }

  /agents/{agentId}:
    delete:
      tags: [CLI 연결]
      summary: 에이전트 연결 해제
      description: |
        노트북 CLI 연결을 끊는다(021) — 그 에이전트의 주인이나 같은 조직의 대표가 한다(아니면 403 `NOT_AGENT_OWNER`).
        맡은 진행 중 프로젝트에서 **에이전트만 떨어진다**(028) — 사람은 그 역할 담당으로 남아 프로젝트를 보고 질문 답·계약 확정을 계속하며, GitHub 레포 접근도 그대로다(`githubRevocations`는 빈 배열).
        진행 중 태스크가 있으면 409 `ACTIVE_TASKS_HELD`. refresh token이 폐기되고, 남은 access token도 401 `AGENT_DISCONNECTED`로 거부된다.
        실행 중인 CLI의 태스크 스트림도 끊긴다. 목록(`GET /orgs/{orgId}/agents`)에서 빠진다. 응답의 `unassignedFrom`은 에이전트가 떨어진 프로젝트다.
        같은 사람이 다시 `connect`(연결 키·브라우저 승인·`--code` 모두)하면 — 같은 이름이면 같은 에이전트가 되살아나고 — 에이전트 없이 담당만 남은 진행 중 프로젝트가 하나면 그 역할에 **자동으로 다시 붙는다**
        (이벤트 `MEMBER_AGENT_ATTACHED`). 여럿이면 대표가 배정 API로 붙인다.
      security: [{ userToken: [] }]
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid }, example: '{{AGENT_BE}}' }
      responses:
        '200':
          description: 해제됨
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [agentId, disconnectedAt, unassignedFrom, githubRevocations]
                    properties:
                      agentId: { type: string, format: uuid }
                      disconnectedAt: { type: string, format: date-time }
                      unassignedFrom: { type: string, format: uuid, nullable: true, description: '배정이 풀린 프로젝트(없으면 null)' }
                      githubRevocations: { type: array, items: { $ref: '#/components/schemas/GithubRevokeResult' }, description: '빠진 사람의 GitHub 레포 접근 회수 결과(대표 토큰). 대표 본인·GitHub 레포가 없으면 빈 배열' }
        '403':
          description: 주인도 대표도 아님
          content:
            application/json:
              example:
                error: { code: NOT_AGENT_OWNER, message: only the agent owner or the representative can disconnect it }
        '404':
          description: 없거나 이미 해제된 에이전트
          content:
            application/json:
              example:
                error: { code: AGENT_NOT_FOUND, message: agent not found }

  /agents/me:
    get:
      tags: [CLI 연결]
      summary: 에이전트 자기 설정
      description: |
        Executor가 기동할 때 자기 프로젝트·역할·동시 실행 상한을 읽는다. 이 값들을 Executor 쪽 설정
        파일에 적어두면 서버에서 바꿔도 반영되지 않으므로, 서버가 정본을 준다.
      security: [{ agentToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentSelf' } } }
              example:
                data:
                  agentId: 2012e1df-0beb-43fd-ac09-d893ba56b01e
                  projectId: '{{PROJECT_ID}}'
                  teamRole: BACKEND
                  maxConcurrent: 2

  /projects/{projectId}/contracts:
    get:
      tags: [API 계약]
      summary: 프로젝트의 API 계약
      description: |
        새 계획 흐름 2단계(023). 기능 명세를 확정하면 API가 필요한 기능마다 계약이 `pending`으로 생기고, BE 노트북의 에이전트가 BE 코드를 읽어 초안(`draft`)을 쓴다.
        BE 담당이 확정(`approved`)하거나 수정 요청한다. 프로젝트를 볼 수 있는 사람 누구나 읽는다. 실시간 신호 토픽은 `contracts`.
        **에이전트 토큰**이면 자기 프로젝트의 확정한(`approved`) 계약만 준다 — MCP `read_contracts`가 FE의 API 연동에 쓴다(초안은 바뀔 수 있어 주지 않는다).
      security: [{ userToken: [] }, { agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 기능 키 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [contracts], properties: { contracts: { type: array, items: { $ref: '#/components/schemas/Contract' } } } } } }

  /contracts/{contractId}/approve:
    post:
      tags: [API 계약]
      summary: 계약 확정 (BE 담당, 없으면 대표)
      description: |
        초안(`draft`)만 확정된다(아니면 409 `CONTRACT_NOT_DRAFT`). 확정한 계약은 잠기고 FE·BE 태스크 브리핑에 들어간다.
        확정할 수 있는 사람은 이 프로젝트의 BACKEND 담당(에이전트 주인)이다. BACKEND 담당이 없을 때만 대표가 대신한다(아니면 403 `NOT_CONTRACT_APPROVER`).
      security: [{ userToken: [] }]
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 확정됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Contract' } } }

  /contracts/{contractId}/revise:
    post:
      tags: [API 계약]
      summary: 계약 수정 요청 (BE 담당, 없으면 대표)
      description: |
        초안(`draft`)이나 실패(`failed`)를 다음 회차로 다시 쓰게 한다 — `pending`이 되고 BE 노트북이 다시 쓴다(직전 초안과 피드백을 받는다).
        한 계약에 수정 요청은 3회까지(409 `CONTRACT_REVISION_LIMIT`, details `{ limit, used }`).
      security: [{ userToken: [] }]
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback: { type: string, maxLength: 4000, nullable: true, description: '무엇을 고칠지(실패를 그대로 다시 시킬 때는 생략)' }
            example:
              feedback: 가입일은 memberSince로, 페이지네이션 없이
      responses:
        '200':
          description: 다시 작성 대기
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Contract' } } }

  /agents/me/contract-jobs:
    get:
      tags: [API 계약]
      summary: BE 노트북이 쓸 계약 작업 (에이전트)
      description: |
        작성 대기(`pending`) 계약과 그 기능 명세, 앞서 확정한 계약(경로·형식을 맞추게), 읽을 레포(BACKEND 소유). BACKEND 역할이 아니면 빈 목록.
        Executor는 웹소켓 `{ type: 'contracts', targetRole }` 신호나 1분 안전망으로 이걸 읽는다.
      security: [{ agentToken: [] }]
      responses:
        '200':
          description: 작업 목록
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [contracts, approved, repos]
                    properties:
                      contracts: { type: array, items: { $ref: '#/components/schemas/ContractJob' } }
                      approved:
                        type: array
                        items:
                          type: object
                          required: [featureKey, title, schemaYaml]
                          properties:
                            featureKey: { type: string }
                            title: { type: string }
                            schemaYaml: { type: string }
                      repos:
                        type: array
                        items:
                          type: object
                          required: [id, fullName, cloneUrl, defaultBranch]
                          properties:
                            id: { type: string, format: uuid }
                            fullName: { type: string }
                            cloneUrl: { type: string, nullable: true }
                            defaultBranch: { type: string }

  /contracts/{contractId}/draft:
    post:
      tags: [API 계약]
      summary: 계약 초안 제출 (BE 에이전트)
      description: |
        서버가 OpenAPI 조각 형식을 검사한다(경로는 '/'로 시작, 경로마다 메서드, 메서드마다 응답 상태 코드). 틀리면 422 `CONTRACT_INVALID` + 위반 목록 —
        Executor가 위반을 붙여 한 번 다시 쓴다. `attempt`가 지금 회차가 아니면 409 `CONTRACT_STALE`. BACKEND 에이전트만(403 `NOT_CONTRACT_WRITER`).
      security: [{ agentToken: [] }]
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, openapiYaml, summary]
              properties:
                attempt: { type: integer, minimum: 1 }
                openapiYaml: { type: string, description: 'OpenAPI 조각(paths·components) YAML' }
                summary: { type: string }
                openQuestions: { type: array, items: { type: string } }
      responses:
        '200':
          description: 초안으로 저장됨(BE 담당 확인 대기)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Contract' } } }

  /contracts/{contractId}/failure:
    post:
      tags: [API 계약]
      summary: 계약 초안을 못 냈다 (BE 에이전트)
      description: 형식을 두 번 다 못 맞췄거나 실행이 실패했다. `failed`가 되고, BE 담당이 수정 요청으로 다시 시킬 수 있다.
      security: [{ agentToken: [] }]
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt, reason]
              properties:
                attempt: { type: integer, minimum: 1 }
                reason: { type: string }
      responses:
        '200':
          description: 실패로 기록됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Contract' } } }

  /projects/{projectId}/pm/features:
    post:
      tags: [내장 PM]
      summary: 기능 명세 초안 요청 (대표 전용, 새 계획 흐름 1단계)
      description: |
        대표의 자연어 요구로 PM이 **기능 명세** 초안을 만든다(022). 대표가 읽고 판단할 수 있게 화면·동작·수용 기준을 개발 용어 없이 쓰고,
        기능마다 API가 필요한지와 어떤 데이터가 오가야 하는지(사람 말로)를 적는다. API 계약은 쓰지 않는다 — 백엔드 담당이 정한다(2단계).
        응답·폴링·수정 요청(`.../pm/plans/{planId}/revise`)·반려·확정(`.../apply`)은 계획과 같다. 확정하면 명세가 만들어지고 태스크는 만들어지지 않는다.
        진행 중 요청 하나(409 `PM_PLAN_IN_PROGRESS`), 예산(409 `PM_BUDGET_EXCEEDED`), PM 키 없음(503 `PM_UNAVAILABLE`)도 같다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, minLength: 1, maxLength: 8000, description: '대표의 요구(자연어)' }
            example:
              instruction: 스터디 상세 화면에서 멤버 목록을 보고 싶다. 멤버마다 닉네임과 가입한 날짜가 보이면 좋겠다.
      responses:
        '202':
          description: 요청됨 — 상태는 pending. GET .../pm/plans/{planId}로 폴링한다
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }

  /projects/{projectId}/pm/plans:
    get:
      tags: [내장 PM]
      summary: PM 계획 요청 이력 (대표 전용)
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 최근 요청 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [plans], properties: { plans: { type: array, items: { $ref: '#/components/schemas/PmPlan' } } } } } }
              example:
                data: { plans: [] }
    post:
      tags: [내장 PM]
      summary: 태스크 나누기 (대표 전용)
      description: |
        새 계획 흐름 3단계. **확정한 기능 명세와 확정한 API 계약**을 PM(NOMOS 내장)이 태스크 DAG(어느 레포·어느 역할이 무엇을 어떤 순서로)로 나눈다.
        PM은 명세·계약을 만들지 않는다 — 태스크의 `spec`은 확정한 기능 명세의 featureKey이고, 태스크에는 그 명세의 확정한 계약이 붙는다(브리핑 `contract`).
        `instruction`은 선택(버튼만 눌러도 된다). 초안의 `specs`는 항상 빈 배열이다(옛 초안 호환용 필드).
        **202로 바로 답하고 PM은 뒤에서 돈다**(수십 초~수 분). `GET .../pm/plans/{planId}`를 몇 초 간격으로 폴링해 `ready`·`failed`를 본다.

        - 확정한 기능 명세가 없으면 409 `NO_FEATURE_SPECS`(먼저 `POST .../pm/features` → 확정)
        - API가 필요한 기능의 계약이 확정되지 않았으면 409 `CONTRACTS_NOT_APPROVED`, details `{ featureKeys }` (BE 담당이 `POST /contracts/{id}/approve`)
        - 프로젝트당 진행 중인 요청은 하나(409 `PM_PLAN_IN_PROGRESS`)
        - 호출 전에 "누적 PM 비용 + 이번 호출의 최대치 > PM 예산"이면 409 `PM_BUDGET_EXCEEDED` —
          설계상 예산 초과는 대표 승인 카드가 떠야 하지만 **승인 경로 미구현**이라 거절만 한다
        - 서버에 PM 키가 없으면 503 `PM_UNAVAILABLE`
        - 초안은 명세·태스크 생성과 같은 코드 검증을 거친다. 틀리면 PM이 **한 번만** 고치고, 그래도 틀리면 `failed(invalid)`
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction: { type: string, maxLength: 8000, description: '나눌 때 덧붙일 지시(선택)' }
            example:
              instruction: 백엔드 API를 먼저 끝내고 화면은 병행해 주세요
      responses:
        '202':
          description: 접수됨(status=pending)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: pending, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: null, draft: null, error: null, costUsd: 0, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: null, rejectedAt: null, rejectReason: null, assignments: [] }
        '409':
          description: 진행 중인 요청 있음 · 예산 초과 · 끝난 프로젝트
          content:
            application/json:
              examples:
                진행중:
                  value: { error: { code: PM_PLAN_IN_PROGRESS, message: a PM plan is already being drafted for this project; wait for it to finish } }
                예산:
                  value: { error: { code: PM_BUDGET_EXCEEDED, message: 'PM budget would be exceeded: … 승인 경로 미구현 — …' } }
        '503':
          description: 서버에 PM 키(ANTHROPIC_API_KEY)가 없다
          content:
            application/json:
              example:
                error: { code: PM_UNAVAILABLE, message: the built-in PM is not configured on this server (ANTHROPIC_API_KEY) }

  /projects/{projectId}/pm/status:
    get:
      tags: [내장 PM]
      summary: PM 준비 상태 (대표 전용)
      description: |
        "계획 받기" 버튼을 켜기 전에 본다. **요청 자체를 막지는 않는다.**
        - `ready: false`, `reason: NO_API_KEY` — API 모드인데 서버에 키가 없다. 요청하면 503.
        - `ready: false`, `reason: WORKER_OFFLINE` — 중계 모드인데 대표 노트북의 pm-worker가 30초 넘게 작업을 확인하지 않았다(꺼져 있다).
          요청하면 받아지지만 아무도 가져가지 않아 `PM_TIMEOUT_MS`(기본 10분) 뒤 `failed(timeout)`이 된다.
          pm-worker는 3초마다 확인하므로 켜면 몇 초 안에 `ready: true`가 된다.
        - `pendingPlanId`가 있으면 작성 중인 계획이 있어 새 요청은 409다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 상태
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [provider, ready, reason, workerLastSeenAt, budgetUsd, spentUsd, pendingPlanId]
                    properties:
                      provider: { type: string, enum: [api, relay] }
                      ready: { type: boolean }
                      reason: { type: string, enum: [NO_API_KEY, WORKER_OFFLINE], nullable: true }
                      workerLastSeenAt: { type: string, format: date-time, nullable: true, description: '중계 모드에서 pm-worker가 마지막으로 작업을 확인한 시각' }
                      budgetUsd: { type: number }
                      spentUsd: { type: number }
                      pendingPlanId: { type: string, format: uuid, nullable: true }
              example:
                data: { provider: relay, ready: false, reason: WORKER_OFFLINE, workerLastSeenAt: null, budgetUsd: 5, spentUsd: 0.1077, pendingPlanId: null }
  /projects/{projectId}/pm/plans/{planId}:
    get:
      tags: [내장 PM]
      summary: 계획 상태·초안 (대표 전용)
      description: |
        `pending`이면 작성 중이다. `ready`면 `draft`를 검토한다 — 명세의 계약과 태스크별 담당 역할·선행 관계.
        `failed`면 `error.reason`으로 이유를 보여준다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 계획
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: ready, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: SEQUENTIAL, draft: { mode: SEQUENTIAL, rationale: 요구사항이 작고 명확하다, estimate: { workingDays: 10, notes: '' }, specs: [], tasks: [] }, error: null, costUsd: 0.4213, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: null, rejectedAt: null, rejectReason: null, assignments: [] }
        '404':
          description: 없는 계획
          content:
            application/json:
              example:
                error: { code: PLAN_NOT_FOUND, message: plan not found }

  /projects/{projectId}/pm/plans/{planId}/revise:
    post:
      tags: [내장 PM]
      summary: 수정 요청 (대표 전용)
      description: |
        `ready`인 초안에 피드백을 붙여 새 초안을 요청한다(이전 초안 + 피드백으로 새로 쓴다). 새 계획이 pending으로 생기고
        이전 초안은 그대로 남는다. 한 수정 체인에서는 하나만 적용할 수 있다.

        **수정 요청은 한 체인에서 3회까지**(서버 설정 `PM_MAX_REVISIONS`, 기본 3). 원본 요청은 세지 않고, 실패한 수정 요청도 센다.
        넘으면 409 `PLAN_REVISION_LIMIT`, `details: { limit, used }`. 새 계획 요청(`POST …/pm/plans`)은 새 체인이라 0부터 다시 센다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, maxLength: 8000 }
            example:
              feedback: 출석체크는 다음 단계로 미루고, 스터디 개설에 정원 설정을 넣어줘
      responses:
        '202':
          description: 새 초안 접수됨(status=pending)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 2c3d4e5f-6071-4b2c-9d3e-4f5a6b7c8d9e, projectId: '{{PROJECT_ID}}', status: pending, instruction: '3주 안에 …', feedback: 출석체크는 다음 단계로, parentPlanId: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, mode: null, draft: null, error: null, costUsd: 0, createdAt: '2026-09-30T02:05:00.000Z', appliedAt: null, rejectedAt: null, rejectReason: null, assignments: [] }
        '409':
          description: ready가 아닌 초안, 또는 수정 요청 한도 초과
          content:
            application/json:
              examples:
                상태:
                  value: { error: { code: PLAN_NOT_APPLICABLE, message: only a ready plan can be revised } }
                한도:
                  value: { error: { code: PLAN_REVISION_LIMIT, message: 'this plan has already been revised 3 time(s) (limit 3); start a new plan request instead', details: { limit: 3, used: 3 } } }

  /projects/{projectId}/pm/plans/{planId}/apply:
    post:
      tags: [내장 PM]
      summary: 초안 적용 (대표 전용)
      description: |
        저장된 초안을 **그대로** 명세·태스크로 만든다(명세·태스크 생성과 같은 검증·잠금, `source: pm`). 시험지는 만들지 않는다.
        태스크는 READY라 배정된 에이전트가 바로 수령할 수 있다. **G1(프로젝트 시작)이 아니다** — 프로젝트 상태는 그대로다.

        - 두 번 적용하거나 같은 수정 체인의 다른 초안을 적용하면 409 `PLAN_NOT_APPLICABLE`
        - 초안 뒤에 상황이 바뀌어 검증에 걸리면 422 `PLAN_INVALID` — 아무것도 만들지 않고 계획은 `ready`로 남는다. 수정 요청으로 이어가면 된다
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 적용됨(status=applied)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: applied, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: SEQUENTIAL, draft: null, error: null, costUsd: 0.4213, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: '2026-09-30T02:10:00.000Z', rejectedAt: null, rejectReason: null, assignments: [] }
        '409':
          description: 적용할 수 없는 상태
          content:
            application/json:
              example:
                error: { code: PLAN_NOT_APPLICABLE, message: another plan in this revision chain has already been applied }
        '422':
          description: 초안 이후 상황이 바뀌어 검증 실패(계획은 ready로 남는다)
          content:
            application/json:
              example:
                error: { code: PLAN_INVALID, message: 명세·태스크 검증 실패 1건, details: [{ where: 'tasks[api]', message: '태스크 "T-1"이 프로젝트에 이미 있다 (다시 보낸 건 아닌가?)' }] }

  /pm/jobs/next:
    get:
      tags: [내장 PM]
      summary: (중계 모드) 다음 PM 작업 가져가기 — 대표의 pm-worker 전용
      description: |
        **서버가 `PM_PROVIDER=relay`일 때만 쓴다.** 결제 전까지 PM의 모델 호출을 대표 노트북의 Claude Code로 대신 돌리는 임시 방식이다 —
        `npm run executor pm-worker`가 몇 초마다 부른다. 사람이 직접 부를 일은 없다.
        API 모드(`PM_PROVIDER=api`, 기본)에서는 409 `PM_RELAY_DISABLED`.

        조직 **대표 본인의** 에이전트만 가져간다(그 밖은 403 `NOT_REPRESENTATIVE`). 한 번 가져간 작업은 다시 나오지 않고, 없으면 `job: null`.
        아무도 가져가지 않으면 `PM_TIMEOUT_MS` 뒤 계획이 `failed(timeout)`가 된다.
      security: [{ agentToken: [] }]
      responses:
        '200':
          description: 작업(없으면 null)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [job]
                    properties:
                      job: { $ref: '#/components/schemas/PmRelayJob', nullable: true }
              example:
                data: { job: null }
        '409':
          description: 서버가 API 모드다
          content:
            application/json:
              example:
                error: { code: PM_RELAY_DISABLED, message: 'this server calls the model API directly (PM_PROVIDER=api); no pm-worker is needed' }
  /pm/jobs/{jobId}/result:
    post:
      tags: [내장 PM]
      summary: (중계 모드) PM 작업 결과 제출 — 대표의 pm-worker 전용
      description: |
        모델이 낸 텍스트를 **그대로** 돌려준다. 해석·검증·교정·비용 기록은 API 모드와 똑같이 서버가 한다 —
        결과는 `GET /projects/{projectId}/pm/plans/{planId}`의 `draft`로 보인다.
        가져간 에이전트가 아니거나 이미 끝난(시간 제한·재시작) 작업이면 404 `PM_JOB_NOT_FOUND`.
      security: [{ agentToken: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopReason, servedModel, text, usage]
              properties:
                stopReason: { type: string, nullable: true, description: 'refusal·max_tokens면 서버가 refused·truncated로 닫는다' }
                servedModel: { type: string, nullable: true }
                text: { type: string, description: '모델 출력(JSON 텍스트) 그대로' }
                usage:
                  type: object
                  required: [inputTokens, outputTokens, cacheWriteTokens, cacheReadTokens]
                  properties:
                    inputTokens: { type: integer }
                    outputTokens: { type: integer }
                    cacheWriteTokens: { type: integer }
                    cacheReadTokens: { type: integer }
      responses:
        '200':
          description: 받음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PmRelayAccepted' }
              example: { data: { accepted: true } }
        '404':
          description: 없는 작업
          content:
            application/json:
              example:
                error: { code: PM_JOB_NOT_FOUND, message: 'relay job not found (finished, timed out, or the server restarted)' }
  /pm/jobs/{jobId}/failure:
    post:
      tags: [내장 PM]
      summary: (중계 모드) PM 작업 실패 보고 — 대표의 pm-worker 전용
      description: |
        노트북에서 claude 실행이 실패했다(로그인 안 됨·실행 오류 등). 시간 제한까지 기다리지 않고 계획을 `failed(api_error)`로 닫는다.
        `message`는 `error.detail.message`에 남는다.
      security: [{ agentToken: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: 받음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PmRelayAccepted' }
              example: { data: { accepted: true } }
        '404':
          description: 없는 작업
          content:
            application/json:
              example:
                error: { code: PM_JOB_NOT_FOUND, message: 'relay job not found (finished, timed out, or the server restarted)' }

  /projects/{projectId}/pm/plans/{planId}/reject:
    post:
      tags: [내장 PM]
      summary: 초안 반려 (대표 전용)
      description: |
        `ready` 초안을 버린다(`rejected`). **다시 받지 않고 닫는 것**이다 — 고쳐서 다시 받으려면 `revise`(수정 요청)를 쓴다.
        반려한 초안은 적용·수정 요청할 수 없다(409). 본문은 없어도 된다(사유는 선택, 1000자 이하).
        `ready`가 아니면(작성 중·실패·이미 적용·이미 반려) 409 `PLAN_NOT_APPLICABLE`.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
            example: { reason: 출석은 이번 범위가 아니다 }
      responses:
        '200':
          description: 반려됨(status=rejected)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: rejected, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: SEQUENTIAL, draft: null, error: null, costUsd: 0.1150, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: null, rejectedAt: '2026-09-30T02:10:00.000Z', rejectReason: 출석은 이번 범위가 아니다, assignments: [] }
        '409':
          description: ready가 아니다
          content:
            application/json:
              example:
                error: { code: PLAN_NOT_APPLICABLE, message: 'only a ready plan can be rejected (this one is applied)' }

  /projects/{projectId}/specs:
    get:
      tags: [명세·태스크 작성]
      summary: 명세 목록 (시험지 포함)
      description: |
        태스크를 만들 때 명세를 고르는 목록이다. 볼 수 있는 범위는 태스크 목록과 같다 — 사람은 볼 수 있는 프로젝트
        (대표는 전체, 팀원은 배정된 것), 에이전트는 자기 프로젝트. **에이전트 토큰으로 보면 잠긴 시험지만 있다**
        (브리핑과 같은 규칙 — 초안을 보면 "통과하도록 코드를 맞추는" 대상이 된다).
      security: [{ userToken: [] }, { agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: featureKey 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [specs], properties: { specs: { type: array, items: { $ref: '#/components/schemas/Spec' } } } } } }
              example:
                data:
                  specs:
                    - id: 5d1f0c3e-7a2b-4c1d-9e8f-0a1b2c3d4e5f
                      featureKey: F-05
                      title: 스터디 대기열 신청
                      content: WHEN 정원이 찬 스터디에 신청하면 THEN 202와 waitlistPosition을 반환한다
                      version: 1
                      createdAt: '2026-09-30T02:00:00.000Z'
                      tests:
                        - { id: 6e2a1d4f-8b3c-4d2e-af90-1b2c3d4e5f60, criterion: 정원이 찬 신청은 202와 대기 순번, testCode: 'expect(res.status).toBe(202)', lockedAt: '2026-09-30T02:00:00.000Z' }
        '403':
          description: 볼 수 없는 프로젝트
          content:
            application/json:
              example:
                error: { code: NOT_PROJECT_MEMBER, message: you are not a member of this project }
    post:
      tags: [명세·태스크 작성]
      summary: 명세 생성 (대표 전용)
      description: |
        명세 1개와 시험지(수용 기준) 여러 개를 만든다. 프로젝트가 `planning`·`active`일 때만.

        **시험지의 `locked`는 필수이고, 만들 때만 정한다.** 잠근 시험지만 V2의 근거가 된다
        (`locked_at < artifacts.created_at`). 나중에 잠그는 API는 없다 — 이미 제출된 산출물보다 늦게 잠긴 시험지가 생기기 때문이다.

        **시험지는 V2에서 팀원 노트북에서 실행되는 코드다.**

        검증 위반은 전부 모아 **422 `PLAN_INVALID`**의 `details`로 돌려준다(같은 featureKey 등).
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureKey, title, content]
              properties:
                featureKey: { type: string, maxLength: 32 }
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 20000 }
                tests:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [criterion, testCode, locked]
                    properties:
                      criterion: { type: string, maxLength: 500 }
                      testCode: { type: string, maxLength: 50000 }
                      locked: { type: boolean, description: '필수. true면 지금 잠긴다(V2 근거)' }
            example:
              featureKey: F-05
              title: 스터디 대기열 신청
              content: WHEN 정원이 찬 스터디에 신청하면 THEN 202와 waitlistPosition을 반환한다
              tests:
                - { criterion: 정원이 찬 신청은 202와 대기 순번, testCode: 'expect(res.status).toBe(202)', locked: true }
      responses:
        '201':
          description: 만들어진 명세
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Spec' } } }
              example:
                data: { id: 5d1f0c3e-7a2b-4c1d-9e8f-0a1b2c3d4e5f, featureKey: F-05, title: 스터디 대기열 신청, content: 'WHEN … THEN …', version: 1, createdAt: '2026-09-30T02:00:00.000Z', tests: [] }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 끝났거나 멈춘 프로젝트(completed·aborted·halted)
          content:
            application/json:
              example:
                error: { code: PROJECT_NOT_OPEN, message: 'project is completed; specs and tasks can be added only while planning or active' }
        '422':
          description: 검증 위반 전부
          content:
            application/json:
              example:
                error:
                  code: PLAN_INVALID
                  message: 명세·태스크 검증 실패 1건
                  details: [{ where: 'specs[F-05]', message: '명세 F-05가 프로젝트에 이미 있다 (다시 보낸 건 아닌가?)' }]

  /projects/{projectId}/tasks:
    post:
      tags: [명세·태스크 작성]
      summary: 태스크 생성 (대표 전용)
      description: |
        만들어진 태스크는 `READY`라 배정된 에이전트가 바로 수령할 수 있다. 프로젝트가 `planning`·`active`일 때만.

        - `repoId` — 이 프로젝트에 연결된 레포만
        - `specId` — **IMPLEMENT는 필수**, INTEGRATION·REWORK는 생략 가능
        - `teamRole` — 필수. `null`은 역할 제한 없음(통합 태스크)
        - `dependsOn` — 이 프로젝트의 기존 태스크 id. 선행이 DONE이 돼야 수령할 수 있다
        - 같은 제목은 거부한다(버튼 두 번 누르기 방지)

        검증 위반은 전부 모아 **422 `PLAN_INVALID`**의 `details`로 돌려준다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, teamRole, repoId]
              properties:
                title: { type: string, maxLength: 200 }
                teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
                kind: { type: string, enum: [IMPLEMENT, INTEGRATION, REWORK], default: IMPLEMENT }
                repoId: { type: string, format: uuid }
                specId: { type: string, format: uuid, nullable: true }
                dependsOn: { type: array, maxItems: 50, items: { type: string, format: uuid } }
            example:
              title: T-052 대기열 신청 버튼
              teamRole: FRONTEND
              repoId: '{{REPO_API}}'
              specId: null
              kind: INTEGRATION
              dependsOn: []
      responses:
        '201':
          description: 만들어진 태스크(READY)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
              example:
                data: { id: 7f3b2e5a-9c4d-4e3f-b0a1-2c3d4e5f6071, projectId: '{{PROJECT_ID}}', repoId: '{{REPO_API}}', specId: null, kind: INTEGRATION, title: T-052 대기열 신청 버튼, state: READY, teamRole: FRONTEND, assigneeAgentId: null, branchName: null, blockedReason: null, retryCount: 0, claimedAt: null }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 끝났거나 멈춘 프로젝트
          content:
            application/json:
              example:
                error: { code: PROJECT_NOT_OPEN, message: 'project is halted; specs and tasks can be added only while planning or active' }
        '422':
          description: 검증 위반 전부
          content:
            application/json:
              example:
                error:
                  code: PLAN_INVALID
                  message: 명세·태스크 검증 실패 2건
                  details:
                    - { where: 'tasks[task]', message: '레포 … 는 이 프로젝트에 연결돼 있지 않다 (연결된 레포: acme/study-api)' }
                    - { where: 'tasks[task]', message: '구현(IMPLEMENT) 태스크에는 명세가 필요하다 (명세 없이 만들 수 있는 건 INTEGRATION·REWORK)' }
    get:
      tags: [태스크·노트]
      summary: 태스크 목록
      description: |
        웹 UI(사람 토큰)와 Executor 폴링(에이전트 토큰)이 **같은 엔드포인트**를 쓴다.

        에이전트 토큰이면 `teamRole` 질의를 무시하고 자기 역할로 강제 필터한다 — 남의 역할 태스크가
        목록에 아예 없어야 "잡아보고 403"을 반복하지 않는다.
      security: [{ agentToken: [] }, { userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: state, in: query, schema: { type: string, enum: [READY, CLAIMED, IN_PROGRESS, VERIFYING, AWAITING_APPROVAL, BLOCKED, ESCALATED, DONE, CANCELLED] } }
        - { name: teamRole, in: query, schema: { type: string, enum: [FRONTEND, BACKEND] }, description: 에이전트 토큰이면 무시된다 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 생성 순서대로. 정렬이 결정적이어야 폴링이 같은 태스크를 두고 경합하지 않는다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [tasks], properties: { tasks: { type: array, items: { $ref: '#/components/schemas/Task' } } } } } }
              example:
                data:
                  tasks:
                    - { id: '{{TASK_BE}}', title: 'T-001 참여 신청 API 구현', state: READY, teamRole: BACKEND, retryCount: 0 }

  /tasks/{taskId}/briefing:
    get:
      tags: [태스크·노트]
      summary: 태스크 브리핑 — 프롬프트·settings.json 재료 한 번에
      description: |
        Executor는 팀원 노트북에서 돌아 DB를 직접 못 본다. 여러 엔드포인트를 조합하게 하면 조합 방식이
        Executor마다 갈리므로 서버가 한 번에 준다 — 명세, 서버가 렌더한 인계 노트 블록(`notesBlock`),
        쓸 수 있는 경로, `.claude/settings.json`에 그대로 깔 `claudeSettings`, 그리고 V2가 돌릴 `specTests`.

        **CLAIM 전에도 받을 수 있다.** Executor가 작업공간을 먼저 만들고, claim은 모델이 도구로 하기 때문이다.
        남의 역할 태스크는 403이다 — 명세·노트를 미리 보지 못하게 한다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TaskBriefing' } } }
              example:
                data:
                  task: { id: '{{TASK_BE}}', title: 'T-001 참여 신청 API 구현', state: READY }
                  repo: { id: '{{REPO_API}}', fullName: acme/study-api, defaultBranch: main, devBranch: dev, cloneUrl: null }
                  spec: { featureKey: F-03, title: 참여 신청 API, content: 'WHEN 정원이 찬 스터디에 신청하면 THEN 409를 반환한다' }
                  notesBlock: "[인계 노트]\n#1 [명세 이탈] quota check moved to service\n  · handler was too late\n  영향: contracts/F-03.yaml"
                  writablePaths: [{ pathPattern: 'src/**', access: write, ownerRole: BACKEND }]
                  claudeSettings:
                    permissions:
                      deny: ['Read(**/.env*)', 'Read(!**/.env.example)', 'Edit(/contracts/**)', 'Edit(**/secrets/**)']
                  specTests: [{ id: 5f0e..., criterion: 정원이 찬 스터디 신청은 409다, lockedAt: '2026-09-21T00:00:00.000Z' }]
                  policyHash: '{{POLICY_HASH}}'

  /tasks/{taskId}/runs/start:
    post:
      tags: [룸]
      summary: Claude 실행 시작 보고 (Executor)
      description: |
        Executor가 Claude를 띄우기 직전에 부른다. 룸에 "에이전트를 실행합니다"가 남는다(이벤트 `AGENT_RUN_STARTED`).
        태스크를 잡는 것(`claim_task`)은 실행 **안에서** 모델이 하므로, 이 에이전트가 그 태스크를 잡고 있거나(CLAIMED·IN_PROGRESS)
        **지금 잡을 수 있으면**(READY·담당 없음·내 역할 또는 역할 제한 없음) 받는다. 아니면 409 `RUN_NOT_ALLOWED`.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '201':
          description: 시작 기록. attempt는 그때의 재시도 횟수
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [taskId, attempt], properties: { taskId: { type: string, format: uuid }, attempt: { type: integer } } } } }
        '409':
          description: 이 에이전트가 잡고 있지도, 잡을 수도 없는 태스크
          content:
            application/json:
              example:
                error: { code: RUN_NOT_ALLOWED, message: task ... is not held by this agent (state READY) }

  /tasks/{taskId}/runs/end:
    post:
      tags: [룸]
      summary: Claude 실행 종료 보고 (Executor)
      description: |
        Claude가 끝나면 부른다(이벤트 `AGENT_RUN_ENDED`). **제출 여부는 서버가 태스크 상태로 정한다** — 이 에이전트가 아직 잡고 있으면
        제출하지 않은 것이다. 그때는 같은 트랜잭션에서 태스크가 **BLOCKED(AGENT_STOPPED)**로 바뀌고(이벤트 `TASK_BLOCKED`), 룸에
        "멈췄습니다 — 사유 / 거부된 명령 → 대표 확인 후 재개가 필요합니다"가 남는다. 재시도 횟수는 오르지 않는다.
        Executor가 꺼져 이 보고조차 오지 않으면 서버 감시가 45분 동안 응답이 없는 수령을 같은 방식으로 멈춘다.
        에이전트 연결이 해제되면 서버가 열린 실행을 `outcome: disconnected`로 대신 닫는다 — 그 뒤의 이 보고는 토큰이 막혀 401이다(Executor는 보내지 않는다).
        열린 실행(시작하고 아직 안 끝낸 것)이 없으면 409 `RUN_NOT_OPEN`.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, committed, durationMs, exitCode]
              properties:
                outcome: { type: string, enum: [completed, timeout, failed], description: 'completed=정상 종료, timeout=시간 제한, failed=비정상 종료' }
                committed: { type: boolean, description: '실행 동안 새 커밋이 생겼나' }
                durationMs: { type: integer, minimum: 0 }
                exitCode: { type: integer, nullable: true }
                lastMessage: { type: string, maxLength: 2000, nullable: true, description: '모델의 마지막 말. 제출하지 않았으면 멈춤 사유로 룸에 보인다' }
                deniedCommands: { type: array, maxItems: 20, items: { type: string, maxLength: 300 }, description: '실행 중 거부된 쉘 명령(Executor가 실행 기록에서 뽑는다)' }
            example: { outcome: completed, committed: false, durationMs: 48000, exitCode: 0, lastMessage: 'git merge 권한이 없어 통합 확인을 할 수 없습니다', deniedCommands: ['git fetch --all'] }
      responses:
        '200':
          description: 종료 기록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [submitted, taskState, blocked], properties: { submitted: { type: boolean }, taskState: { type: string }, blocked: { type: boolean, description: '제출하지 않아 BLOCKED(AGENT_STOPPED)로 멈췄다' } } } } }
        '409':
          description: 열린 실행이 없음
          content:
            application/json:
              example:
                error: { code: RUN_NOT_OPEN, message: no open run for task ... }

  /tasks/{taskId}/activity:
    post:
      tags: [룸]
      summary: 실행 중 도구 사용 보고 (Executor)
      description: |
        Executor가 Claude 출력에서 도구 사용과 에이전트의 말을 뽑아 2초마다 묶어 보낸다(최대 50줄). 받는 것: 도구 종류·대상(작업공간 기준 경로·명령 첫 줄, 300자)·
        성공 여부·수정 줄 수, 에이전트의 말(`say`, 500자 — 020). **파일 내용·diff·명령 출력은 받지 않는다.** 열린 실행에만 붙는다(409 `RUN_NOT_OPEN`).
        이벤트가 아니라 `agent_activity`에 쌓이고, 화면 스트림에는 `room` 토픽으로 알린다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [kind, target]
                    properties:
                      kind: { type: string, enum: [read, edit, write, run, search, other, say], description: 'say = 에이전트의 말(020)' }
                      target: { type: string, maxLength: 500, description: '도구 대상(경로·명령 첫 줄) 300자, say면 그 말 500자' }
                      ok: { type: boolean, nullable: true, description: '도구 결과가 오류가 아니었는가. 결과를 못 받았으면 생략' }
                      added: { type: integer, minimum: 0, nullable: true, description: '수정·작성으로 더한 줄 수(내용은 보내지 않는다)' }
                      removed: { type: integer, minimum: 0, nullable: true, description: '수정으로 뺀 줄 수' }
            example:
              items:
                - { kind: say, target: 레포 구조를 먼저 살펴보겠습니다. }
                - { kind: read, target: src/routes/auth.ts, ok: true }
                - { kind: edit, target: src/routes/auth.ts, ok: true, added: 12, removed: 3 }
                - { kind: run, target: npm test, ok: false }
      responses:
        '201':
          description: 기록함
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [recorded], properties: { recorded: { type: integer } } } } }
        '409':
          description: 열린 실행이 없음
          content:
            application/json:
              example:
                error: { code: RUN_NOT_OPEN, message: no open run for task ... }

  /tasks/{taskId}/cancel:
    post:
      tags: [룸]
      summary: 태스크 취소 (대표 전용)
      description: |
        재실행으로 풀리지 않는 태스크(잘못 나눔·필요 없어짐)를 닫는다(027). 지우지 않고 `CANCELLED`로 남는다.
        통합 확인(G3)의 "모든 태스크 완료"와 뒤 태스크의 선행 조건에서 **끝난 것으로 센다** — 이 태스크를 선행으로 둔 태스크는 풀린다.
        그 태스크의 대기 질문은 만료로 닫힌다. 대신할 일은 새 태스크로 만든다.
        에이전트가 붙잡지 않은 상태(READY·BLOCKED·ESCALATED)에서만 — 작업 중·승인 대기면 409 `TASK_IN_PROGRESS`, 이미 끝났으면 409 `TASK_ALREADY_CLOSED`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000, description: '왜 취소하나(룸에 보인다)' }
            example: { reason: '로그인 화면 태스크와 겹친다 — 그쪽에서 처리' }
      responses:
        '200':
          description: 취소됨(CANCELLED)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }

  /tasks/{taskId}/manual-completion:
    post:
      tags: [룸]
      summary: 사람이 직접 완료 (그 역할 담당 또는 대표)
      description: |
        에이전트가 끝내 못 한 일을 개발자가 직접 커밋해 넘긴다(027). 커밋을 태스크 브랜치에 push한 뒤 sha와 **태스크 브랜치에서 바꾼 모든 경로**를 낸다.
        에이전트 제출과 **같은 V3**(실제 diff와 신고 대조, 경로 소유권)를 서버가 돌린다 — 실패면 아무것도 바뀌지 않고 422 `MANUAL_COMPLETION_INVALID`(details에 undeclared·overdeclared·거부 사유).
        서버가 커밋을 읽지 못하면(레포 clone_url·GitHub 미연결 — V3 SKIPPED) 받지 않는다: 409 `MANUAL_COMPLETION_UNVERIFIABLE`. 확인 안 된 sha로 DONE이 되지 않게.
        통과하면 산출물(gateMode HUMAN)과 V3 결과가 남고 태스크는 DONE, 이벤트 `TASK_COMPLETED_MANUALLY`(지표에서 사람이 처리한 것으로 따로 센다).
        에이전트가 붙잡지 않은 상태(READY·BLOCKED·ESCALATED)에서만. 그 역할 담당(에이전트 주인)이나 대표가 아니면 403 `NOT_TASK_OWNER`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitSha, changedPaths]
              properties:
                commitSha: { type: string, description: '태스크 브랜치에 push한 커밋(7~64자 hex)' }
                changedPaths: { type: array, items: { type: string }, minItems: 1, description: '기본 브랜치에서 갈라진 뒤 태스크 브랜치가 바꾼 경로 전부' }
                note: { type: string, nullable: true, maxLength: 1000 }
            example: { commitSha: 'a1b2c3d', changedPaths: ['src/routes/studies.ts'], note: '정원 계산 로직을 직접 고쳤다' }
      responses:
        '200':
          description: 완료됨(DONE)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }

  /tasks/{taskId}/resume:
    post:
      tags: [룸]
      summary: 멈춘·재시도 소진 태스크 재개 (대표 전용)
      description: |
        두 경우를 다시 돌린다. READY로 돌아가고 담당이 비어 같은 역할의 에이전트가 다시 가져간다(룸에 "다시 실행해 주세요 (재개)").
        - 에이전트가 제출 없이 멈춘 태스크(BLOCKED·`AGENT_STOPPED`): **재시도 횟수는 그대로다** — 권한·환경 탓은 에이전트 실패가 아니다.
        - 재시도를 다 쓴 태스크(`ESCALATED`): 원인을 확인한 대표가 다시 맡긴다. **재시도 횟수를 0으로 돌린다**(이전 횟수는 이벤트 `TASK_RESUMED.payload.previousRetryCount`).
        둘 다 아니면 409 `TASK_NOT_STOPPED`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, nullable: true, description: '무엇을 해결했는지(룸에 보인다)' }
            example: { note: 'python 실행을 허용했습니다' }
      responses:
        '200':
          description: 재개됨(READY)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
        '403':
          description: 대표가 아님
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: only the representative can resume a stopped task }
        '409':
          description: 멈춘 태스크가 아님
          content:
            application/json:
              example:
                error: { code: TASK_NOT_STOPPED, message: 'task ... is not stopped (state CLAIMED, reason -)' }

  /tasks/{taskId}/branch:
    patch:
      tags: [태스크·노트]
      summary: 작업 브랜치 보고
      description: |
        Executor가 worktree를 만들면서 정한 브랜치 이름을 서버에 알린다. 서버가 정본을 들고 있어야
        재실행·이어받기에서 같은 브랜치를 쓰고 나중에 PR을 열 때도 이 값을 본다.

        **이미 값이 있으면 덮어쓰지 않는다** — 브랜치가 바뀌면 이전 작업물을 찾을 수 없게 된다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchName]
              properties:
                branchName: { type: string, maxLength: 200, pattern: '^[A-Za-z0-9._/-]+$' }
            example: { branchName: 'task/1d5c8f2a' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
              example:
                data: { id: '{{TASK_BE}}', branchName: 'task/1d5c8f2a', state: CLAIMED }

  /artifacts/{artifactId}/verifications:
    post:
      tags: [검증]
      summary: 브릿지 단계(V2·V4) 보고
      description: |
        V2(PM 시험지)와 V4(린트)는 작업공간이 있어야 돌 수 있어 제출 시점에는 결과가 물리적으로
        존재할 수 없다. 그래서 이 단계만 브릿지가 나중에 보고한다.

        **V1A·V1B·V3은 받지 않는다**(403 `VERIFICATION_STAGE_NOT_REPORTABLE`). 로컬이 보고한 V3를
        서버가 받으면 "로컬을 신뢰하지 않는다"는 V3의 전제가 무너진다.

        `SKIPPED`는 반드시 `detail.reason`을 함께 보낸다 — 사유 없는 SKIPPED는 나중에 PASS와 구분되지 않는다.

        V2를 `PASS`로 보고해도 서버가 `spec_tests.locked_at < artifacts.created_at`을 다시 확인하고,
        산출물보다 늦게 잠긴 시험지가 있으면 `FAIL`로 뒤집는다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, result]
              properties:
                stage: { type: string, enum: [V2, V4] }
                result: { type: string, enum: [PASS, FAIL, SKIPPED] }
                detail: { type: object }
                durationMs: { type: integer, minimum: 0 }
            examples:
              린트통과:
                value: { stage: V4, result: PASS, detail: { command: 'npm run lint' }, durationMs: 4200 }
              시험지없음:
                value: { stage: V2, result: SKIPPED, detail: { reason: '작업공간에 vitest가 설치돼 있지 않다' } }
              린트실패:
                value: { stage: V4, result: FAIL, detail: { exitCode: 1, output: "src/index.ts:3:1 error" } }
      responses:
        '201':
          description: |
            기록됨. 응답은 이 산출물의 **전체** 결론이다 — 필요한 단계(V3·V2·V4)가 모두 들어오고
            하나도 FAIL이 아니면 `DONE`(gateMode가 AUTO가 아니면 `AWAITING_APPROVAL`)이 된다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/VerificationSummary' } } }
              example:
                data:
                  artifactId: 44444444-4444-4444-4444-444444444444
                  attempt: 1
                  stages:
                    - { stage: V1A, result: SKIPPED }
                    - { stage: V1B, result: SKIPPED }
                    - { stage: V2, result: SKIPPED }
                    - { stage: V3, result: PASS }
                    - { stage: V4, result: PASS }
                  outcome: DONE
                  taskState: DONE
                  retryCount: 0
        '400':
          description: 사유 없는 SKIPPED
          content:
            application/json:
              example:
                error: { code: VALIDATION_ERROR, message: SKIPPED must carry detail.reason }
        '403':
          description: 서버가 판정하는 단계이거나, 남의 태스크다
          content:
            application/json:
              examples:
                서버판정단계:
                  value: { error: { code: VERIFICATION_STAGE_NOT_REPORTABLE, message: stage V3 is judged by the server } }
                남의태스크:
                  value: { error: { code: NOT_TASK_ASSIGNEE, message: task is assigned to another agent } }
        '409':
          description: |
            같은 단계를 두 번 보고했다. 재제출은 attempt가 올라간 **새 산출물**이므로, FAIL을 PASS로
            갈아치우는 경로는 없다.
          content:
            application/json:
              example:
                error: { code: VERIFICATION_ALREADY_RECORDED, message: V4 is already recorded for this artifact }
    get:
      tags: [검증]
      summary: 검증 결과 조회
      description: 무엇이 PASS였고 무엇을 **왜** 못 돌렸는지 본다. SKIPPED의 `detail.reason`이 그 답이다.
      security: [{ agentToken: [] }, { userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      responses:
        '200':
          description: stage 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [verifications], properties: { verifications: { type: array, items: { $ref: '#/components/schemas/Verification' } } } } } }
              example:
                data:
                  verifications:
                    - stage: V1A
                      result: SKIPPED
                      executedBy: server
                      detail: { reason: '계약 대조 검사 미구현 — 확정한 계약(contracts)은 있지만 BE 구현(코드·실제 응답)을 서버가 읽어 비교하는 단계가 아직 없다' }
                    - stage: V3
                      result: FAIL
                      executedBy: server
                      durationMs: 732
                      detail:
                        reason: 'changed_paths가 커밋의 실제 diff와 다르다'
                        undeclared: [README.md]
                        overdeclared: []
