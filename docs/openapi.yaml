      description: |
        내가 그 역할 담당인 **1차 검토 대기**(`stage=role_review`, 결정 전) 카드 — 조직 전체, 요청 시각 최신순. 승인·반려하면 목록에서 빠진다.
        역할에서 빠지면(해제·탈퇴) 보이지 않는다(그 카드는 대표가 처리한다). 대표는 1차 검토 대상이 아니라 보통 빈 목록이다 — 대표의 대기열은 `GET /orgs/{orgId}/approvals`.
        실시간: 프로젝트 토픽 `approvals` 신호를 받으면 다시 읽는다.
      security: [{ userToken: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 요청 시각 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approvals]
                    properties:
                      approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
  /projects/{projectId}/approvals:
    get:
      tags: [승인]
      summary: 프로젝트 승인 이력
      description: 볼 수 있는 범위는 태스크·노트와 같다(대표는 전부, 팀원은 배정된 프로젝트). 1차 검토는 그 역할 담당·대표가, 최종은 대표가 결정한다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, decided, all], default: pending } }
        - { name: stage, in: query, required: false, description: '단계로 거른다(role_review 역할 담당 1차 검토 · final 대표 최종)', schema: { type: string, enum: [role_review, final, all], default: all } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 요청 시각 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approvals]
                    properties:
                      approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
              example:
                data:
                  approvals:
                    - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      projectId: '{{PROJECT_ID}}'
                      projectName: 스터디 관리 웹앱 v1
                      gate: ACTION
                      stage: role_review
                      reviewer: { userId: 22222222-2222-4222-8222-222222222222, nickname: 민수 }
                      roleReview: null
                      taskId: '{{TASK_BE}}'
                      taskTitle: T-001 참여 신청 API 구현
                      taskState: AWAITING_APPROVAL
                      artifactId: 44444444-4444-4444-4444-444444444444
                      gateMode: HUMAN
                      payload: { taskTitle: T-001 참여 신청 API 구현, commitSha: a1b2c3d, changedPaths: [migrations/010_x.sql], triggeredActions: ['artifact:submit', 'db:migration'], gateMode: HUMAN, attempt: 1, stages: [{ stage: V3, result: PASS }] }
                      decision: null
                      decidedBy: null
                      reason: null
                      requestedAt: '2026-10-05T01:00:00.000Z'
                      decidedAt: null
  /approvals/{approvalId}/approve:
    post:
      tags: [승인]
      summary: 승인 (1차 검토는 역할 담당·대표, 최종은 대표)
      description: |
        - `stage=role_review`(1차 검토): 그 카드의 `reviewer`(지금도 그 역할 담당일 때) 또는 대표가 승인한다. 이 카드가 닫히고 같은 스냅샷으로
          **대표의 final 카드가 새로 생긴다** — 태스크는 `AWAITING_APPROVAL` 그대로다. 대표가 대신 처리하면 `roleReview.decidedByRepresentative: true`.
        - `stage=final`(최종) · G3: 대표만. 태스크가 `DONE`이 된다(G3는 프로젝트 completed). 뒤에 걸린 태스크가 풀리면 담당 에이전트에게 바로 간다.
          대표가 자기 에이전트의 산출물을 승인하면 이벤트에 `selfApproval: true`가 남는다.
        응답은 결정한 그 카드다(1차 검토 승인이면 닫힌 role_review 카드 — 새 final 카드는 목록에서 읽는다).
      security: [{ userToken: [] }]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, minLength: 1, maxLength: 2000, description: '선택 메모 — 1차 검토면 final 카드의 roleReview.note로 대표에게 보인다' }
            example:
              note: 마이그레이션 down까지 확인했다
      responses:
        '200':
          description: 승인됨(decision=APPROVE — 1차 검토면 태스크 AWAITING_APPROVAL 그대로, 최종이면 DONE)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Approval' } } }
        '403':
          description: 이 카드를 결정할 자격이 없다 — 1차 검토는 그 역할 담당·대표, 최종·G3는 대표만
          content:
            application/json:
              example:
                error: { code: NOT_APPROVAL_REVIEWER, message: only the organization representative can make the final decision }
        '404':
          description: 없는 승인
          content:
            application/json:
              example:
                error: { code: APPROVAL_NOT_FOUND, message: approval not found }
        '409':
          description: 이미 결정됨, 또는 태스크가 더 이상 승인 대기가 아님
          content:
            application/json:
              examples:
                결정됨:
                  value: { error: { code: APPROVAL_ALREADY_DECIDED, message: approval was already decided (APPROVE) } }
                상태바뀜:
                  value: { error: { code: APPROVAL_STALE, message: the task is no longer awaiting approval (READY) } }
  /approvals/{approvalId}/reject:
    post:
      tags: [승인]
      summary: 반려 (1차 검토는 역할 담당·대표, 최종은 대표 — 사유 필수)
      description: |
        결정할 수 있는 사람은 승인과 같다. **어느 단계든** 태스크가 `READY`로 돌아가고(담당 비움) 재시도 횟수가 1 오른다 — **3회째는 `ESCALATED`**(검증 실패와 같은 횟수를 쓴다).
        1차 검토에서 반려하면 대표 대기열에 오지 않는다.
        같은 역할의 에이전트가 다시 받아 **같은 태스크 브랜치에서 이어서** 고친다. 사유는 그 시도의 브리핑(`lastRejection`, 누가 반려했는지 `rejectedBy`)으로 간다.
      security: [{ userToken: [] }]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
            example:
              reason: 마이그레이션에 down이 없다. 되돌릴 수 있게 추가해 달라
      responses:
        '200':
          description: 반려됨(decision=REJECT, 태스크 READY 또는 ESCALATED)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Approval' } } }
        '403':
          description: 이 카드를 결정할 자격이 없다 — 1차 검토는 그 역할 담당·대표, 최종·G3는 대표만
          content:
            application/json:
              example:
                error: { code: NOT_APPROVAL_REVIEWER, message: only the organization representative can make the final decision }
        '404':
          description: 없는 승인
          content:
            application/json:
              example:
                error: { code: APPROVAL_NOT_FOUND, message: approval not found }
        '409':
          description: 이미 결정됨, 또는 태스크가 더 이상 승인 대기가 아님
          content:
            application/json:
              examples:
                결정됨:
                  value: { error: { code: APPROVAL_ALREADY_DECIDED, message: approval was already decided (APPROVE) } }
                상태바뀜:
                  value: { error: { code: APPROVAL_STALE, message: the task is no longer awaiting approval (READY) } }
  /tasks/{taskId}/questions:
    post:
      tags: [질문]
      summary: 질문 올리기 (에이전트 — 브릿지가 대신 부른다, 실험)
      description: |
        실행 중인 에이전트가 AskUserQuestion으로 물으면 브릿지의 권한 도구가 여기에 올리고, 답이 오거나 만료될 때까지 기다린다.
        대상 역할은 서버가 정한다(지금은 묻는 쪽의 반대 역할). 그 태스크의 담당 에이전트만 물을 수 있다.
      security: [{ agentToken: [] }]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions: { type: array, items: { type: object, additionalProperties: true } }
            example:
              questions:
                - question: GET /api/studies/:id/members 의 응답 본문 형태는 무엇인가요?
                  header: 응답 형태
                  multiSelect: false
                  options: [{ label: '{ members: [...] }' }, { label: '배열 그대로' }]
      responses:
        '201':
          description: 올라감(status=pending)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentQuestion' } } }
        '422':
          description: 질문 형식 위반(개수·길이·중복 질문) — error.details에 전부
  /tasks/{taskId}/questions/{questionId}:
    get:
