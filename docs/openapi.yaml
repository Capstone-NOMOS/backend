# NOMOS API — 수동 테스트용 Swagger 문서.
#
# 손으로 쓴 문서다. 코드와 자동 동기화되지 않으므로 어긋나면 코드가 맞다.
# 자동 생성(zod-to-openapi)은 나중 과제. 지금 목적은 "브라우저에서 눌러보고 응답 확인"이다.
#
# {{...}} 자리표는 /docs/openapi.json을 서빙할 때 DB에서 읽어 채운다(src/openapi/spec.ts).
# 그래서 npm run seed로 id가 바뀌어도 브라우저를 새로고침하면 맞는 값이 들어온다.
openapi: 3.0.3

info:
  title: NOMOS API
  version: 0.1.0
  description: |
    에이전트 협업 조율 서버. 수동 테스트 절차는 `docs/manual-test.md`를 함께 보라.

    **토큰이 두 종류다.** 오른쪽 위 Authorize를 누르면 칸이 두 개 뜬다.

    | 칸 | 어떤 토큰 | 받는 법 |
    |---|---|---|
    | `userToken` | 사람 토큰 (`kind: user`) | `POST /auth/login` — 시드 계정 `rep` / `manual-test-1234` |
    | `agentToken` | 에이전트 토큰 (`kind: agent`) | `npm run seed` 출력의 **be-laptop access token**, 또는 `POST /agents/token/refresh` |

    서로의 API를 부를 수 없다. 사람 토큰으로 태스크 API를 부르면 401이다.

    **사람 토큰은 24시간**, 에이전트 access token은 **1시간**이다. 에이전트 토큰이 만료되면 `POST /agents/token/refresh`로 다시 받는다.
    사람 토큰에는 refresh가 없다 — 만료되면 다시 로그인한다.

    **응답 스키마(`schema`)는 일부 엔드포인트에만 있다.** 없는 곳은 `example`이 기준이다.

    **실시간 신호(웹소켓 `/api/stream`, 사람 토큰)** — OpenAPI로 표현할 수 없어 여기 적는다. 데이터가 아니라 "무엇을 다시 읽을지"만 온다.
    1. 연결 후 첫 메시지 `{ "type": "auth", "token": "<사람 토큰>" }` → `{ "type": "ready", userId, orgId, orgRole }`
    2. 프로젝트 화면에서 `{ "type": "subscribe", "projectId" }` → `{ "type": "subscribed", projectId }` (볼 수 없으면 `{ "type": "error", code, projectId }`)
    3. 변화가 커밋되면 `{ "type": "changed", projectId | null, topics: [...], lastEventId }` — topics에 맞는 API를 다시 읽는다
       - projectId가 있으면 프로젝트 토픽: `project` · `tasks` · `specs` · `plans` · `approvals` · `notes` · `members` · `events`
       - null이면 조직 토픽: `projects` · `approvals`(대표만) · `agents` · `repos` · `members`
    4. `{ "type": "resync" }`이면 서버가 신호를 놓쳤을 수 있다 — 화면 전체를 다시 읽는다. `unsubscribed`(배정 해제)도 온다.
    닫는 코드: 4400 잘못된 첫 메시지 · 4401 인증 실패(다시 로그인) · 4403 조직 없음 · 4408 10초 안에 인증 안 함.

servers:
  # 상대 경로 — Swagger UI가 이 문서를 서빙한 서버(로컬이든 운영이든)로 요청을 보낸다.
  # 절대 주소(http://localhost:3000)로 두면 운영 Swagger의 Try it out이 사용자 노트북의 localhost로 나가 브라우저가 막는다.
  - url: /api
    description: 이 문서를 서빙한 서버

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 사람 토큰. `POST /auth/login`의 `data.accessToken`을 붙여넣는다.
    agentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 에이전트 토큰. 시드 출력의 access token 또는 refresh 응답의 값을 붙여넣는다.

  schemas:
    LoginResult:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: '초 단위. 사람 토큰은 86400(24시간)' }
    Me:
      type: object
      required: [userId, loginId, nickname, githubLogin, orgId, orgName, orgRole]
      properties:
        userId: { type: string, format: uuid }
        loginId: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        githubLogin: { type: string, nullable: true, description: 'GitHub 연결 전이면 null' }
        orgId: { type: string, format: uuid, nullable: true, description: '조직이 없으면 null → 조직 만들기·초대 수락 화면으로' }
        orgName: { type: string, nullable: true }
        orgRole: { type: string, enum: [REPRESENTATIVE, MEMBER], nullable: true, description: '조직이 없으면 null' }
    Member:
      type: object
      required: [userId, loginId, nickname, githubLogin, name, orgRole]
      properties:
        userId: { type: string, format: uuid }
        loginId: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        githubLogin: { type: string, nullable: true }
        name: { type: string, nullable: true, description: 'GitHub 프로필 이름' }
        orgRole: { type: string, enum: [REPRESENTATIVE, MEMBER] }
        isCollaborator:
          type: boolean
          description: |
            **없을 수 있다.** 확인하지 못했으면(GitHub 토큰 없음·조회 실패·GitHub 미연결) 필드 자체를 생략한다.
            false는 "확인했는데 권한 없음"이다.
    OrgAgent:
      type: object
      required: [agentId, agentName, userId, nickname, connectedAt, online, lastSeenAt, assignment]
      properties:
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        userId: { type: string, format: uuid, description: '에이전트 주인' }
        nickname: { type: string, nullable: true, description: '주인의 닉네임' }
        connectedAt: { type: string, format: date-time, description: '처음 CLI로 연결한 시각' }
        online:
          type: boolean
          description: |
            지금 접속해 있는가 — 태스크 스트림(웹소켓)이 열려 있거나(CLI start·connect가 태스크를 기다리는 중)
            최근 60초 안에 인증된 요청이 있었다(폴링·pm-worker·MCP 도구). 서버 메모리 값이라 서버 재시작 직후에는 잠깐 false다.
        lastSeenAt: { type: string, format: date-time, nullable: true, description: '마지막으로 요청·연결이 있었던 시각(서버 재시작 뒤로는 null)' }
        assignment:
          type: object
          nullable: true
          description: '진행 중(completed·aborted가 아닌) 프로젝트 배정. 에이전트는 한 번에 하나만 맡는다'
          required: [projectId, teamRole]
          properties:
            projectId: { type: string, format: uuid }
            teamRole: { type: string, enum: [FRONTEND, BACKEND] }
    Project:
      type: object
      required: [id, orgId, name, autonomyPreset, policyHash, constitutionHash, pmBudgetUsd, budgetUsd, deadline, status, startedAt, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        autonomyPreset: { type: string, enum: [L1, L2, L3, L4] }
        policyHash: { type: string }
        constitutionHash: { type: string, nullable: true }
        pmBudgetUsd: { type: string, description: 'numeric이라 문자열로 나간다(예: "40.00")' }
        budgetUsd: { type: string, nullable: true }
        deadline: { type: string, format: date, nullable: true, description: 'YYYY-MM-DD' }
        status:
          type: string
          enum: [planning, active, halted, completed, aborted]
          description: '지금은 생성 시 planning에서 바뀌지 않는다(G1 승인 경로 미구현)'
        startedAt: { type: string, format: date-time, nullable: true, description: 'G1 승인 시각. 지금은 항상 null' }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    RepoListItem:
      type: object
      required: [id, fullName, githubRepoId, defaultBranch, devBranch, cloneUrl, ownershipAssigned, activeProjectId, activeProjectName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        githubRepoId: { type: integer, nullable: true }
        defaultBranch: { type: string }
        devBranch: { type: string }
        cloneUrl: { type: string, nullable: true }
        ownershipAssigned:
          type: boolean
          description: '소유 역할이 지정된 경로 규칙이 하나라도 있는가. false면 프로젝트 생성에서 422 REPO_OWNERSHIP_NOT_SET'
        activeProjectId:
          type: string
          format: uuid
          nullable: true
          description: |
            이 레포를 쓰고 있는 **진행 중 프로젝트**(planning·active·halted — completed·aborted가 아닌 것). null이 아니면 새 프로젝트에 넣을 수 없다
            (프로젝트 생성의 409 REPO_IN_ACTIVE_PROJECT와 같은 판정). halted도 포함한다 — 재개될 수 있어서다.
        activeProjectName: { type: string, nullable: true, description: 'activeProjectId 프로젝트의 이름' }
    Approval:
      type: object
      required: [id, projectId, projectName, gate, taskId, taskTitle, taskState, artifactId, gateMode, payload, decision, decidedBy, reason, requestedAt, decidedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        gate: { type: string, enum: [G1, G2, G3, ACTION], description: '지금은 ACTION(정책 판정이 HUMAN·PM_REVIEW인 산출물)만 생긴다' }
        taskId: { type: string, format: uuid }
        taskTitle: { type: string, nullable: true, description: '지금 태스크 제목(카드의 스냅샷은 payload.taskTitle)' }
        taskState: { type: string, nullable: true, description: '지금 태스크 상태' }
        artifactId: { type: string, format: uuid, nullable: true }
        gateMode:
          type: string
          nullable: true
          enum: [HUMAN, PM_REVIEW, null]
          description: 'PM_REVIEW는 PM 리뷰가 아직 없어 대표가 대신 처리한다(이벤트에 reviewer: human_fallback)'
        payload:
          type: object
          additionalProperties: true
          description: |
            요청 시점의 카드 스냅샷 — taskTitle, artifactId, attempt, commitSha, changedPaths, triggeredActions, gateMode, stages, submittedByAgentId.
            **backfilled: true**면 승인 기능 이전부터 멈춰 있던 태스크라 지금 DB에서 알 수 있는 값만 있다(stages 등 없음) — "정보 일부 없음"을 표시한다.
        decision: { type: string, enum: [APPROVE, REJECT, null], nullable: true, description: 'null이면 대기 중' }
        decidedBy: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true, description: '반려 사유(반려는 필수)' }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    ProjectEvent:
      type: object
      required: [id, type, ts, onBehalfOf, actorAgentId, payload, tokenCost, pathViolation]
      properties:
        id: { type: string, description: '이벤트 id(정수를 문자열로). 페이지 커서로 쓴다' }
        type: { type: string, description: 'TASK_CLAIMED, ARTIFACT_SUBMITTED, NOTE_PUBLISHED, PM_CALL, PROJECT_STARTED …' }
        ts: { type: string, format: date-time }
        onBehalfOf: { type: string, description: '책임 주체 — 사람 user id 또는 system:* 문자열' }
        actorAgentId: { type: string, format: uuid, nullable: true, description: '행동한 에이전트(사람이 직접 한 일이면 null)' }
        payload: { type: object, additionalProperties: true, description: 'type마다 모양이 다르다' }
        tokenCost: { type: number, nullable: true, description: '이 행의 비용(USD). 지금은 PM_CALL에만' }
        pathViolation: { type: boolean, nullable: true, description: 'TOOL_DENIED에서 남의 역할 소유 경로를 침범했는가' }
    InvitePreview:
      type: object
      required: [orgName, valid, teamRole, expiresAt]
      properties:
        orgName: { type: string, description: '없는 토큰이면 빈 문자열' }
        valid: { type: boolean }
        teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true, description: '초대 발급 때 적은 참고용 역할. 실제 배정은 프로젝트에서 따로 한다' }
        expiresAt: { type: string, format: date-time, nullable: true, description: '없는 토큰이면 null' }
        reason:
          type: string
          enum: [expired, used, not_found]
          description: 'valid=false일 때만 있다'
    SignupResult:
      type: object
      required: [userId, connectKey]
      properties:
        userId: { type: string, format: uuid }
        connectKey: { type: string, description: '평문은 이 응답에서 한 번만 나온다' }
    ConnectKey:
      type: object
      required: [connectKey]
      properties:
        connectKey: { type: string }
    AgentTokens:
      type: object
      required: [accessToken, refreshToken, agentId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        agentId: { type: string, format: uuid }
    DeviceStart:
      type: object
      required: [deviceCode, userCode, verificationUri, verificationUriComplete, expiresIn, interval]
      properties:
        deviceCode: { type: string, description: 'CLI가 poll에 쓰는 비밀. 이 응답에서 한 번만 나온다(서버는 해시만 저장)' }
        userCode: { type: string, description: '사람이 웹에서 확인하는 코드(예: WDJB-MJHT). 대소문자·하이픈은 무시된다' }
        verificationUri: { type: string, description: '{FRONTEND_BASE_URL}/connect/device' }
        verificationUriComplete: { type: string, description: '코드가 채워진 주소 — CLI가 브라우저로 연다' }
        expiresIn: { type: integer, description: '초. 10분' }
        interval: { type: integer, description: '초. 이 간격으로 poll한다' }
    DevicePoll:
      description: '중간 상태도 200이다. approved는 딱 한 번만 나오고 그 뒤로는 expired'
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [pending, expired, denied] }
        - type: object
          required: [status, interval]
          properties:
            status: { type: string, enum: [slow_down] }
            interval: { type: integer, description: '늘어난 간격(초). 이후 이 간격으로 부른다' }
        - type: object
          required: [status, accessToken, refreshToken, agentId, account]
          properties:
            status: { type: string, enum: [approved] }
            accessToken: { type: string }
            refreshToken: { type: string }
            agentId: { type: string, format: uuid }
            account:
              type: object
              description: '연결된 계정 — CLI가 출력해 남이 내 코드를 승인한 경우를 드러낸다'
              required: [loginId, nickname, orgName]
              properties:
                loginId: { type: string, nullable: true }
                nickname: { type: string, nullable: true }
                orgName: { type: string, nullable: true }
    DeviceRequest:
      type: object
      required: [userCode, status, agentName, harness, clientIp, requestedAt, expiresAt]
      properties:
        userCode: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, DENIED, CONSUMED, EXPIRED], description: 'EXPIRED는 저장하지 않고 만료 시각으로 계산한다' }
        agentName: { type: string }
        harness: { type: string }
        clientIp: { type: string, nullable: true, description: '요청한 CLI의 IP — 내가 아니면 거부하라는 판단 근거' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AgentAccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string }
    AgentSelf:
      type: object
      required: [agentId, name, maxConcurrent, projectId, teamRole]
      properties:
        agentId: { type: string, format: uuid }
        name: { type: string }
        maxConcurrent: { type: integer }
        projectId: { type: string, format: uuid }
        teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
    OrgCreated:
      type: object
      required: [orgId, userId]
      properties:
        orgId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
    GithubRepo:
      type: object
      required: [fullName, githubRepoId, defaultBranch]
      properties:
        fullName: { type: string }
        githubRepoId: { type: integer }
        defaultBranch: { type: string }
    ConnectedRepo:
      type: object
      required: [id, fullName, seededPathCount, rootOwnerRole]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        seededPathCount: { type: integer }
        rootOwnerRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true, description: '`**` 행의 소유 역할. 연결 때 ownerRole을 주지 않았으면 null(나중에 PATCH로 지정)' }
    CreatedGithubRepo:
      type: object
      required: [id, fullName, seededPathCount, rootOwnerRole, githubRepoId, defaultBranch, cloneUrl]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        seededPathCount: { type: integer }
        rootOwnerRole: { type: string, enum: [FRONTEND, BACKEND] }
        githubRepoId: { type: integer }
        defaultBranch: { type: string, description: 'GitHub 조직의 기본 브랜치 설정을 따른다(보통 main)' }
        cloneUrl: { type: string, description: 'V3가 커밋을 읽을 곳. 자동으로 채워진다' }
    GithubInviteResult:
      type: object
      required: [repoId, fullName, status]
      properties:
        repoId: { type: string, format: uuid }
        fullName: { type: string }
        status:
          type: string
          enum: [invited, already_collaborator, skipped, failed]
          description: |
            - invited: 초대장을 보냈다. **멤버가 GitHub에서 수락해야** 클론·push할 수 있다
            - already_collaborator: 이미 접근할 수 있다
            - skipped: 멤버나 대표가 GitHub를 연결하지 않아 보내지 못했다(reason)
            - failed: GitHub가 거부·실패했다(reason)
        reason: { type: string }
    RoomMessage:
      type: object
      required: [id, ts, speaker, type, taskId, taskTitle, text]
      properties:
        id: { type: string, description: '피드 커서로도 쓴다(before)' }
        ts: { type: string, format: date-time }
        speaker:
          type: string
          enum: [pm, nomos, agent]
          description: |
            - pm: 서버가 지시·판정을 알림(실행해 주세요, 검증 결과, 승인)
            - nomos: Executor가 보고한 실행 상태(수령, 구현 시작, 제출, 실행 종료)
            - agent: 에이전트가 쓴 도구(읽기·수정·실행) · 인계 노트
        type:
          type: string
          description: '원본 이벤트 타입(TASK_DISPATCHED 등) 또는 ACTIVITY_READ·ACTIVITY_EDIT·ACTIVITY_WRITE·ACTIVITY_RUN·ACTIVITY_SEARCH·ACTIVITY_OTHER. 아이콘용'
        taskId: { type: string, format: uuid, nullable: true }
        taskTitle: { type: string, nullable: true }
        text: { type: string, description: '화면에 그대로 보여 줄 문장(서버가 만든다)' }
    RoomSummary:
      type: object
      required: [role, agent, activeTasks]
      properties:
        role: { type: string, enum: [FRONTEND, BACKEND] }
        agent:
          type: object
          nullable: true
          description: 이 역할에 배정된 에이전트. 없으면 null
          required: [agentId, agentName, online, lastSeenAt]
          properties:
            agentId: { type: string, format: uuid }
            agentName: { type: string }
            online: { type: boolean }
            lastSeenAt: { type: string, format: date-time, nullable: true }
        activeTasks:
          type: array
          description: 진행 중(CLAIMED·IN_PROGRESS·VERIFYING·AWAITING_APPROVAL) 태스크
          items:
            type: object
            required: [id, title, state, teamRole]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              state: { type: string }
              teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
    RepoSettings:
      type: object
      required: [id, fullName, githubRepoId, defaultBranch, devBranch, cloneUrl]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        githubRepoId: { type: integer, nullable: true }
        defaultBranch: { type: string }
        devBranch: { type: string }
        cloneUrl: { type: string, nullable: true }
    RepoPath:
      type: object
      required: [id, repoId, pathPattern, ownerRole, access, actionKey, priority, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        repoId: { type: string, format: uuid }
        pathPattern: { type: string }
        ownerRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true, description: 'NULL이면 더 낮은 규칙의 소유 역할을 상속한다' }
        access: { type: string, enum: [write, read, denied] }
        actionKey: { type: string, nullable: true }
        priority: { type: integer }
        source: { type: string, enum: [seed, scan, manual] }
        createdAt: { type: string, format: date-time }
    InviteCreated:
      type: object
      required: [token, url, expiresAt, teamRole]
      properties:
        token: { type: string }
        url: { type: string, description: '{FRONTEND_BASE_URL}/invites/{token}' }
        expiresAt: { type: string, format: date-time }
        teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
    InviteAccepted:
      type: object
      required: [userId, orgId]
      properties:
        userId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
    DeviceCode:
      type: object
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode: { type: string, description: 'poll 때 되돌려준다. 서버는 보관하지 않는다' }
        userCode: { type: string, description: '사용자가 verificationUri에 입력할 코드' }
        verificationUri: { type: string }
        expiresIn: { type: integer }
        interval: { type: integer, description: '이 초마다 poll한다' }
    DeviceFlowStatus:
      description: '폴링의 중간 상태도 200이다. connected가 되면 멈춘다'
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [pending, expired, denied] }
        - type: object
          required: [status, interval]
          properties:
            status: { type: string, enum: [slow_down] }
            interval: { type: integer }
        - type: object
          required: [status, githubLogin]
          properties:
            status: { type: string, enum: [connected] }
            githubLogin: { type: string }
    ProjectRepo:
      type: object
      required: [id, orgId, fullName]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        fullName: { type: string }
    ProjectMember:
      type: object
      required: [agentId, agentName, teamRole, userId]
      properties:
        agentId: { type: string, format: uuid }
        agentName: { type: string }
        teamRole: { type: string, enum: [FRONTEND, BACKEND] }
        userId: { type: string, format: uuid, description: '에이전트 주인' }
    ProjectDetail:
      type: object
      required: [project, repos, members]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        repos: { type: array, items: { $ref: '#/components/schemas/ProjectRepo' } }
        members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }
    Task:
      type: object
      required: [id, projectId, repoId, specId, kind, title, state, teamRole, assigneeAgentId, branchName, blockedReason, retryCount, claimedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        repoId: { type: string, format: uuid }
        specId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [IMPLEMENT, INTEGRATION, REWORK] }
        title: { type: string }
        state: { type: string, enum: [READY, CLAIMED, IN_PROGRESS, VERIFYING, AWAITING_APPROVAL, BLOCKED, ESCALATED, DONE] }
        teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
        assigneeAgentId: { type: string, format: uuid, nullable: true }
        branchName: { type: string, nullable: true }
        blockedReason:
          type: string
          enum: [DISPUTE, DEPENDENCY, QUESTION, AGENT_STOPPED]
          nullable: true
          description: |
            state=BLOCKED일 때만 있다.
            AGENT_STOPPED = 에이전트가 제출 없이 멈췄다(권한·환경·응답 끊김). 사유는 이벤트 TASK_BLOCKED(룸 피드)에 있고, 대표가 `POST /tasks/{taskId}/resume`으로 재개한다. 재시도 횟수는 오르지 않는다
        claimedAt: { type: string, format: date-time, nullable: true, description: '마지막 수령 시각. 화면의 "수령 후 경과"에 쓴다(CLAIMED·IN_PROGRESS일 때 의미가 있다)' }
        retryCount: { type: integer, description: 'FAIL마다 오른다. 3이면 ESCALATED' }
    Artifact:
      type: object
      required: [id, taskId, commitSha, changedPaths, triggeredActions, gateMode, attempt, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        commitSha: { type: string }
        changedPaths: { type: array, items: { type: string } }
        triggeredActions: { type: array, items: { type: string } }
        gateMode: { type: string, enum: [AUTO, PM_REVIEW, HUMAN, FORBIDDEN] }
        attempt: { type: integer }
        createdAt: { type: string, format: date-time }
    StageOutcome:
      type: object
      required: [stage, result]
      properties:
        stage: { type: string, enum: [V1A, V1B, V2, V3, V4, INTEGRATION] }
        result: { type: string, enum: [PASS, FAIL, SKIPPED] }
    VerificationSummary:
      type: object
      required: [artifactId, attempt, stages, outcome, taskState, retryCount]
      properties:
        artifactId: { type: string, format: uuid }
        attempt: { type: integer }
        stages: { type: array, items: { $ref: '#/components/schemas/StageOutcome' } }
        outcome:
          type: string
          enum: [DONE, AWAITING_APPROVAL, RETRY, ESCALATED, PENDING, SETTLED]
          description: 'PENDING은 아직 보고 안 된 단계가 있음, SETTLED는 이미 결론이 난 뒤에 온 보고'
        taskState: { type: string, enum: [READY, CLAIMED, IN_PROGRESS, VERIFYING, AWAITING_APPROVAL, BLOCKED, ESCALATED, DONE] }
        retryCount: { type: integer }
        approvalId: { type: string, format: uuid, description: 'AWAITING_APPROVAL로 갔으면 그 승인 카드 id(대표가 승인·반려). 없으면 생략' }
    SubmittedArtifact:
      description: 'Artifact의 필드 전부 + 서버가 동기로 끝낸 검증 요약(verification)'
      type: object
      required: [id, taskId, commitSha, changedPaths, triggeredActions, gateMode, attempt, createdAt, verification]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        commitSha: { type: string }
        changedPaths: { type: array, items: { type: string } }
        triggeredActions: { type: array, items: { type: string } }
        gateMode: { type: string, enum: [AUTO, PM_REVIEW, HUMAN, FORBIDDEN] }
        attempt: { type: integer }
        createdAt: { type: string, format: date-time }
        verification: { $ref: '#/components/schemas/VerificationSummary' }
    Verification:
      type: object
      required: [id, artifactId, stage, result, executedBy, detail, durationMs]
      properties:
        id: { type: string, format: uuid }
        artifactId: { type: string, format: uuid }
        stage: { type: string, enum: [V1A, V1B, V2, V3, V4, INTEGRATION] }
        result: { type: string, enum: [PASS, FAIL, SKIPPED] }
        executedBy: { type: string, enum: [server, bridge] }
        detail:
          type: object
          additionalProperties: true
          description: '단계마다 다르다. SKIPPED면 reason이 반드시 있다. V3 FAIL이면 denialReason'
        durationMs: { type: integer, nullable: true }
    Note:
      type: object
      required: [id, projectId, seq, taskId, specId, repoId, kind, headline, keyPoints, affects, authorAgentId, onBehalfOf, supersedes, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        seq: { type: integer, description: '프로젝트 안에서 증가한다. since_seq로 증분 조회' }
        taskId: { type: string, format: uuid, nullable: true }
        specId: { type: string, format: uuid, nullable: true }
        repoId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [IMPLEMENTED, DECIDED, GOTCHA, DEVIATION] }
        headline: { type: string }
        keyPoints: { type: array, items: { type: string } }
        affects: { type: array, items: { type: string } }
        authorAgentId: { type: string, format: uuid }
        onBehalfOf: { type: string }
        supersedes: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    PublishedNote:
      description: 'Note의 필드 전부 + 서버가 조립한 제목(title)'
      type: object
      required: [id, projectId, seq, taskId, specId, repoId, kind, headline, keyPoints, affects, authorAgentId, onBehalfOf, supersedes, createdAt, title]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        seq: { type: integer }
        taskId: { type: string, format: uuid, nullable: true }
        specId: { type: string, format: uuid, nullable: true }
        repoId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [IMPLEMENTED, DECIDED, GOTCHA, DEVIATION] }
        headline: { type: string }
        keyPoints: { type: array, items: { type: string } }
        affects: { type: array, items: { type: string } }
        authorAgentId: { type: string, format: uuid }
        onBehalfOf: { type: string }
        supersedes: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        title: { type: string }
    TaskSpec:
      type: object
      required: [id, featureKey, title, content]
      properties:
        id: { type: string, format: uuid }
        featureKey: { type: string }
        title: { type: string }
        content: { type: string }
    PlanDraft:
      type: object
      description: 'PM이 낸 계획 초안. 적용하면 이 내용이 그대로 명세·태스크가 된다. PM은 시험지를 쓰지 않는다(명세에 시험지 0개 — V2는 SKIPPED)'
      required: [mode, rationale, estimate, specs, tasks]
      properties:
        mode: { type: string, enum: [SEQUENTIAL, CONTRACT_PARALLEL, HYBRID], description: '추천 진행 방식(기록용 — 실행 순서는 dependsOn이 정한다)' }
        rationale: { type: string }
        estimate:
          type: object
          required: [workingDays, notes]
          properties:
            workingDays: { type: number }
            notes: { type: string }
        specs:
          type: array
          items:
            type: object
            required: [featureKey, title, content]
            properties:
              featureKey: { type: string }
              title: { type: string }
              content: { type: string, description: '계약(API: 메서드·경로·상태코드·응답 필드 / 화면: 경로·동작·문구) + EARS 수용 기준' }
        tasks:
          type: array
          items:
            type: object
            required: [ref, title, repo, teamRole, kind, spec, dependsOn]
            properties:
              ref: { type: string, description: '이 초안 안에서만 쓰는 이름(선행 관계용)' }
              title: { type: string }
              repo: { type: string, description: '레포 fullName' }
              teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
              kind: { type: string, enum: [IMPLEMENT, INTEGRATION, REWORK] }
              spec: { type: string, nullable: true, description: '명세 featureKey' }
              dependsOn: { type: array, items: { type: string }, description: '먼저 끝나야 하는 태스크의 ref' }
    PmRelayJob:
      type: object
      description: '중계 모드에서 pm-worker가 실행할 모델 호출 한 건. 서버가 만든 지침·프롬프트·출력 스키마를 그대로 실행한다'
      required: [id, orgId, planId, purpose, request, takenBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        purpose: { type: string, enum: [draft, repair], description: 'repair면 첫 초안이 검증에 걸려 위반 목록을 붙여 다시 쓰는 호출' }
        request:
          type: object
          required: [model, effort, maxTokens, system, user, jsonSchema]
          properties:
            model: { type: string }
            effort: { type: string }
            maxTokens: { type: integer }
            system: { type: string, description: 'PM 지침' }
            user: { type: string, description: '프로젝트 맥락·지시(교정이면 위반 목록)' }
            jsonSchema: { type: object, additionalProperties: true, description: '초안 출력 스키마' }
        takenBy: { type: string, format: uuid, nullable: true, description: '가져간 에이전트' }
        createdAt: { type: string, format: date-time }
    PmRelayAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted: { type: boolean, enum: [true] }
    PmPlan:
      type: object
      required: [id, projectId, status, instruction, feedback, parentPlanId, mode, draft, error, costUsd, createdAt, appliedAt, rejectedAt, rejectReason, assignments]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, ready, failed, applied, rejected]
          description: 'pending이면 PM이 작성 중 — 몇 초 뒤 다시 조회한다. ready에서 적용하면 applied, 반려하면 rejected'
        instruction: { type: string, nullable: true }
        feedback: { type: string, nullable: true, description: '수정 요청이면 대표의 피드백' }
        parentPlanId: { type: string, format: uuid, nullable: true, description: '수정 요청이면 이전 초안' }
        mode: { type: string, nullable: true }
        draft: { $ref: '#/components/schemas/PlanDraft', nullable: true }
        error:
          type: object
          nullable: true
          required: [reason, detail]
          properties:
            reason:
              type: string
              enum: [refused, truncated, timeout, invalid, restart, budget, api_error]
              description: 'refused 안전 거절 · truncated 출력 한도 부족 · timeout 시간 제한 · invalid 교정 후에도 검증 실패 · restart 서버 재시작 · budget 예산 · api_error API 오류'
            detail: { description: '사유별 상세(invalid면 problems 목록)', nullable: true }
        costUsd: { type: number, description: '이 계획에 든 PM 호출 비용 합계(USD)' }
        createdAt: { type: string, format: date-time }
        appliedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        rejectReason: { type: string, nullable: true, description: '반려 사유(선택)' }
        assignments:
          type: array
          description: |
            초안의 태스크마다 **누가 받게 되는가**(draft.tasks와 같은 순서, ref로 대응). PM이 정하지 않고 서버가 조회 시점에 계산한다 —
            프로젝트에서 역할당 에이전트는 하나라 teamRole이면 담당이 정해진다. 초안이 없으면(pending·failed) 빈 배열.
            **agent가 null이면 그 역할에 배정된 에이전트가 없다** — 적용하면 그 태스크는 아무도 가져가지 않으니 적용 전에 경고할 것.
            프로젝트 시작 전에는 멤버가 바뀔 수 있으므로 다시 조회하면 달라질 수 있다.
          items:
            type: object
            required: [ref, teamRole, agent]
            properties:
              ref: { type: string, description: 'draft.tasks[].ref' }
              teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
              agent:
                type: object
                nullable: true
                required: [id, name, userId, nickname]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, description: '에이전트 이름(보통 컴퓨터 이름)' }
                  userId: { type: string, format: uuid, description: '에이전트 주인' }
                  nickname: { type: string, nullable: true, description: '주인의 닉네임' }
    Spec:
      type: object
      required: [id, featureKey, title, content, version, createdAt, tests]
      properties:
        id: { type: string, format: uuid }
        featureKey: { type: string, description: '프로젝트 안에서 유일(F-05 같은 기능 키)' }
        title: { type: string }
        content: { type: string, description: 'EARS 문장 — WHEN … THEN …' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        tests:
          type: array
          description: '시험지(V2가 팀원 노트북에서 실행하는 코드). 에이전트 토큰으로 보면 잠긴 것만 있다'
          items: { $ref: '#/components/schemas/SpecTest' }
    SpecTest:
      type: object
      required: [id, criterion, testCode, lockedAt]
      properties:
        id: { type: string, format: uuid }
        criterion: { type: string }
        testCode: { type: string }
        lockedAt: { type: string, format: date-time, nullable: true }
    BriefingPath:
      type: object
      required: [pathPattern, access, ownerRole]
      properties:
        pathPattern: { type: string }
        access: { type: string, enum: [write, read, denied] }
        ownerRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
    TaskBriefing:
      type: object
      required: [task, repo, spec, notes, notesBlock, writablePaths, claudeSettings, specTests, policyHash, lastRejection]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        repo:
          type: object
          required: [id, fullName, defaultBranch, devBranch, cloneUrl]
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            defaultBranch: { type: string }
            devBranch: { type: string }
            cloneUrl: { type: string, nullable: true, description: 'CLI가 노트북에 레포가 없으면 여기서 받아 둔다(null이면 https://github.com/{fullName})' }
        spec: { $ref: '#/components/schemas/TaskSpec', nullable: true }
        notes: { type: array, items: { $ref: '#/components/schemas/Note' } }
        notesBlock: { type: string }
        writablePaths: { type: array, items: { $ref: '#/components/schemas/BriefingPath' } }
        claudeSettings:
          type: object
          required: [permissions]
          properties:
            permissions:
              type: object
              required: [deny]
              properties:
                deny: { type: array, items: { type: string } }
        specTests: { type: array, items: { $ref: '#/components/schemas/SpecTest' } }
        policyHash: { type: string }
        lastRejection:
          type: object
          nullable: true
          description: '직전 제출이 대표에게 반려됐으면 그 사유. 반려되면 태스크가 READY로 돌아오고 같은 태스크 브랜치에서 이어서 고친다'
          required: [approvalId, reason, decidedAt, artifactId, commitSha]
          properties:
            approvalId: { type: string, format: uuid }
            reason: { type: string }
            decidedAt: { type: string, format: date-time }
            artifactId: { type: string, format: uuid, nullable: true }
            commitSha: { type: string, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: FORBIDDEN_PATH
            message:
              type: string
              example: '**/.env* is denied'
            reason:
              type: string
              description: POLICY_STALE에만 실린다. 다른 코드에서는 생략된다.
              example: policy_stale
            details:
              description: |
                상세를 공개하는 코드에만 실린다. 배열: NOTE_INVALID·PLAN_INVALID·PROJECT_START_INVALID(위반 전부),
                NOTES_UNACKNOWLEDGED(노트 전문), REPO_IN_ACTIVE_PROJECT(겹치는 레포 전부). 객체: PLAN_REVISION_LIMIT({ limit, used }).
                POLICY_STALE만 예외로 상세를 펼쳐 `reason`에 싣는다.
              oneOf:
                - type: array
                  items: { type: object, additionalProperties: true }
                - type: object
                  additionalProperties: true

  responses:
    Unauthenticated:
      description: 토큰이 없거나 만료·위조됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: UNAUTHENTICATED, message: invalid or expired token }
    PolicyStale:
      description: |
        토큰이 **옛 정책 스냅샷 기준**이다. 경로 규칙이나 정책이 바뀌면 이렇게 된다.
        refresh로 재발급하고 원 요청을 **1회만** 재시도한다. 그래도 stale이면 멈춘다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: POLICY_STALE
              message: policy snapshot changed; refresh the token
              reason: policy_stale
    ProjectHalted:
      description: 프로젝트가 정지됨. 토큰이 살아 있어도 막힌다 — 멈춤은 명령이 아니라 상태다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: PROJECT_HALTED, message: project is halted }

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: '{{TASK_BE}}'
    RepoId:
      name: repoId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: '{{REPO_API}}'
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: '{{ORG_ID}}'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: '{{PROJECT_ID}}'
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: 산출물 id. `GET /tasks/{taskId}/artifacts`로 찾는다.

tags:
  - name: 인증·계정
  - name: CLI 연결
  - name: 조직
  - name: 레포·경로
  - name: 프로젝트
  - name: 초대
  - name: GitHub OAuth
  - name: 명세·태스크 작성
  - name: 내장 PM
  - name: 태스크·노트
  - name: 검증
  - name: 승인
  - name: 룸
    description: 프로젝트 × 역할. 서버(PM)의 지시·판정, Executor 실행 상태, 에이전트 도구 사용을 한 줄씩

paths:
  /auth/signup:
    post:
      tags: [인증·계정]
      summary: 로컬 계정 가입
      description: |
        연결 키 평문은 **이 응답에서 한 번만** 나온다. 이후 다시 볼 방법이 없고, 잃어버리면 재발급해야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password, nickname]
              properties:
                loginId: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8 }
                nickname: { type: string }
            example:
              loginId: tester
              password: manual-test-1234
              nickname: tester
      responses:
        '201':
          description: 가입됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/SignupResult' } } }
              example:
                data:
                  userId: 3f2a1b4c-0000-0000-0000-000000000000
                  connectKey: lt4mWBZ-1_bw93HtjUQdKr6_U7TLjI8dpmsRI8Fu-D8
        '409':
          description: 아이디 중복
          content:
            application/json:
              example:
                error: { code: LOGIN_ID_TAKEN, message: login id is already taken }

  /auth/login:
    post:
      tags: [인증·계정]
      summary: 로그인 (사람 토큰 발급)
      description: |
        **없는 아이디와 틀린 비밀번호는 같은 응답이다.** 없는 아이디일 때도 scrypt를 한 번 돌려
        응답 시간까지 맞춘다 — 아이디 존재 여부가 드러나지 않게.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string }
            example:
              loginId: rep
              password: manual-test-1234
      responses:
        '200':
          description: 토큰 발급. `data.accessToken`을 Authorize의 userToken 칸에 붙여넣는다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/LoginResult' } } }
              example:
                data: { accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..., tokenType: Bearer, expiresIn: 86400 }
        '401':
          description: 아이디 또는 비밀번호가 틀림
          content:
            application/json:
              example:
                error: { code: INVALID_CREDENTIALS, message: invalid login id or password }

  /me:
    get:
      tags: [인증·계정]
      summary: 내 계정·조직·조직 역할
      description: |
        로그인 직후 프론트가 `orgId`·`orgRole`을 아는 경로다. 로그인 응답에 넣지 않는 이유: 조직·역할은
        매 요청 DB가 정본이라, 조직을 만들거나 초대를 수락한 직후에는 로그인 시점 값이 틀린다.
        그런 행동 뒤에는 이걸 다시 부른다(토큰은 그대로 써도 된다).
      security: [{ userToken: [] }]
      responses:
        '200':
          description: 조직이 없으면 orgId·orgName·orgRole이 null
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Me' } } }
              examples:
                대표:
                  value: { data: { userId: 1959e109-c60c-43f4-842f-dd18d9e7afab, loginId: rep, nickname: 대표, githubLogin: null, orgId: '{{ORG_ID}}', orgName: Acme Inc., orgRole: REPRESENTATIVE } }
                조직없음:
                  value: { data: { userId: 5b0c6f7e-2f7a-4f36-9b0e-8f1f0f6b7a11, loginId: newbie, nickname: 신입, githubLogin: null, orgId: null, orgName: null, orgRole: null } }
        '401':
          description: 토큰 없음·만료
          content:
            application/json:
              example:
                error: { code: UNAUTHENTICATED, message: invalid or expired token }

  /me/connect-key/rotate:
    post:
      tags: [인증·계정]
      summary: 개인 연결 키 재발급
      description: 새 키를 발급하면 **기존 키는 즉시 무효**다.
      security: [{ userToken: [] }]
      responses:
        '200':
          description: 새 연결 키 (평문은 이 응답에서 한 번만)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ConnectKey' } } }
              example:
                data: { connectKey: o9m9J-utE-VIKTelv9j8AAAiVTDPHX0d7ikdFu48aig }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /agents/connect:
    post:
      tags: [CLI 연결]
      summary: 에이전트 등록 (연결 키로)
      description: |
        조직·프로젝트가 없어도 연결된다(`status=pending`). 같은 `agentName`으로 다시 부르면
        새로 만들지 않고 갱신한다 — CLI 재설치 대응.

        **틀린 연결 키는 401이 아니라 400 + 일반 메시지다.** 무엇이 틀렸는지 알려주지 않는다.

        연결 키는 서버에 **해시로만** 저장되므로 아래 example을 DB에서 채워줄 수 없다.
        `npm run seed` 출력의 값을 직접 붙여넣어야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectKey, agentName, harness]
              properties:
                connectKey: { type: string }
                agentName: { type: string, maxLength: 64 }
                harness: { type: string }
                skills: { type: array, items: { type: string } }
                maxConcurrent: { type: integer, minimum: 1, maximum: 16 }
            example:
              connectKey: 시드-출력의-be-연결-키를-붙여넣으세요
              agentName: be-laptop
              harness: claude-code@2.1.263
              skills: [typescript]
              maxConcurrent: 2
      responses:
        '201':
          description: 등록됨. access는 1시간, refresh는 30일.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentTokens' } } }
              example:
                data: { agentId: 2012e1df-0beb-43fd-ac09-d893ba56b01e, accessToken: eyJ..., refreshToken: XtvVbBmp... }
        '400':
          description: 연결 키가 틀림 (의도적으로 401이 아니다)
          content:
            application/json:
              example:
                error: { code: INVALID_CONNECT_REQUEST, message: invalid connect request }

  /agents/device/start:
    post:
      tags: [CLI 연결]
      summary: 브라우저 승인 시작 (인증 없음)
      description: |
        `gh auth login`처럼 CLI가 코드를 띄우고 브라우저를 연다. 사용자는 로그인된 웹(`/connect/device`)에서 승인만 누른다(RFC 8628).
        요청 본문은 `/agents/connect`에서 `connectKey`만 뺀 것이다. 연결 키 경로는 브라우저가 없는 환경(SSH)용으로 그대로 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentName, harness]
              properties:
                agentName: { type: string, maxLength: 64 }
                harness: { type: string, maxLength: 128 }
                skills: { type: array, items: { type: string } }
                maxConcurrent: { type: integer, minimum: 1, maximum: 16, default: 2 }
            example: { agentName: benzity-mbp, harness: claude-code, skills: [], maxConcurrent: 2 }
      responses:
        '201':
          description: 코드 발급. `verificationUriComplete`를 브라우저로 열고 `interval`마다 poll한다
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DeviceStart' } } }
              example:
                data: { deviceCode: x8Q…(43자), userCode: WDJB-MJHT, verificationUri: 'https://frontend.example/connect/device', verificationUriComplete: 'https://frontend.example/connect/device?code=WDJB-MJHT', expiresIn: 600, interval: 5 }

  /agents/device/poll:
    post:
      tags: [CLI 연결]
      summary: 승인 여부 확인 (인증 없음)
      description: |
        `interval`마다 부른다. 너무 빨리 부르면 `slow_down`과 늘어난 간격이 온다.
        승인되면 **이 응답에서 한 번만** 토큰이 나오고, 그 뒤로는 `expired`다. `account`(연결된 계정)를 출력할 것.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
            example: { deviceCode: x8Q… }
      responses:
        '200':
          description: 중간 상태 포함
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DevicePoll' } } }
              examples:
                대기:
                  value: { data: { status: pending } }
                승인:
                  value: { data: { status: approved, accessToken: eyJ…, refreshToken: r8…, agentId: 3c1a9f60-1111-4b8e-9d2f-aaaabbbbcccc, account: { loginId: rep, nickname: 대표, orgName: Acme Inc. } } }
        '400':
          description: 모르는 deviceCode
          content:
            application/json:
              example:
                error: { code: INVALID_DEVICE_CODE, message: invalid device code }

  /agents/device/requests/{userCode}:
    get:
      tags: [CLI 연결]
      summary: 승인 화면 정보 (사람)
      description: |
        승인 화면에 코드·에이전트 이름·요청 IP·시각을 보여 주고 **"방금 내 터미널에서 실행한 게 아니면 거부하세요"**라고 경고한다.
        공격자가 자기 CLI로 받은 링크를 보내 승인시키면 공격자의 노트북이 내 이름으로 일하게 된다.
      security: [{ userToken: [] }]
      parameters: [{ name: userCode, in: path, required: true, schema: { type: string }, description: '대소문자·하이픈 무시(wdjbmjht = WDJB-MJHT)' }]
      responses:
        '200':
          description: 요청 정보
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DeviceRequest' } } }
              example:
                data: { userCode: WDJB-MJHT, status: PENDING, agentName: benzity-mbp, harness: claude-code, clientIp: 203.0.113.7, requestedAt: '2026-10-01T10:00:00.000Z', expiresAt: '2026-10-01T10:10:00.000Z' }
        '404':
          description: 없는 코드
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_NOT_FOUND, message: device request not found }

  /agents/device/requests/{userCode}/approve:
    post:
      tags: [CLI 연결]
      summary: 승인 (사람)
      description: 조직이 없어도 승인할 수 있다. 에이전트는 사용자의 현재 조직(없으면 없음)으로 만들어지고, 조직에 들어가면 따라온다.
      security: [{ userToken: [] }]
      parameters: [{ name: userCode, in: path, required: true, schema: { type: string }, description: '대소문자·하이픈 무시(wdjbmjht = WDJB-MJHT)' }]
      responses:
        '200':
          description: 승인됨 — CLI의 다음 poll이 토큰을 받는다
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [status], properties: { status: { type: string, enum: [APPROVED, DENIED] } } } } }
              example: { data: { status: APPROVED } }
        '404':
          description: 없는 코드
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_NOT_FOUND, message: device request not found }
        '409':
          description: 이미 승인·거부·사용됨
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_ALREADY_DECIDED, message: device request is already approved }
        '410':
          description: 만료(10분)
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_EXPIRED, message: device request has expired; run login again }

  /agents/device/requests/{userCode}/deny:
    post:
      tags: [CLI 연결]
      summary: 거부 (사람)
      security: [{ userToken: [] }]
      parameters: [{ name: userCode, in: path, required: true, schema: { type: string }, description: '대소문자·하이픈 무시(wdjbmjht = WDJB-MJHT)' }]
      responses:
        '200':
          description: 거부됨 — CLI의 다음 poll이 denied를 받는다
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [status], properties: { status: { type: string, enum: [APPROVED, DENIED] } } } } }
              example: { data: { status: DENIED } }
        '404':
          description: 없는 코드
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_NOT_FOUND, message: device request not found }
        '409':
          description: 이미 승인·거부·사용됨
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_ALREADY_DECIDED, message: device request is already approved }
        '410':
          description: 만료(10분)
          content:
            application/json:
              example:
                error: { code: DEVICE_REQUEST_EXPIRED, message: device request has expired; run login again }

  /agents/token/refresh:
    post:
      tags: [CLI 연결]
      summary: 에이전트 access 토큰 재발급
      description: |
        **401 POLICY_STALE을 받으면 여기로 재발급하고 원 요청을 1회만 재시도한다.**
        재발급 후에도 stale이면 루프이므로 즉시 멈춘다.

        재발급된 토큰에는 현재 `project_id`와 `policy_hash`가 담긴다 — 프로젝트에 배정된 뒤
        이걸 한 번 불러야 태스크 API를 쓸 수 있다.

        refresh 토큰도 해시로만 저장되므로 example을 DB에서 채울 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
            example:
              refreshToken: 시드-출력의-be-laptop-refresh-token을-붙여넣으세요
      responses:
        '200':
          description: 새 access 토큰
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentAccessToken' } } }
              example:
                data: { accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        '401':
          description: refresh 토큰이 만료·폐기됨
          content:
            application/json:
              example:
                error: { code: INVALID_REFRESH_TOKEN, message: refresh token is invalid or expired }

  /orgs:
    post:
      tags: [조직]
      summary: 조직 생성 (만든 사람이 대표)
      description: |
        **이 순간 그 사용자가 먼저 연결해 둔 에이전트의 `org_id`도 함께 채워진다.**
        한 사용자는 하나의 조직에만 속한다 — 시드 계정으로 부르면 409가 정상이다.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
            example:
              name: Newbie Inc.
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/OrgCreated' } } }
              example:
                data: { orgId: '{{ORG_ID}}', userId: 1959e109-c60c-43f4-842f-dd18d9e7afab }
        '409':
          description: 이미 조직에 속함
          content:
            application/json:
              example:
                error: { code: ALREADY_IN_ORG, message: user already belongs to an organization }

  /orgs/{orgId}/github/repos:
    get:
      tags: [조직]
      summary: GitHub에서 접근 가능한 레포 목록 (조직 멤버)
      description: |
        레포 연결이 조직 멤버 누구나 할 수 있으므로, 그 드롭다운을 채우는 이 목록도 함께 열려 있다.

        **그 조직 대표의 GitHub 토큰으로** 읽는다(서버 공용 토큰은 없다 — 있으면 모든 조직이 그 주인의 레포를 보게 된다).
        대표가 GitHub를 연결하지 않았으면 **500이 아니라 빈 배열**을 반환한다(직접 입력으로 연결할 수 있다).
        GitHub 실패가 우리 기능을 멈추게 하지 않는다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: 레포 목록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [repos], properties: { repos: { type: array, items: { $ref: '#/components/schemas/GithubRepo' } } } } } }
              example:
                data: { repos: [] }
        '403':
          description: 다른 조직 (조직 멤버면 대표가 아니어도 된다)
          content:
            application/json:
              example:
                error: { code: CROSS_ORG_ACCESS, message: cannot access another organization }
    post:
      tags: [레포·경로]
      summary: GitHub 조직에 레포 만들고 연결 (대표 전용)
      description: |
        대표의 GitHub 토큰으로 **GitHub 조직에 비공개 레포**를 만들고 곧바로 NOMOS에 연결한다(개인 계정에는 만들지 않는다).
        프로젝트 생성 화면에서 이걸 부른 뒤 받은 `id`를 `repoIds`에 넣으면 된다.

        - 첫 커밋은 **파일 없는 빈 커밋** 하나다(README 없음). 브랜치가 있어야 에이전트가 분기할 수 있다.
        - `ownerRole`은 필수다 — `**` 행의 소유 역할. 없으면 프로젝트에 넣을 수 없다(422 `REPO_OWNERSHIP_NOT_SET`).
        - `githubRepoId`·`cloneUrl`이 자동으로 채워져 V3(실제 diff 검사)가 처음부터 돈다.
        - GitHub에 레포를 만든 뒤 연결이 실패하면 GitHub에는 레포가 남는다. 그때는 `POST /orgs/{orgId}/repos`로 연결한다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [githubOrg, name, ownerRole]
              properties:
                githubOrg: { type: string, description: 'GitHub 조직 login (GET /orgs/{orgId}/github/orgs)' }
                name: { type: string, description: '영숫자와 . _ - 만, 100자까지' }
                description: { type: string, maxLength: 350 }
                ownerRole: { type: string, enum: [FRONTEND, BACKEND] }
            example:
              githubOrg: Capstone-NOMOS
              name: shop-api
              ownerRole: BACKEND
      responses:
        '201':
          description: 만들고 연결함
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [repo], properties: { repo: { $ref: '#/components/schemas/CreatedGithubRepo' } } } } }
              example:
                data:
                  repo: { id: '{{REPO_API}}', fullName: Capstone-NOMOS/shop-api, seededPathCount: 15, rootOwnerRole: BACKEND, githubRepoId: 123456, defaultBranch: main, cloneUrl: 'https://github.com/Capstone-NOMOS/shop-api' }
        '403':
          description: 대표가 아니거나 GitHub가 거부(그 조직에 레포를 만들 권한이 없음, 조직이 NOMOS 앱을 승인하지 않음)
          content:
            application/json:
              examples:
                대표아님:
                  value: { error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative } }
                GitHub거부:
                  value: { error: { code: GITHUB_FORBIDDEN, message: 'GitHub 레포 생성(acme/shop-api): GitHub가 거부했습니다(403)' } }
        '409':
          description: GitHub 미연결 또는 같은 이름의 레포가 이미 있음
          content:
            application/json:
              examples:
                미연결:
                  value: { error: { code: GITHUB_NOT_LINKED, message: GitHub 계정이 연결되어 있지 않습니다 } }
                이름중복:
                  value: { error: { code: GITHUB_REPO_NAME_TAKEN, message: GitHub 조직 acme에 shop-api 레포를 만들 수 없습니다 } }

  /orgs/{orgId}/github/orgs:
    get:
      tags: [레포·경로]
      summary: 레포를 만들 수 있는 GitHub 조직 목록 (대표 전용)
      description: |
        대표 본인의 GitHub 토큰으로 대표가 속한 GitHub 조직을 읽는다. 레포 만들기 화면의 드롭다운을 채운다.
        GitHub를 연결하지 않았으면 409 `GITHUB_NOT_LINKED`.

        GitHub 조직이 OAuth 앱 접근 제한을 켜 두었으면 NOMOS 앱을 그 조직에서 승인해야 목록·생성이 된다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: GitHub 조직 login 목록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [orgs], properties: { orgs: { type: array, items: { type: string } } } } } }
              example:
                data: { orgs: [Capstone-NOMOS] }
        '403':
          description: 대표가 아님
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 대표가 GitHub를 연결하지 않음
          content:
            application/json:
              example:
                error: { code: GITHUB_NOT_LINKED, message: GitHub 계정이 연결되어 있지 않습니다 }

  /orgs/{orgId}/members:
    get:
      tags: [조직]
      summary: 조직 멤버 목록
      description: |
        협업자 여부는 그 조직 대표의 GitHub 토큰으로 확인한다. 대표가 GitHub를 연결하지 않았거나 조회가 실패하면 `isCollaborator` 필드를 **생략**한다.
        `false`로 채우지 않는다 — "확인 안 됨"과 "권한 없음"은 다르다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: 멤버 목록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [members], properties: { members: { type: array, items: { $ref: '#/components/schemas/Member' } } } } } }
              example:
                data:
                  members:
                    - { userId: 1959e109-c60c-43f4-842f-dd18d9e7afab, loginId: rep, nickname: 대표, orgRole: REPRESENTATIVE }
                    - { userId: 956e2b45-f39a-4799-a256-8b03de80f4ec, loginId: be, nickname: 백엔드, orgRole: MEMBER }
        '403':
          description: 다른 조직
          content:
            application/json:
              example:
                error: { code: CROSS_ORG_ACCESS, message: cannot access another organization }

  /orgs/{orgId}/agents:
    get:
      tags: [조직]
      summary: 조직의 에이전트 목록 (조직 멤버)
      description: |
        역할 배정(`POST /projects/{projectId}/members`)이 받는 `agentId`를 여기서 고른다.
        `assignment`가 있는 에이전트는 다른 진행 중 프로젝트를 맡고 있어 배정하면 409 `AGENT_IN_ANOTHER_PROJECT`다.

        **접속 상태(online/offline)는 없다.** 연결 뒤 상태를 갱신하는 경로가 아직 없어서 내보내지 않는다.
        목록에 있다는 것이 "CLI로 연결한 적 있음"이다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: 에이전트 목록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [agents], properties: { agents: { type: array, items: { $ref: '#/components/schemas/OrgAgent' } } } } } }
              example:
                data:
                  agents:
                    - { agentId: '{{AGENT_BE}}', agentName: be-laptop, userId: 956e2b45-f39a-4799-a256-8b03de80f4ec, nickname: 백엔드, connectedAt: '2026-09-29T02:00:00.000Z', assignment: { projectId: '{{PROJECT_ID}}', teamRole: BACKEND } }
                    - { agentId: 0c9d1c62-4c7e-4d7e-bf0e-3b1a2f4c5d6e, agentName: fe-laptop, userId: 7a1e7c2b-1d3f-4e5a-9b8c-0d1e2f3a4b5c, nickname: 프론트, connectedAt: '2026-09-29T02:05:00.000Z', assignment: null }
        '403':
          description: 다른 조직
          content:
            application/json:
              example:
                error: { code: CROSS_ORG_ACCESS, message: cannot access another organization }

  /orgs/{orgId}/repos:
    get:
      tags: [레포·경로]
      summary: 연결된 레포 목록 (조직 멤버)
      description: |
        경로 소유권 화면(`/repos/{repoId}/paths`)과 프로젝트 생성의 `repoIds`가 여기서 id를 얻는다.
        `ownershipAssigned=false`인 레포는 프로젝트에 넣으면 422 `REPO_OWNERSHIP_NOT_SET`이다 — 미리 막을 수 있다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: 연결 순서대로
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [repos], properties: { repos: { type: array, items: { $ref: '#/components/schemas/RepoListItem' } } } } } }
              example:
                data:
                  repos:
                    - { id: '{{REPO_API}}', fullName: acme/study-api, githubRepoId: null, defaultBranch: main, devBranch: dev, cloneUrl: null, ownershipAssigned: true }
        '403':
          description: 다른 조직
          content:
            application/json:
              example:
                error: { code: CROSS_ORG_ACCESS, message: cannot access another organization }
    post:
      tags: [레포·경로]
      summary: 레포 연결 (조직 멤버)
      description: |
        연결하면 기본 경로 규칙 **15개**가 함께 생성된다(`source=seed`, `owner_role`은 전부 NULL).

        **대표 전용이 아니다.** `repos` 행은 그 자체로 권한을 만들지 않는다 — 판정에 쓰이는 경로 규칙은
        `project_repos`에 조인된 레포만 읽으므로(`listProjectRepoPaths`), 연결만 된 레포는 어떤
        에이전트도 건드릴 수 없다. 실제 관문인 소유권 지정(`PATCH .../paths/{pathId}`)과
        프로젝트 투입(`POST /orgs/{orgId}/projects`의 `repoIds`)은 대표 전용으로 남는다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repos]
              properties:
                repos:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [fullName]
                    properties:
                      fullName: { type: string }
                      githubRepoId: { type: integer }
                      defaultBranch: { type: string }
                      ownerRole:
                        type: string
                        enum: [FRONTEND, BACKEND]
                        description: |
                          주면 연결과 함께 `**` 행(레포 전체)의 소유 역할을 지정한다 — `GET …/paths` → `PATCH …/paths/{pathId}`를 대신한다.
                          **대표 전용**: 대표가 아닌데 하나라도 있으면 아무것도 연결하지 않고 403 `NOT_REPRESENTATIVE`.
            example:
              repos: [{ fullName: acme/extra-repo, ownerRole: BACKEND }]
      responses:
        '201':
          description: 연결됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [repos], properties: { repos: { type: array, items: { $ref: '#/components/schemas/ConnectedRepo' } } } } } }
              example:
                data: { repos: [{ id: 2ea71bc6-05b8-4725-9fa0-2b2eec9d3674, fullName: acme/extra-repo, seededPathCount: 15, rootOwnerRole: BACKEND }] }
        '409':
          description: 이미 연결된 레포
          content:
            application/json:
              example:
                error: { code: REPO_ALREADY_CONNECTED, message: repository is already connected }

  /repos/{repoId}:
    patch:
      tags: [레포·경로]
      summary: V3가 커밋을 읽을 곳 수정 (대표 전용)
      description: |
        `githubRepoId`(운영 github 모드 — 이름이 아니라 id로 찾는다)와 `cloneUrl`(로컬 mirror 모드)만 바꾼다. 넘긴 키만 바뀌고 `null`은 비운다.

        **`cloneUrl`은 서버가 `git clone`에 그대로 넘긴다.** 그래서 `https://`(자격 증명 없이), `file:///`, 로컬 절대 경로만 받는다.
        `-`로 시작(옵션 주입), `ext::`, `ssh://`·`git@host:`, `http://`, `user:pass@`는 400이고 사유가 메시지에 담긴다.

        같은 조직의 다른 레포가 이미 그 `githubRepoId`를 가리키면 409. 경로 규칙이 아니므로 `policy_hash`는 바뀌지 않는다.
      security: [{ userToken: [] }]
      parameters:
        - name: repoId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{REPO_API}}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                githubRepoId: { type: integer, nullable: true, minimum: 1 }
                cloneUrl: { type: string, nullable: true, maxLength: 2048 }
            example: { githubRepoId: 987654321 }
      responses:
        '200':
          description: 바뀐 설정
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [repo], properties: { repo: { $ref: '#/components/schemas/RepoSettings' } } } } }
              example:
                data:
                  repo: { id: '{{REPO_API}}', fullName: acme/study-api, githubRepoId: 987654321, defaultBranch: main, devBranch: dev, cloneUrl: null }
        '400':
          description: 빈 바디, 또는 허용되지 않는 cloneUrl
          content:
            application/json:
              example:
                error: { code: VALIDATION_ERROR, message: 'clone_url 이 -로 시작한다(git 옵션으로 읽힌다) — https://host/owner/repo.git(자격 증명 없이) 또는 로컬 절대 경로만 받는다' }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 같은 GitHub 레포를 이미 가리키는 레포 행이 있음
          content:
            application/json:
              example:
                error: { code: REPO_ALREADY_CONNECTED, message: 'github_repo_id 987654321 is already used by acme/study-web (...)' }

  /repos/{repoId}/paths:
    get:
      tags: [레포·경로]
      summary: 경로 규칙 목록 (priority 내림차순)
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RepoId' }]
      responses:
        '200':
          description: 시드 15행 + 대표가 추가한 것
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [paths], properties: { paths: { type: array, items: { $ref: '#/components/schemas/RepoPath' } } } } } }
              example:
                data:
                  paths:
                    - { id: '{{PATH_ID}}', pathPattern: 'tests/**', ownerRole: null, access: write, actionKey: 'test:write', priority: 20, source: seed }
                    - { id: 11111111-1111-1111-1111-111111111111, pathPattern: '**', ownerRole: BACKEND, access: write, actionKey: null, priority: 10, source: seed }
        '404':
          description: 없는 레포
          content:
            application/json:
              example:
                error: { code: REPO_NOT_FOUND, message: repository not found }
    post:
      tags: [레포·경로]
      summary: 경로 규칙 추가 (대표 전용)
      description: |
        `priority`는 **manual 대역 200~299**만 받고, 안 주면 대역 최댓값 + 1이 된다(나중에 추가한 규칙이 이긴다).

        glob은 `**`, `*`, 리터럴만 허용한다. 중괄호·느낌표·물음표·대괄호는 거부된다 —
        서버와 브릿지 `.claude/settings.json`의 방언 차이로 판정이 갈리는 것을 막기 위해서다.
        **부정이 필요하면 `priority`로 푼다.**
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RepoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pathPattern, access]
              properties:
                pathPattern: { type: string }
                ownerRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
                access: { type: string, enum: [write, read, denied] }
                priority: { type: integer, minimum: 200, maximum: 299 }
            example:
              pathPattern: 'api/**'
              ownerRole: BACKEND
              access: write
      responses:
        '201':
          description: 추가됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [path], properties: { path: { $ref: '#/components/schemas/RepoPath' } } } } }
              example:
                data: { path: { id: 33333333-3333-3333-3333-333333333333, pathPattern: 'api/**', ownerRole: BACKEND, access: write, priority: 200, source: manual } }
        '400':
          description: 허용하지 않는 glob 문법
          content:
            application/json:
              example:
                error: { code: INVALID_GLOB_PATTERN, message: pattern uses unsupported syntax }
        '409':
          description: 대역 안에서 priority 충돌
          content:
            application/json:
              example:
                error: { code: PATH_PRIORITY_TAKEN, message: priority 200 is already used in this repo }

  /repos/{repoId}/paths/{pathId}:
    patch:
      tags: [레포·경로]
      summary: 경로 소유권 지정 (대표 전용 — 온보딩의 핵심 산출물)
      description: |
        `actionKey`와 `priority`는 **어떤 API로도 바꿀 수 없다** — 정책 판정의 기준이라 임의로 바뀌면 재현성이 깨진다.

        priority 900 이상(조직 상한, `.env` 계열 등)은 어떤 필드도 못 바꾼다 → 409 `IMMUTABLE_ORG_CEILING`.

        ⚠️ **이 호출이 성공하면 그 레포를 쓰는 프로젝트의 `policy_hash`가 갱신된다.**
        이미 발급된 에이전트 토큰은 즉시 401 `POLICY_STALE`이 된다. 재발급하면 다시 통과한다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/RepoId'
        - name: pathId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{PATH_ID}}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
                access: { type: string, enum: [write, read, denied] }
            example:
              ownerRole: BACKEND
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [path], properties: { path: { $ref: '#/components/schemas/RepoPath' } } } } }
              example:
                data: { path: { id: '{{PATH_ID}}', pathPattern: 'tests/**', ownerRole: BACKEND, access: write, priority: 20, source: seed } }
        '409':
          description: 조직 상한 행은 불변
          content:
            application/json:
              example:
                error: { code: IMMUTABLE_ORG_CEILING, message: organization ceiling rule cannot be changed }

  /orgs/{orgId}/invites:
    post:
      tags: [초대]
      summary: 초대 링크 발급 (대표 전용)
      description: 토큰은 이벤트 payload에 남기지 않는다 — events는 지워지지 않으므로 비밀값을 넣지 않는다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamRole: { type: string, enum: [FRONTEND, BACKEND] }
                expiresInDays: { type: integer, minimum: 1 }
            example:
              teamRole: BACKEND
              expiresInDays: 7
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/InviteCreated' } } }
              example:
                data: { token: '{{INVITE_TOKEN}}', url: 'http://localhost:3001/invites/{{INVITE_TOKEN}}', expiresAt: '2026-09-25T00:00:00.000Z', teamRole: BACKEND }
        '403':
          description: 대표가 아님
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }

  /invites/{token}:
    get:
      tags: [초대]
      summary: 수락 전 미리보기 (인증 불필요)
      description: |
        **무효한 토큰도 404가 아니라 200 + `valid:false`다.** 404를 쓰면 토큰 존재 여부가 드러난다.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          example: '{{INVITE_TOKEN}}'
      responses:
        '200':
          description: 유효하든 아니든 200. 무효면 `reason`으로 만료·사용됨·없음을 구분한다
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/InvitePreview' } } }
              examples:
                유효:
                  value: { data: { orgName: Acme Inc., valid: true, teamRole: BACKEND, expiresAt: '2026-09-25T00:00:00.000Z' } }
                만료:
                  value: { data: { orgName: Acme Inc., valid: false, teamRole: BACKEND, expiresAt: '2026-09-20T00:00:00.000Z', reason: expired } }
                이미사용:
                  value: { data: { orgName: Acme Inc., valid: false, teamRole: null, expiresAt: '2026-09-25T00:00:00.000Z', reason: used } }
                없는토큰:
                  value: { data: { orgName: '', valid: false, teamRole: null, expiresAt: null, reason: not_found } }

  /invites/{token}/accept:
    post:
      tags: [초대]
      summary: 초대 수락
      description: |
        `users.org_id`와 그 사용자의 `agents.org_id`가 **함께** 채워진다.
        같은 링크를 다시 눌러도 성공한다(멱등). 이미 다른 조직에 속했으면 409.
      security: [{ userToken: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          example: '{{INVITE_TOKEN}}'
      responses:
        '200':
          description: 합류됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/InviteAccepted' } } }
              example:
                data: { userId: 2a5f7d0d-60ce-4937-a67a-a567a41c8ddb, orgId: '{{ORG_ID}}' }
        '409':
          description: 이미 다른 조직 소속
          content:
            application/json:
              example:
                error: { code: ALREADY_IN_ORG, message: user already belongs to an organization }
        '410':
          description: 만료되거나 이미 사용됨
          content:
            application/json:
              example:
                error: { code: INVITE_EXPIRED, message: invite has expired }

  /auth/github/device/start:
    post:
      tags: [GitHub OAuth]
      summary: Device Flow 시작
      description: |
        `device_code`는 **서버가 보관하지 않고** 응답으로 내보낸다. 보관하면 지울 책임이 생기고,
        우리 DB가 새면 진행 중인 인증까지 털린다. GitHub device flow가 그렇게 설계돼 있다.

        `GITHUB_CLIENT_ID`가 없으면 502다. 나머지 API는 정상 동작한다.
      security: [{ userToken: [] }]
      responses:
        '200':
          description: 사용자 코드와 인증 URL
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DeviceCode' } } }
              example:
                data: { deviceCode: dev-code, userCode: ABCD-1234, verificationUri: https://github.com/login/device, expiresIn: 900, interval: 5 }
        '502':
          description: OAuth 미설정
          content:
            application/json:
              example:
                error: { code: GITHUB_UNAVAILABLE, message: github oauth is not configured }

  /auth/github/device/poll:
    post:
      tags: [GitHub OAuth]
      summary: 승인 확인 (interval마다 호출)
      description: |
        **pending·slow_down·expired·denied도 200이다.** 폴링의 정상적인 중간 상태이기 때문이다.

        승인되면 GitHub 신원을 계정에 붙이고 토큰을 AES-256-GCM으로 암호화해 저장한다.
        이때 `SECRET_ENCRYPTION_KEY`가 필요하다. `KMS_KEY_ID`가 설정돼 있으면 **일부러 실패한다** —
        운영에서 약한 키로 조용히 내려가는 것을 막기 위해서다.
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
            example:
              deviceCode: start-응답의-deviceCode
      responses:
        '200':
          description: 진행 상태 또는 연결 완료
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/DeviceFlowStatus' } } }
              examples:
                승인대기:
                  value: { data: { status: pending } }
                연결완료:
                  value: { data: { status: connected, githubLogin: minsu } }
        '409':
          description: 같은 조직에서 이미 연결된 GitHub 계정
          content:
            application/json:
              example:
                error: { code: GITHUB_ACCOUNT_TAKEN, message: this github account is already linked in your organization }

  /agents/me/tasks:
    get:
      tags: [태스크·노트]
      summary: 지금 가져갈 수 있는 태스크 (에이전트)
      description: |
        이 에이전트가 **지금** 가져갈 수 있는 태스크 — 프로젝트가 시작됐고, READY이고, 담당이 없고, 자기 역할(또는 역할 제한 없음)이고,
        선행 태스크가 전부 DONE인 것. `claim`이 거부할 것은 처음부터 빠져 있다.

        **보통은 웹소켓으로 받는다.** `GET /api/agents/stream`(upgrade)에 연결해 첫 메시지로 `{ "type": "auth", "token": "<에이전트 access token>" }`을 보내면,
        서버가 `{ "type": "ready" }` 뒤에 이 목록과 같은 스냅샷 `{ "type": "tasks", "projectId", "tasks": [...] }`을 연결 직후와
        프로젝트 상태가 바뀔 때마다(시작·적용·수령·검증 결론) 보낸다. 닫는 코드: 4401 인증 실패(재발급 후 다시 연결) · 4403 프로젝트 멤버 아님 · 4400 잘못된 메시지 · 4408 인증 시간 초과.
        이 HTTP 엔드포인트는 연결이 끊겼을 때 같은 목록을 읽는 안전망이다.
      security: [{ agentToken: [] }]
      responses:
        '200':
          description: 지금 가져갈 수 있는 태스크(생성 순)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [tasks]
                    properties:
                      tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
              example:
                data: { tasks: [] }
  /tasks/{taskId}/claim:
    post:
      tags: [태스크·노트]
      summary: claim_task — READY 태스크 선점
      description: |
        `state='READY' AND assignee_agent_id IS NULL` 조건부 UPDATE 하나로 경합을 가른다.
        **낙관적 잠금이지 트랜잭션 잠금이 아니다.** 진 쪽은 0행을 받고 그게 곧 409다.

        먼저 확인하는 것: 프로젝트 멤버인가 → 선행 태스크가 전부 DONE인가 → 내 역할과 맞는가.
        `tasks.team_role`이 NULL이면 역할 제한이 없다(통합 태스크).
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: 선점됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
              example:
                data: { id: '{{TASK_BE}}', state: CLAIMED, assigneeAgentId: 2012e1df-0beb-43fd-ac09-d893ba56b01e, teamRole: BACKEND }
        '401':
          $ref: '#/components/responses/PolicyStale'
        '403':
          description: 역할 불일치·프로젝트 멤버 아님·프로젝트 정지
          content:
            application/json:
              examples:
                역할불일치:
                  value: { error: { code: TASK_ROLE_MISMATCH, message: task belongs to FRONTEND } }
                정지됨:
                  value: { error: { code: PROJECT_HALTED, message: project is halted } }
        '404':
          description: 없는 태스크 (다른 프로젝트의 태스크도 "없음"으로 답한다)
          content:
            application/json:
              example:
                error: { code: TASK_NOT_FOUND, message: task not found }
        '409':
          description: 이미 선점됨 또는 선행 의존 미완료
          content:
            application/json:
              examples:
                경합패배:
                  value: { error: { code: TASK_ALREADY_CLAIMED, message: task is no longer READY } }
                의존미완료:
                  value: { error: { code: TASK_DEPS_NOT_DONE, message: 1 dependencies are not DONE } }

  /tasks/{taskId}/artifacts:
    post:
      tags: [태스크·노트]
      summary: submit_artifact — 산출물 제출
      description: |
        제출 시점에 경로를 **다시** 판정한다. 로컬 편집기로 직접 고친 파일은 도구 호출을 거치지 않으므로
        여기서만 걸린다(V3의 전신).

        걸린 행동 키(`triggeredActions`)와 **가장 엄격한 판정**(`gateMode`)을 `artifacts`에 고정한다 —
        나중에 정책표나 경로 규칙이 바뀌어도 "그때 무엇에 걸렸나"가 남아야 리플레이가 성립한다.

        `changedPaths`에 `migrations/010_x.sql`을 섞으면 `db:migration`이 걸려 L2에서 `gateMode=HUMAN`이 된다.

        **인계 노트 확인**: 이 태스크와 관련된 노트(브리핑과 같은 선택 — 같은 기능·선행 전체·`DECIDED`·영향 경로, 자기가 쓴 노트 제외)를
        전부 `acknowledgedNoteIds`에 넣어야 받는다. 브리핑으로 받은 노트는 브릿지가 자동으로 넣으므로, 실제로 반려되는 건 **브리핑 뒤에 새 노트가
        생겼을 때**다 — 409 `NOTES_UNACKNOWLEDGED`, `details`에 노트 전문. 산출물은 만들지 않고 태스크는 그대로라 고쳐서 다시 낸다.
        재시도 횟수는 오르지 않는다(이벤트 `NOTES_ACK_REQUIRED`).
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commitSha, changedPaths]
              properties:
                commitSha: { type: string, pattern: '^[0-9a-f]{7,40}$' }
                changedPaths: { type: array, minItems: 1, items: { type: string } }
                acknowledgedNoteIds: { type: array, maxItems: 200, items: { type: string, format: uuid }, description: '확인한 인계 노트 id' }
            examples:
              정상:
                value: { commitSha: a1b2c3d, changedPaths: [src/participation.ts, tests/participation.test.ts] }
              금지경로:
                value: { commitSha: a1b2c3d, changedPaths: [api/.env] }
              승인필요:
                value: { commitSha: a1b2c3d, changedPaths: [migrations/010_x.sql] }
      responses:
        '201':
          description: |
            제출됨. 태스크는 VERIFYING으로 넘어간다.

            **서버가 판정하는 단계(V1A·V1B·V3)는 이 응답 안에서 이미 끝나 있다.** 비동기로 돌리면
            "제출은 됐는데 결과는 언제 오는가"를 관리하는 상태가 하나 더 늘고, 모델은 그 사이에
            다음 태스크로 넘어가 버린다.

            `verification.outcome`이 읽는 법이다 —
            `PENDING`(V2·V4 보고를 기다린다) · `DONE` · `AWAITING_APPROVAL`(gateMode가 AUTO가 아니다) ·
            `RETRY`(FAIL — 태스크가 READY로 돌아가고 retry_count가 올랐다) · `ESCALATED`(3회째 FAIL).
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/SubmittedArtifact' } } }
              example:
                data:
                  id: 44444444-4444-4444-4444-444444444444
                  taskId: '{{TASK_BE}}'
                  commitSha: a1b2c3d
                  triggeredActions: ['artifact:submit', 'code:own_path', 'test:write']
                  gateMode: AUTO
                  attempt: 1
                  verification:
                    artifactId: 44444444-4444-4444-4444-444444444444
                    attempt: 1
                    stages:
                      - { stage: V1A, result: SKIPPED }
                      - { stage: V1B, result: SKIPPED }
                      - { stage: V3, result: PASS }
                    outcome: PENDING
                    taskState: VERIFYING
                    retryCount: 0
        '401':
          $ref: '#/components/responses/PolicyStale'
        '403':
          description: |
            금지 경로·소유권 위반·남의 태스크. 세 경우 모두 `artifacts`에는 행이 생기지 않고
            `TOOL_DENIED` 이벤트만 남는다. 소유권 위반만 `path_violation=true`다.
          content:
            application/json:
              examples:
                금지경로:
                  value: { error: { code: FORBIDDEN_PATH, message: '**/.env* is denied' } }
                소유권위반:
                  value: { error: { code: SCOPE_DENIED, message: '** belongs to FRONTEND' } }
                남의태스크:
                  value: { error: { code: NOT_TASK_ASSIGNEE, message: task is assigned to another agent } }
        '409':
          description: CLAIMED·IN_PROGRESS가 아닌 상태, 또는 확인하지 않은 인계 노트가 있다
          content:
            application/json:
              examples:
                상태:
                  value: { error: { code: TASK_STATE_INVALID, message: cannot submit while task is VERIFYING } }
                노트확인:
                  value:
                    error:
                      code: NOTES_UNACKNOWLEDGED
                      message: '1 handover note(s) related to this task were published after your briefing. Read them, change your work if they affect it, then submit again with their ids in acknowledged_note_ids.'
                      details: [{ id: 5c457d82-8804-4408-a76e-3f5a355b8484, seq: 1, kind: DECIDED, headline: 인증 API 계약 확정, keyPoints: [인증이 필요한 요청은 Authorization Bearer 헤더를 쓴다], affects: [] }]

    get:
      tags: [검증]
      summary: 산출물 목록 (최신 먼저)
      description: |
        모델은 MCP 도구로 제출하므로 Executor는 방금 생긴 산출물의 id를 모른다. V2·V4 결과를
        어디에 붙일지 알아야 해서 목록을 준다.

        **사람도 호출한다** — 웹 UI가 태스크 상세에서 제출 이력을 보고, 여기서 얻은 id로
        `GET /artifacts/{artifactId}/verifications`에 닿는다. 사람 경로가 없으면 그 화면이 성립하지 않는다.

        접근 범위가 다르다: 에이전트는 **담당자만**, 사람은 대표이거나 그 프로젝트에 배정된
        에이전트의 주인이면 된다(조회뿐이다).
      security: [{ agentToken: [] }, { userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: attempt 내림차순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [artifacts], properties: { artifacts: { type: array, items: { $ref: '#/components/schemas/Artifact' } } } } } }
              example:
                data:
                  artifacts:
                    - { id: 44444444-4444-4444-4444-444444444444, taskId: '{{TASK_BE}}', commitSha: a1b2c3d, attempt: 2, gateMode: AUTO }

  /tasks/{taskId}/notes:
    post:
      tags: [태스크·노트]
      summary: publish_note — 인계 노트 발행
      description: |
        노트는 **대화 채널이 아니라 기록**이다. 본문 컬럼도, 수신자 지정도, 답글도 없다.
        정정은 새 행(`supersedes`)이다.

        **제목은 서버가 조립해** 응답의 `title`에 담는다: `#순번 - 역할 기능키 종류 — headline`.

        형식 위반은 **자르지 않고 422**로 어디가 몇 자인지 돌려준다. `DEVIATION`은 `affects`가 필수다.
        다른 에이전트의 이름·id를 넣으면 거부하고 `raise_dispute`로 안내한다 —
        **자연어로 심사하지 않는다.** 이름 없이 비난하는 문장은 통과한다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, headline, keyPoints]
              properties:
                kind: { type: string, enum: [IMPLEMENTED, DECIDED, GOTCHA, DEVIATION] }
                headline: { type: string, maxLength: 60 }
                keyPoints: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 120 } }
                affects: { type: array, maxItems: 10, items: { type: string, maxLength: 200 } }
                supersedes: { type: string, format: uuid }
            examples:
              구현완료:
                value: { kind: IMPLEMENTED, headline: participation API done, keyPoints: ['409 on full study'] }
              명세이탈:
                value: { kind: DEVIATION, headline: quota check moved to service, keyPoints: [handler was too late], affects: [contracts/F-03.yaml] }
              위반예시_affects누락:
                value: { kind: DEVIATION, headline: x, keyPoints: [y] }
      responses:
        '201':
          description: 발행됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PublishedNote' } } }
              example:
                data:
                  id: 55555555-5555-5555-5555-555555555555
                  seq: 1
                  kind: IMPLEMENTED
                  headline: participation API done
                  keyPoints: ['409 on full study']
                  affects: []
                  title: '#1 - 백엔드 F-03 구현 완료 — participation API done'
        '401':
          $ref: '#/components/responses/PolicyStale'
        '403':
          description: CLAIM하지 않은 태스크
          content:
            application/json:
              example:
                error: { code: NOT_TASK_ASSIGNEE, message: task is assigned to another agent }
        '422':
          description: |
            형식 위반. **권한 거부가 아니므로 `TOOL_DENIED`를 남기지 않는다** —
            오타를 차단 지표(M5′)에 섞지 않기 위해서다.

            위반 목록은 자르지 않고 `error.details`에 전부 담는다. 어느 필드의 몇 번째가
            몇 자인지 모르면 에이전트가 같은 요청을 반복한다.
          content:
            application/json:
              example:
                error:
                  code: NOTE_INVALID
                  message: note validation failed
                  details:
                    - { field: keyPoints, index: 0, length: 121, limit: 120, message: key_points의 각 항목은 120자 이하여야 합니다 }
                    - { field: kind, message: DEVIATION은 affects가 1개 이상이어야 합니다 }

  /projects/{projectId}/notes:
    get:
      tags: [태스크·노트]
      summary: read_notes — 인계 노트 읽기
      description: |
        **이벤트를 남기지 않는다.** 조회까지 기록하면 events가 열람 로그가 되고,
        리플레이에서 "무엇이 상태를 바꿨나"를 찾기 어려워진다.

        내 태스크에 필요한 노트는 서버가 프롬프트에 주입하므로, 에이전트는 더 필요할 때만 쓴다.

        **사람도 호출한다** — 노트는 "무엇을 어떻게 진행했는가"의 기록이므로 웹 UI의 진행 상황
        화면의 본문이 된다. 사람은 대표이거나 그 프로젝트에 배정된 에이전트의 주인이어야 한다.
        단, 노트는 에이전트의 **자기 보고**다. 검증 통과 여부는 `verifications`에서 확인한다.
      security: [{ agentToken: [] }, { userToken: [] }]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{PROJECT_ID}}'
        - name: spec_id
          in: query
          schema: { type: string, format: uuid }
          description: 이 기능 명세의 노트만
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
          description: 이 순번 이후만
          example: 0
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          example: 5
      responses:
        '200':
          description: 최신순 목록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [notes], properties: { notes: { type: array, items: { $ref: '#/components/schemas/Note' } } } } } }
              example:
                data:
                  notes:
                    - { id: 55555555-5555-5555-5555-555555555555, seq: 1, kind: IMPLEMENTED, headline: participation API done, affects: [] }
        '401':
          $ref: '#/components/responses/PolicyStale'
        '403':
          description: 다른 프로젝트
          content:
            application/json:
              example:
                error: { code: NOT_PROJECT_MEMBER, message: agent is not a member of this project }

  /orgs/{orgId}/projects:
    get:
      tags: [프로젝트]
      summary: 프로젝트 목록 (대표는 전체, 팀원은 배정된 것만)
      description: |
        팀원은 **자기 에이전트가 배정된 프로젝트만** 본다(`GET /projects/{projectId}`의 권한과 같은 정의).
        팀원이 대시보드에 들어갈 프로젝트 id를 아는 경로다. 최근 생성 순.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [projects], properties: { projects: { type: array, items: { $ref: '#/components/schemas/Project' } } } } } }
              example:
                data:
                  projects:
                    - { id: '{{PROJECT_ID}}', orgId: '{{ORG_ID}}', name: 스터디 관리 웹앱 v1, autonomyPreset: L2, policyHash: bc7f3b33d92b36b25607093d7efb05cdacf73f1f0b52524046bff7b56e94442c, constitutionHash: null, pmBudgetUsd: '40.00', budgetUsd: null, deadline: '2026-10-31', status: planning, startedAt: null, createdBy: 1959e109-c60c-43f4-842f-dd18d9e7afab, createdAt: '2026-09-29T02:00:00.000Z' }
        '403':
          description: 다른 조직
          content:
            application/json:
              example:
                error: { code: CROSS_ORG_ACCESS, message: cannot access another organization }
    post:
      tags: [프로젝트]
      summary: 프로젝트 생성 (대표 전용)
      description: |
        한 트랜잭션에서 다섯 가지가 함께 만들어진다:
        프로젝트 행(`status=planning`, `started_at=NULL`) · 레포 연결 ·
        **허용 레벨의 해당 열을 복사한 `project_policies` 17행** · 조직 헌법 스냅샷 · `policy_hash`.

        판정은 이후 `action_catalog`가 아니라 **이 사본만** 본다 — 정책표가 바뀌어도 진행 중인 프로젝트는 흔들리지 않는다.
        헌법도 생성 시점 사본을 들고 간다. 조직 헌법이 나중에 바뀌어도 과거 판정의 근거가 남아야 하기 때문이다.

        **같은 레포를 두 활성 프로젝트가 쓸 수 없다**(409). 경로 소유권이 두 곳에 걸리기 때문이다.
        `status`가 `completed`·`aborted`인 프로젝트의 레포는 다시 쓸 수 있다.

        `autonomyPreset`은 zod가 아니라 서비스가 판정해서 **422**로 무엇이 허용되는지 함께 답한다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, autonomyPreset, pmBudgetUsd, repoIds]
              properties:
                name: { type: string, maxLength: 128 }
                autonomyPreset: { type: string, description: 'L1 | L2 | L3 | L4' }
                pmBudgetUsd:
                  type: number
                  description: PM 예산. 필수 — PM은 NOMOS 키로 돌아 비용을 우리가 부담한다.
                budgetUsd: { type: number, description: 프로젝트 전체 상한 (선택) }
                deadline: { type: string, example: '2026-12-31' }
                repoIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
            example:
              name: 스터디 관리 웹앱 v2
              autonomyPreset: L2
              pmBudgetUsd: 40
              repoIds: ['{{REPO_API}}']
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProjectDetail' } } }
              example:
                data:
                  project:
                    id: '{{PROJECT_ID}}'
                    name: 스터디 관리 웹앱 v2
                    autonomyPreset: L2
                    status: planning
                    startedAt: null
                    pmBudgetUsd: '40.00'
                    budgetUsd: null
                    # date 컬럼이지만 응답은 보낸 그대로의 YYYY-MM-DD 문자열이다
                    # (pg가 주는 Date를 toProject가 날짜 문자열로 되돌린다 — 타임존으로 밀리지 않는다).
                    deadline: '2026-12-31'
                    policyHash: bc7f3b33d92b36b25607093d7efb05cdacf73f1f0b52524046bff7b56e94442c
                    constitutionHash: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
                    createdBy: '{{USER_REP}}'
                  repos: [{ id: '{{REPO_API}}', orgId: '{{ORG_ID}}', fullName: acme/study-api }]
                  members: []
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '404':
          description: 없는 레포
          content:
            application/json:
              example:
                error: { code: REPO_NOT_FOUND, message: repository not found }
        '409':
          description: |
            진행 중(planning·active·halted) 프로젝트가 이미 쓰는 레포가 있다. `details`에 겹치는 레포가 **전부** 온다 —
            레포 목록(`GET /orgs/{orgId}/repos`)의 `activeProjectId`와 같은 판정이라, 목록에서 미리 거를 수 있다.
          content:
            application/json:
              example:
                error:
                  code: REPO_IN_ACTIVE_PROJECT
                  message: 'repositories already used by an in-progress project: acme/study-api (스터디 관리 웹앱 v1)'
                  details: [{ repoId: 26346a01-2db3-4445-a3b2-493e999662f3, fullName: acme/study-api, projectId: 3f273134-c222-411b-9f69-ca5d267e9a6b, projectName: 스터디 관리 웹앱 v1 }]
        '422':
          description: |
            허용 레벨 어휘 위반, 또는 소유 역할이 하나도 지정되지 않은 레포.

            소유 역할이 하나도 없는 레포는 기본 거부라 **아무도 쓸 수 없다** — 원인이 제출 시점에야 드러나지 않게
            생성에서 막는다. 메시지에 막힌 레포 전부와 부를 API를 함께 적는다. `GET /orgs/{orgId}/repos`의
            `ownershipAssigned`로 미리 알 수 있다.
          content:
            application/json:
              examples:
                허용레벨:
                  value: { error: { code: INVALID_AUTONOMY_PRESET, message: 'autonomyPreset must be one of L1, L2, L3, L4' } }
                소유권미지정:
                  value: { error: { code: REPO_OWNERSHIP_NOT_SET, message: '레포의 경로 소유권을 먼저 지정하세요. PATCH /api/repos/{{REPO_API}}/paths/:pathId' } }

  /projects/{projectId}:
    get:
      tags: [프로젝트]
      summary: 프로젝트 상세 (대표 또는 배정된 에이전트의 주인)
      description: 상태·허용 레벨·`policy_hash`·레포 목록·멤버 목록을 함께 준다. DB를 직접 보지 않고 확인하기 위한 창구다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProjectDetail' } } }
              example:
                data:
                  project:
                    id: '{{PROJECT_ID}}'
                    status: planning
                    autonomyPreset: L2
                    policyHash: bc7f3b33d92b36b25607093d7efb05cdacf73f1f0b52524046bff7b56e94442c
                    startedAt: null
                    pmBudgetUsd: '40.00'
                  repos:
                    - { id: '{{REPO_API}}', fullName: acme/study-api }
                  members:
                    - { agentId: '{{AGENT_BE}}', agentName: be-laptop, teamRole: BACKEND }
        '403':
          description: 이 프로젝트의 멤버가 아님
          content:
            application/json:
              example:
                error: { code: NOT_PROJECT_MEMBER, message: you are not a member of this project }
        '404':
          description: 없는 프로젝트
          content:
            application/json:
              example:
                error: { code: PROJECT_NOT_FOUND, message: project not found }

  /projects/{projectId}/start:
    post:
      tags: [프로젝트]
      summary: 프로젝트 시작 G1 (대표 전용)
      description: |
        **이 순간부터 실행이 시작된다.** 시작 전에는 에이전트가 태스크를 가져갈 수 없고(`claim` → 409 `PROJECT_NOT_STARTED`),
        시작하면 서버가 역할별 담당 에이전트에게 지금 가져갈 수 있는 태스크를 보낸다(웹소켓 `/api/agents/stream`, `GET /agents/me/tasks` 참고).

        시작할 수 있는가 — 위반은 전부 모아 422 `PROJECT_START_INVALID`(`details: [{ where, message }]`):
        - 태스크가 하나 이상 있다(PM 계획을 적용하거나 태스크를 만든 뒤).
        - 끝나지 않은 태스크가 요구하는 **역할마다 배정된 에이전트가 있다.** 시작 뒤에는 멤버를 바꿀 수 없으므로 여기서 막는다.

        시작하면: `planning → active`, `startedAt`. 시작 시점의 명세·적용된 계획에 승인 시각(잠김). 멤버 고정(배정·해제 403).
        이미 시작했으면 409 `PROJECT_ALREADY_STARTED`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 시작됨
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/ProjectDetail' } } }
              example:
                data:
                  project: { id: '{{PROJECT_ID}}', status: active, startedAt: '2026-10-02T01:00:00.000Z' }
                  repos: []
                  members: [{ agentId: 3f0e0d6a-8a2b-4c1f-9e7d-2b3c4d5e6f70, agentName: be-laptop, teamRole: BACKEND, userId: 6c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f }]
        '409':
          description: 이미 시작했다
          content:
            application/json:
              example:
                error: { code: PROJECT_ALREADY_STARTED, message: 'project started at 2026-10-02T01:00:00.000Z' }
        '422':
          description: 시작할 수 없다(태스크 없음·역할 공백)
          content:
            application/json:
              example:
                error:
                  code: PROJECT_START_INVALID
                  message: 'project cannot start: 1 problem(s)'
                  details: [{ where: members.FRONTEND, message: FRONTEND 역할의 태스크가 있는데 배정된 에이전트가 없다 — 시작하면 멤버를 바꿀 수 없으니 먼저 배정한다 }]
  /orgs/{orgId}/approvals:
    get:
      tags: [승인]
      summary: 조직 승인 대기열 (대표 전용)
      description: |
        대시보드 "승인 · 결정 대기"와 받은 편지함. 기본은 대기 중(`status=pending`)만 준다.
        지금 생기는 카드는 ACTION 하나다 — 검증은 통과했지만 정책 판정이 HUMAN·PM_REVIEW라 태스크가 `AWAITING_APPROVAL`에 멈춘 산출물.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, decided, all], default: pending } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 요청 시각 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approvals]
                    properties:
                      approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
              example:
                data:
                  approvals:
                    - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      projectId: '{{PROJECT_ID}}'
                      projectName: 스터디 관리 웹앱 v1
                      gate: ACTION
                      taskId: '{{TASK_BE}}'
                      taskTitle: T-001 참여 신청 API 구현
                      taskState: AWAITING_APPROVAL
                      artifactId: 44444444-4444-4444-4444-444444444444
                      gateMode: HUMAN
                      payload: { taskTitle: T-001 참여 신청 API 구현, commitSha: a1b2c3d, changedPaths: [migrations/010_x.sql], triggeredActions: ['artifact:submit', 'db:migration'], gateMode: HUMAN, attempt: 1, stages: [{ stage: V3, result: PASS }] }
                      decision: null
                      decidedBy: null
                      reason: null
                      requestedAt: '2026-10-05T01:00:00.000Z'
                      decidedAt: null
  /projects/{projectId}/approvals:
    get:
      tags: [승인]
      summary: 프로젝트 승인 이력
      description: 볼 수 있는 범위는 태스크·노트와 같다(대표는 전부, 팀원은 배정된 프로젝트). 결정은 대표만 한다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, decided, all], default: pending } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 요청 시각 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approvals]
                    properties:
                      approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
              example:
                data:
                  approvals:
                    - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      projectId: '{{PROJECT_ID}}'
                      projectName: 스터디 관리 웹앱 v1
                      gate: ACTION
                      taskId: '{{TASK_BE}}'
                      taskTitle: T-001 참여 신청 API 구현
                      taskState: AWAITING_APPROVAL
                      artifactId: 44444444-4444-4444-4444-444444444444
                      gateMode: HUMAN
                      payload: { taskTitle: T-001 참여 신청 API 구현, commitSha: a1b2c3d, changedPaths: [migrations/010_x.sql], triggeredActions: ['artifact:submit', 'db:migration'], gateMode: HUMAN, attempt: 1, stages: [{ stage: V3, result: PASS }] }
                      decision: null
                      decidedBy: null
                      reason: null
                      requestedAt: '2026-10-05T01:00:00.000Z'
                      decidedAt: null
  /approvals/{approvalId}/approve:
    post:
      tags: [승인]
      summary: 승인 (대표 전용)
      description: |
        태스크가 `DONE`이 된다. 뒤에 걸린 태스크가 풀리면 담당 에이전트에게 바로 간다.
        대표가 자기 에이전트의 산출물을 승인하면 이벤트에 `selfApproval: true`가 남는다(지금은 대표 말고 승인자가 없어 허용).
      security: [{ userToken: [] }]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 승인됨(decision=APPROVE, 태스크 DONE)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Approval' } } }
        '404':
          description: 없는 승인
          content:
            application/json:
              example:
                error: { code: APPROVAL_NOT_FOUND, message: approval not found }
        '409':
          description: 이미 결정됨, 또는 태스크가 더 이상 승인 대기가 아님
          content:
            application/json:
              examples:
                결정됨:
                  value: { error: { code: APPROVAL_ALREADY_DECIDED, message: approval was already decided (APPROVE) } }
                상태바뀜:
                  value: { error: { code: APPROVAL_STALE, message: the task is no longer awaiting approval (READY) } }
  /approvals/{approvalId}/reject:
    post:
      tags: [승인]
      summary: 반려 (대표 전용, 사유 필수)
      description: |
        태스크가 `READY`로 돌아가고(담당 비움) 재시도 횟수가 1 오른다 — **3회째는 `ESCALATED`**(검증 실패와 같은 횟수를 쓴다).
        같은 역할의 에이전트가 다시 받아 **같은 태스크 브랜치에서 이어서** 고친다. 사유는 그 시도의 브리핑(`lastRejection`)으로 간다.
      security: [{ userToken: [] }]
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
            example:
              reason: 마이그레이션에 down이 없다. 되돌릴 수 있게 추가해 달라
      responses:
        '200':
          description: 반려됨(decision=REJECT, 태스크 READY 또는 ESCALATED)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Approval' } } }
        '404':
          description: 없는 승인
          content:
            application/json:
              example:
                error: { code: APPROVAL_NOT_FOUND, message: approval not found }
        '409':
          description: 이미 결정됨, 또는 태스크가 더 이상 승인 대기가 아님
          content:
            application/json:
              examples:
                결정됨:
                  value: { error: { code: APPROVAL_ALREADY_DECIDED, message: approval was already decided (APPROVE) } }
                상태바뀜:
                  value: { error: { code: APPROVAL_STALE, message: the task is no longer awaiting approval (READY) } }
  /projects/{projectId}/events:
    get:
      tags: [프로젝트]
      summary: 이벤트 로그 (최신순)
      description: |
        프로젝트에서 일어난 일을 최신순으로 준다(활동 화면·대시보드 최근 활동). events는 지워지지 않는 기록이라 그대로 읽는다.
        볼 수 있는 범위는 태스크·노트와 같다 — 대표는 전부, 팀원은 자기 에이전트가 배정된 프로젝트.

        - 페이지: 응답의 `nextBefore`를 다음 요청의 `before`로 넘긴다. null이면 끝이다. 시각이 아니라 id로 넘긴다(같은 순간의 이벤트가 경계에서 빠지지 않게).
        - `types`로 거른다(쉼표로 여러 개). `payload` 모양은 `type`마다 다르다.
        - `onBehalfOf`는 사람(user id)이거나 시스템 주체 문자열(`system:pm`, `system:device-flow` 등)이다.
        - `tokenCost`는 그 행의 비용(USD) — 지금은 PM 호출(`PM_CALL`)에만 있다. 태스크별·사람별 비용 집계는 별도 API로 다룬다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: before, in: query, required: false, schema: { type: string, pattern: '^[0-9]+$' }, description: '이 id보다 오래된 이벤트만' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: types, in: query, required: false, schema: { type: string }, example: 'TASK_CLAIMED,NOTE_PUBLISHED' }
      responses:
        '200':
          description: 최신순
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [events, nextBefore]
                    properties:
                      events: { type: array, items: { $ref: '#/components/schemas/ProjectEvent' } }
                      nextBefore: { type: string, nullable: true, description: '다음 페이지의 before. null이면 끝' }
              example:
                data:
                  events:
                    - { id: '1042', type: NOTE_PUBLISHED, ts: '2026-10-02T00:58:05.640Z', onBehalfOf: e8227252-a58b-4266-839b-8674f99b1e4a, actorAgentId: e6c879be-2a69-4f82-a30d-5063ff664262, payload: { noteId: 5c457d82-8804-4408-a76e-3f5a355b8484, kind: DECIDED }, tokenCost: null, pathViolation: null }
                  nextBefore: null
  /projects/{projectId}/rooms:
    get:
      tags: [룸]
      summary: 내가 볼 수 있는 룸 목록
      description: |
        룸 = 프로젝트 × 역할. **팀원은 자기 에이전트가 배정된 역할 룸만, 대표는 전부** 본다.
        룸마다 담당 에이전트(온라인 여부)와 진행 중 태스크를 준다 — 룸 화면 머리.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 룸 목록(FRONTEND, BACKEND 순)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [rooms], properties: { rooms: { type: array, items: { $ref: '#/components/schemas/RoomSummary' } } } } } }

  /projects/{projectId}/rooms/{role}/feed:
    get:
      tags: [룸]
      summary: 룸 피드 (최신부터)
      description: |
        서버(PM)의 지시·판정, Executor의 실행 상태, 에이전트의 도구 사용을 시각순으로 섞은 한 줄씩. **문장(`text`)은 서버가 만든다** — 화면은 그대로 보여 주면 된다.

        예(오래된 것부터):
        ```
        [pm]    T-3 회원가입 API 실행해 주세요
        [nomos] 에이전트를 실행합니다
        [nomos] 태스크 수령 — T-3 회원가입 API · 구현을 시작합니다
        [agent] src/routes/auth.ts 읽는 중
        [agent] src/routes/auth.ts 수정
        [agent] npm test 실행
        [nomos] 제출했습니다 (커밋 a1b2c3d, 파일 3개)
        [pm]    검증 완료 — V3 통과, V1A·V1B·V2·V4 건너뜀 → 완료되었습니다
        [nomos] 실행을 마쳤습니다 (240초)
        ```
        태스크에 딸린 줄은 그 태스크의 역할 룸에만(역할 제한 없는 태스크는 모든 룸), 프로젝트 단위 PM 알림(시작·계획 적용)은 모든 룸에 나온다.
        응답은 **최신부터**이고, `nextBefore`를 `before`로 넘기면 더 오래된 줄을 읽는다(없으면 null).
        실시간: `/api/stream`에서 그 프로젝트를 구독하면 `room` 토픽이 올 때 다시 읽는다.
        팀원이 다른 역할 룸을 읽으면 403 `ROOM_NOT_VISIBLE`.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: role
          in: path
          required: true
          schema: { type: string, enum: [FRONTEND, BACKEND] }
          example: BACKEND
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: 이전 응답의 nextBefore
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 피드
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [messages, nextBefore], properties: { messages: { type: array, items: { $ref: '#/components/schemas/RoomMessage' } }, nextBefore: { type: string, nullable: true } } } } }
        '403':
          description: 자기 역할이 아닌 룸
          content:
            application/json:
              example:
                error: { code: ROOM_NOT_VISIBLE, message: you cannot see the BACKEND room of this project }

  /projects/{projectId}/members:
    post:
      tags: [프로젝트]
      summary: 역할 배정 (대표 전용)
      description: |
        **배정 뒤 그 에이전트는 토큰을 재발급해야 한다.** 배정 전에 발급된 토큰에는 `project_id`가 없어
        태스크·노트 API가 403 `NOT_PROJECT_MEMBER`로 막힌다. `POST /agents/token/refresh`를 한 번 부르면 된다.
        응답의 `notice`에도 같은 안내가 들어 있다.

        프로젝트당 역할은 **하나씩만** 배정된다(`uq_project_members_role`). 실험 통제를 위해서다.
        **G1(`started_at`) 이후에는 멤버를 바꿀 수 없다** — 도중에 바뀌면 통제가 흔들린다.

        **GitHub 협업자 자동 초대**: 배정과 함께 그 에이전트 주인을 프로젝트의 GitHub 레포(`githubRepoId`가 있는 것)마다
        push 권한 협업자로 초대한다(대표의 GitHub 토큰). 결과는 `githubInvites`(레포마다 한 줄). 초대가 실패해도 배정은 유효하다 —
        멤버가 GitHub를 연결하지 않았으면 `skipped`이고, 연결한 뒤 `POST .../members/{agentId}/github-invite`로 다시 보낸다.
        GitHub 레포가 없는 프로젝트(로컬 데모)는 빈 배열이다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, teamRole]
              properties:
                agentId: { type: string, format: uuid }
                teamRole: { type: string, enum: [FRONTEND, BACKEND] }
            example:
              agentId: '{{AGENT_BE}}'
              teamRole: BACKEND
      responses:
        '201':
          description: 배정됨. 남은 멤버 목록과 재발급 안내를 함께 준다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [members, githubInvites, notice], properties: { members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }, githubInvites: { type: array, items: { $ref: '#/components/schemas/GithubInviteResult' } }, notice: { type: string } } } } }
              example:
                data:
                  members:
                    - { agentId: '{{AGENT_BE}}', agentName: be-laptop, teamRole: BACKEND }
                  githubInvites:
                    - { repoId: '{{REPO_API}}', fullName: acme/study-api, status: invited }
                  notice: 배정된 에이전트는 POST /api/agents/token/refresh로 토큰을 재발급해야 태스크·노트 API를 쓸 수 있습니다.
        '403':
          description: 대표가 아님 · 다른 조직의 에이전트 · G1 이후
          content:
            application/json:
              examples:
                남의조직에이전트:
                  value: { error: { code: AGENT_NOT_IN_ORG, message: agent does not belong to this organization } }
                시작된프로젝트:
                  value: { error: { code: PROJECT_STARTED, message: project has started; members are frozen } }
        '409':
          description: 역할이 이미 찼거나, 그 에이전트가 이미 배정됐거나, 다른 진행 중 프로젝트를 맡고 있음
          content:
            application/json:
              examples:
                다른프로젝트:
                  value: { error: { code: AGENT_IN_ANOTHER_PROJECT, message: 'agent ... is already assigned to active project ...; unassign it there first' } }
                역할중복:
                  value: { error: { code: ROLE_ALREADY_ASSIGNED, message: BACKEND is already assigned in this project } }
                에이전트중복:
                  value: { error: { code: AGENT_ALREADY_ASSIGNED, message: this agent is already a member of the project } }

  /projects/{projectId}/members/{agentId}/github-invite:
    post:
      tags: [프로젝트]
      summary: GitHub 협업자 초대 다시 보내기 (대표 전용)
      description: |
        역할 배정 때 멤버가 GitHub를 연결하지 않았거나 GitHub 호출이 실패했을 때 다시 보낸다.
        멤버 구성을 바꾸는 게 아니라 접근을 주는 일이라 **시작(G1) 뒤에도 된다.** 실패해도 200이고 결과는 `githubInvites`에 적힌다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: agentId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{AGENT_BE}}'
      responses:
        '200':
          description: 레포마다 초대 결과
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [githubInvites], properties: { githubInvites: { type: array, items: { $ref: '#/components/schemas/GithubInviteResult' } } } } } }
              example:
                data:
                  githubInvites:
                    - { repoId: '{{REPO_API}}', fullName: acme/study-api, status: skipped, reason: 멤버가 GitHub를 연결하지 않았다 }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '404':
          description: 이 프로젝트의 멤버가 아닌 에이전트
          content:
            application/json:
              example:
                error: { code: MEMBER_NOT_FOUND, message: agent ... is not a member of this project }

  /projects/{projectId}/members/{agentId}:
    delete:
      tags: [프로젝트]
      summary: 배정 해제 (대표 전용)
      description: |
        **역할 교체는 해제 후 재배정으로 한다.** UPDATE 경로를 두면 한 역할에 둘이 잠깐 겹칠 수 있다.
        G1(`started_at`) 이후에는 해제도 막힌다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: agentId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: '{{AGENT_BE}}'
      responses:
        '200':
          description: 해제됨. 남은 멤버 목록을 준다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [members], properties: { members: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } } } } } }
              example:
                data: { members: [] }
        '403':
          description: 대표가 아니거나 G1 이후
          content:
            application/json:
              example:
                error: { code: PROJECT_STARTED, message: project has started; members are frozen }
        '404':
          description: 배정되지 않은 에이전트
          content:
            application/json:
              example:
                error: { code: MEMBER_NOT_FOUND, message: agent is not a member of this project }

  /agents/me:
    get:
      tags: [CLI 연결]
      summary: 에이전트 자기 설정
      description: |
        Executor가 기동할 때 자기 프로젝트·역할·동시 실행 상한을 읽는다. 이 값들을 Executor 쪽 설정
        파일에 적어두면 서버에서 바꿔도 반영되지 않으므로, 서버가 정본을 준다.
      security: [{ agentToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentSelf' } } }
              example:
                data:
                  agentId: 2012e1df-0beb-43fd-ac09-d893ba56b01e
                  projectId: '{{PROJECT_ID}}'
                  teamRole: BACKEND
                  maxConcurrent: 2

  /projects/{projectId}/pm/plans:
    get:
      tags: [내장 PM]
      summary: PM 계획 요청 이력 (대표 전용)
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 최근 요청 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [plans], properties: { plans: { type: array, items: { $ref: '#/components/schemas/PmPlan' } } } } } }
              example:
                data: { plans: [] }
    post:
      tags: [내장 PM]
      summary: 계획 초안 요청 (대표 전용)
      description: |
        대표의 지시로 PM(NOMOS 내장)이 명세(API·화면 계약 + 수용 기준)와 태스크 DAG(어느 레포·어느 역할이 무엇을 어떤 순서로) 초안을 만든다.
        **202로 바로 답하고 PM은 뒤에서 돈다**(수십 초~수 분). `GET .../pm/plans/{planId}`를 몇 초 간격으로 폴링해 `ready`·`failed`를 본다.

        - 프로젝트당 진행 중인 요청은 하나(409 `PM_PLAN_IN_PROGRESS`)
        - 호출 전에 "누적 PM 비용 + 이번 호출의 최대치 > PM 예산"이면 409 `PM_BUDGET_EXCEEDED` —
          설계상 예산 초과는 대표 승인 카드가 떠야 하지만 **승인 경로 미구현**이라 거절만 한다
        - 서버에 PM 키가 없으면 503 `PM_UNAVAILABLE`
        - 초안은 명세·태스크 생성과 같은 코드 검증을 거친다. 틀리면 PM이 **한 번만** 고치고, 그래도 틀리면 `failed(invalid)`
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, maxLength: 8000 }
            example:
              instruction: 3주 안에 사내 스터디 관리 웹앱. 회원가입, 스터디 개설, 참여신청, 출석체크. 모바일 대응 필수.
      responses:
        '202':
          description: 접수됨(status=pending)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: pending, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: null, draft: null, error: null, costUsd: 0, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: null, rejectedAt: null, rejectReason: null, assignments: [] }
        '409':
          description: 진행 중인 요청 있음 · 예산 초과 · 끝난 프로젝트
          content:
            application/json:
              examples:
                진행중:
                  value: { error: { code: PM_PLAN_IN_PROGRESS, message: a PM plan is already being drafted for this project; wait for it to finish } }
                예산:
                  value: { error: { code: PM_BUDGET_EXCEEDED, message: 'PM budget would be exceeded: … 승인 경로 미구현 — …' } }
        '503':
          description: 서버에 PM 키(ANTHROPIC_API_KEY)가 없다
          content:
            application/json:
              example:
                error: { code: PM_UNAVAILABLE, message: the built-in PM is not configured on this server (ANTHROPIC_API_KEY) }

  /projects/{projectId}/pm/status:
    get:
      tags: [내장 PM]
      summary: PM 준비 상태 (대표 전용)
      description: |
        "계획 받기" 버튼을 켜기 전에 본다. **요청 자체를 막지는 않는다.**
        - `ready: false`, `reason: NO_API_KEY` — API 모드인데 서버에 키가 없다. 요청하면 503.
        - `ready: false`, `reason: WORKER_OFFLINE` — 중계 모드인데 대표 노트북의 pm-worker가 30초 넘게 작업을 확인하지 않았다(꺼져 있다).
          요청하면 받아지지만 아무도 가져가지 않아 `PM_TIMEOUT_MS`(기본 10분) 뒤 `failed(timeout)`이 된다.
          pm-worker는 3초마다 확인하므로 켜면 몇 초 안에 `ready: true`가 된다.
        - `pendingPlanId`가 있으면 작성 중인 계획이 있어 새 요청은 409다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: 상태
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [provider, ready, reason, workerLastSeenAt, budgetUsd, spentUsd, pendingPlanId]
                    properties:
                      provider: { type: string, enum: [api, relay] }
                      ready: { type: boolean }
                      reason: { type: string, enum: [NO_API_KEY, WORKER_OFFLINE], nullable: true }
                      workerLastSeenAt: { type: string, format: date-time, nullable: true, description: '중계 모드에서 pm-worker가 마지막으로 작업을 확인한 시각' }
                      budgetUsd: { type: number }
                      spentUsd: { type: number }
                      pendingPlanId: { type: string, format: uuid, nullable: true }
              example:
                data: { provider: relay, ready: false, reason: WORKER_OFFLINE, workerLastSeenAt: null, budgetUsd: 5, spentUsd: 0.1077, pendingPlanId: null }
  /projects/{projectId}/pm/plans/{planId}:
    get:
      tags: [내장 PM]
      summary: 계획 상태·초안 (대표 전용)
      description: |
        `pending`이면 작성 중이다. `ready`면 `draft`를 검토한다 — 명세의 계약과 태스크별 담당 역할·선행 관계.
        `failed`면 `error.reason`으로 이유를 보여준다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 계획
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: ready, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: SEQUENTIAL, draft: { mode: SEQUENTIAL, rationale: 요구사항이 작고 명확하다, estimate: { workingDays: 10, notes: '' }, specs: [], tasks: [] }, error: null, costUsd: 0.4213, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: null, rejectedAt: null, rejectReason: null, assignments: [] }
        '404':
          description: 없는 계획
          content:
            application/json:
              example:
                error: { code: PLAN_NOT_FOUND, message: plan not found }

  /projects/{projectId}/pm/plans/{planId}/revise:
    post:
      tags: [내장 PM]
      summary: 수정 요청 (대표 전용)
      description: |
        `ready`인 초안에 피드백을 붙여 새 초안을 요청한다(이전 초안 + 피드백으로 새로 쓴다). 새 계획이 pending으로 생기고
        이전 초안은 그대로 남는다. 한 수정 체인에서는 하나만 적용할 수 있다.

        **수정 요청은 한 체인에서 3회까지**(서버 설정 `PM_MAX_REVISIONS`, 기본 3). 원본 요청은 세지 않고, 실패한 수정 요청도 센다.
        넘으면 409 `PLAN_REVISION_LIMIT`, `details: { limit, used }`. 새 계획 요청(`POST …/pm/plans`)은 새 체인이라 0부터 다시 센다.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, maxLength: 8000 }
            example:
              feedback: 출석체크는 다음 단계로 미루고, 스터디 개설에 정원 설정을 넣어줘
      responses:
        '202':
          description: 새 초안 접수됨(status=pending)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 2c3d4e5f-6071-4b2c-9d3e-4f5a6b7c8d9e, projectId: '{{PROJECT_ID}}', status: pending, instruction: '3주 안에 …', feedback: 출석체크는 다음 단계로, parentPlanId: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, mode: null, draft: null, error: null, costUsd: 0, createdAt: '2026-09-30T02:05:00.000Z', appliedAt: null, rejectedAt: null, rejectReason: null, assignments: [] }
        '409':
          description: ready가 아닌 초안, 또는 수정 요청 한도 초과
          content:
            application/json:
              examples:
                상태:
                  value: { error: { code: PLAN_NOT_APPLICABLE, message: only a ready plan can be revised } }
                한도:
                  value: { error: { code: PLAN_REVISION_LIMIT, message: 'this plan has already been revised 3 time(s) (limit 3); start a new plan request instead', details: { limit: 3, used: 3 } } }

  /projects/{projectId}/pm/plans/{planId}/apply:
    post:
      tags: [내장 PM]
      summary: 초안 적용 (대표 전용)
      description: |
        저장된 초안을 **그대로** 명세·태스크로 만든다(명세·태스크 생성과 같은 검증·잠금, `source: pm`). 시험지는 만들지 않는다.
        태스크는 READY라 배정된 에이전트가 바로 수령할 수 있다. **G1(프로젝트 시작)이 아니다** — 프로젝트 상태는 그대로다.

        - 두 번 적용하거나 같은 수정 체인의 다른 초안을 적용하면 409 `PLAN_NOT_APPLICABLE`
        - 초안 뒤에 상황이 바뀌어 검증에 걸리면 422 `PLAN_INVALID` — 아무것도 만들지 않고 계획은 `ready`로 남는다. 수정 요청으로 이어가면 된다
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 적용됨(status=applied)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: applied, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: SEQUENTIAL, draft: null, error: null, costUsd: 0.4213, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: '2026-09-30T02:10:00.000Z', rejectedAt: null, rejectReason: null, assignments: [] }
        '409':
          description: 적용할 수 없는 상태
          content:
            application/json:
              example:
                error: { code: PLAN_NOT_APPLICABLE, message: another plan in this revision chain has already been applied }
        '422':
          description: 초안 이후 상황이 바뀌어 검증 실패(계획은 ready로 남는다)
          content:
            application/json:
              example:
                error: { code: PLAN_INVALID, message: 명세·태스크 검증 실패 1건, details: [{ where: 'tasks[api]', message: '태스크 "T-1"이 프로젝트에 이미 있다 (다시 보낸 건 아닌가?)' }] }

  /pm/jobs/next:
    get:
      tags: [내장 PM]
      summary: (중계 모드) 다음 PM 작업 가져가기 — 대표의 pm-worker 전용
      description: |
        **서버가 `PM_PROVIDER=relay`일 때만 쓴다.** 결제 전까지 PM의 모델 호출을 대표 노트북의 Claude Code로 대신 돌리는 임시 방식이다 —
        `npm run executor pm-worker`가 몇 초마다 부른다. 사람이 직접 부를 일은 없다.
        API 모드(`PM_PROVIDER=api`, 기본)에서는 409 `PM_RELAY_DISABLED`.

        조직 **대표 본인의** 에이전트만 가져간다(그 밖은 403 `NOT_REPRESENTATIVE`). 한 번 가져간 작업은 다시 나오지 않고, 없으면 `job: null`.
        아무도 가져가지 않으면 `PM_TIMEOUT_MS` 뒤 계획이 `failed(timeout)`가 된다.
      security: [{ agentToken: [] }]
      responses:
        '200':
          description: 작업(없으면 null)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [job]
                    properties:
                      job: { $ref: '#/components/schemas/PmRelayJob', nullable: true }
              example:
                data: { job: null }
        '409':
          description: 서버가 API 모드다
          content:
            application/json:
              example:
                error: { code: PM_RELAY_DISABLED, message: 'this server calls the model API directly (PM_PROVIDER=api); no pm-worker is needed' }
  /pm/jobs/{jobId}/result:
    post:
      tags: [내장 PM]
      summary: (중계 모드) PM 작업 결과 제출 — 대표의 pm-worker 전용
      description: |
        모델이 낸 텍스트를 **그대로** 돌려준다. 해석·검증·교정·비용 기록은 API 모드와 똑같이 서버가 한다 —
        결과는 `GET /projects/{projectId}/pm/plans/{planId}`의 `draft`로 보인다.
        가져간 에이전트가 아니거나 이미 끝난(시간 제한·재시작) 작업이면 404 `PM_JOB_NOT_FOUND`.
      security: [{ agentToken: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopReason, servedModel, text, usage]
              properties:
                stopReason: { type: string, nullable: true, description: 'refusal·max_tokens면 서버가 refused·truncated로 닫는다' }
                servedModel: { type: string, nullable: true }
                text: { type: string, description: '모델 출력(JSON 텍스트) 그대로' }
                usage:
                  type: object
                  required: [inputTokens, outputTokens, cacheWriteTokens, cacheReadTokens]
                  properties:
                    inputTokens: { type: integer }
                    outputTokens: { type: integer }
                    cacheWriteTokens: { type: integer }
                    cacheReadTokens: { type: integer }
      responses:
        '200':
          description: 받음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PmRelayAccepted' }
              example: { data: { accepted: true } }
        '404':
          description: 없는 작업
          content:
            application/json:
              example:
                error: { code: PM_JOB_NOT_FOUND, message: 'relay job not found (finished, timed out, or the server restarted)' }
  /pm/jobs/{jobId}/failure:
    post:
      tags: [내장 PM]
      summary: (중계 모드) PM 작업 실패 보고 — 대표의 pm-worker 전용
      description: |
        노트북에서 claude 실행이 실패했다(로그인 안 됨·실행 오류 등). 시간 제한까지 기다리지 않고 계획을 `failed(api_error)`로 닫는다.
        `message`는 `error.detail.message`에 남는다.
      security: [{ agentToken: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: 받음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PmRelayAccepted' }
              example: { data: { accepted: true } }
        '404':
          description: 없는 작업
          content:
            application/json:
              example:
                error: { code: PM_JOB_NOT_FOUND, message: 'relay job not found (finished, timed out, or the server restarted)' }

  /projects/{projectId}/pm/plans/{planId}/reject:
    post:
      tags: [내장 PM]
      summary: 초안 반려 (대표 전용)
      description: |
        `ready` 초안을 버린다(`rejected`). **다시 받지 않고 닫는 것**이다 — 고쳐서 다시 받으려면 `revise`(수정 요청)를 쓴다.
        반려한 초안은 적용·수정 요청할 수 없다(409). 본문은 없어도 된다(사유는 선택, 1000자 이하).
        `ready`가 아니면(작성 중·실패·이미 적용·이미 반려) 409 `PLAN_NOT_APPLICABLE`.
      security: [{ userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
            example: { reason: 출석은 이번 범위가 아니다 }
      responses:
        '200':
          description: 반려됨(status=rejected)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/PmPlan' } } }
              example:
                data: { id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d, projectId: '{{PROJECT_ID}}', status: rejected, instruction: '3주 안에 …', feedback: null, parentPlanId: null, mode: SEQUENTIAL, draft: null, error: null, costUsd: 0.1150, createdAt: '2026-09-30T02:00:00.000Z', appliedAt: null, rejectedAt: '2026-09-30T02:10:00.000Z', rejectReason: 출석은 이번 범위가 아니다, assignments: [] }
        '409':
          description: ready가 아니다
          content:
            application/json:
              example:
                error: { code: PLAN_NOT_APPLICABLE, message: 'only a ready plan can be rejected (this one is applied)' }

  /projects/{projectId}/specs:
    get:
      tags: [명세·태스크 작성]
      summary: 명세 목록 (시험지 포함)
      description: |
        태스크를 만들 때 명세를 고르는 목록이다. 볼 수 있는 범위는 태스크 목록과 같다 — 사람은 볼 수 있는 프로젝트
        (대표는 전체, 팀원은 배정된 것), 에이전트는 자기 프로젝트. **에이전트 토큰으로 보면 잠긴 시험지만 있다**
        (브리핑과 같은 규칙 — 초안을 보면 "통과하도록 코드를 맞추는" 대상이 된다).
      security: [{ userToken: [] }, { agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: featureKey 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [specs], properties: { specs: { type: array, items: { $ref: '#/components/schemas/Spec' } } } } } }
              example:
                data:
                  specs:
                    - id: 5d1f0c3e-7a2b-4c1d-9e8f-0a1b2c3d4e5f
                      featureKey: F-05
                      title: 스터디 대기열 신청
                      content: WHEN 정원이 찬 스터디에 신청하면 THEN 202와 waitlistPosition을 반환한다
                      version: 1
                      createdAt: '2026-09-30T02:00:00.000Z'
                      tests:
                        - { id: 6e2a1d4f-8b3c-4d2e-af90-1b2c3d4e5f60, criterion: 정원이 찬 신청은 202와 대기 순번, testCode: 'expect(res.status).toBe(202)', lockedAt: '2026-09-30T02:00:00.000Z' }
        '403':
          description: 볼 수 없는 프로젝트
          content:
            application/json:
              example:
                error: { code: NOT_PROJECT_MEMBER, message: you are not a member of this project }
    post:
      tags: [명세·태스크 작성]
      summary: 명세 생성 (대표 전용)
      description: |
        명세 1개와 시험지(수용 기준) 여러 개를 만든다. 프로젝트가 `planning`·`active`일 때만.

        **시험지의 `locked`는 필수이고, 만들 때만 정한다.** 잠근 시험지만 V2의 근거가 된다
        (`locked_at < artifacts.created_at`). 나중에 잠그는 API는 없다 — 이미 제출된 산출물보다 늦게 잠긴 시험지가 생기기 때문이다.

        **시험지는 V2에서 팀원 노트북에서 실행되는 코드다.**

        검증 위반은 전부 모아 **422 `PLAN_INVALID`**의 `details`로 돌려준다(같은 featureKey 등).
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featureKey, title, content]
              properties:
                featureKey: { type: string, maxLength: 32 }
                title: { type: string, maxLength: 200 }
                content: { type: string, maxLength: 20000 }
                tests:
                  type: array
                  maxItems: 30
                  items:
                    type: object
                    required: [criterion, testCode, locked]
                    properties:
                      criterion: { type: string, maxLength: 500 }
                      testCode: { type: string, maxLength: 50000 }
                      locked: { type: boolean, description: '필수. true면 지금 잠긴다(V2 근거)' }
            example:
              featureKey: F-05
              title: 스터디 대기열 신청
              content: WHEN 정원이 찬 스터디에 신청하면 THEN 202와 waitlistPosition을 반환한다
              tests:
                - { criterion: 정원이 찬 신청은 202와 대기 순번, testCode: 'expect(res.status).toBe(202)', locked: true }
      responses:
        '201':
          description: 만들어진 명세
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Spec' } } }
              example:
                data: { id: 5d1f0c3e-7a2b-4c1d-9e8f-0a1b2c3d4e5f, featureKey: F-05, title: 스터디 대기열 신청, content: 'WHEN … THEN …', version: 1, createdAt: '2026-09-30T02:00:00.000Z', tests: [] }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 끝났거나 멈춘 프로젝트(completed·aborted·halted)
          content:
            application/json:
              example:
                error: { code: PROJECT_NOT_OPEN, message: 'project is completed; specs and tasks can be added only while planning or active' }
        '422':
          description: 검증 위반 전부
          content:
            application/json:
              example:
                error:
                  code: PLAN_INVALID
                  message: 명세·태스크 검증 실패 1건
                  details: [{ where: 'specs[F-05]', message: '명세 F-05가 프로젝트에 이미 있다 (다시 보낸 건 아닌가?)' }]

  /projects/{projectId}/tasks:
    post:
      tags: [명세·태스크 작성]
      summary: 태스크 생성 (대표 전용)
      description: |
        만들어진 태스크는 `READY`라 배정된 에이전트가 바로 수령할 수 있다. 프로젝트가 `planning`·`active`일 때만.

        - `repoId` — 이 프로젝트에 연결된 레포만
        - `specId` — **IMPLEMENT는 필수**, INTEGRATION·REWORK는 생략 가능
        - `teamRole` — 필수. `null`은 역할 제한 없음(통합 태스크)
        - `dependsOn` — 이 프로젝트의 기존 태스크 id. 선행이 DONE이 돼야 수령할 수 있다
        - 같은 제목은 거부한다(버튼 두 번 누르기 방지)

        검증 위반은 전부 모아 **422 `PLAN_INVALID`**의 `details`로 돌려준다.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, teamRole, repoId]
              properties:
                title: { type: string, maxLength: 200 }
                teamRole: { type: string, enum: [FRONTEND, BACKEND], nullable: true }
                kind: { type: string, enum: [IMPLEMENT, INTEGRATION, REWORK], default: IMPLEMENT }
                repoId: { type: string, format: uuid }
                specId: { type: string, format: uuid, nullable: true }
                dependsOn: { type: array, maxItems: 50, items: { type: string, format: uuid } }
            example:
              title: T-052 대기열 신청 버튼
              teamRole: FRONTEND
              repoId: '{{REPO_API}}'
              specId: null
              kind: INTEGRATION
              dependsOn: []
      responses:
        '201':
          description: 만들어진 태스크(READY)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
              example:
                data: { id: 7f3b2e5a-9c4d-4e3f-b0a1-2c3d4e5f6071, projectId: '{{PROJECT_ID}}', repoId: '{{REPO_API}}', specId: null, kind: INTEGRATION, title: T-052 대기열 신청 버튼, state: READY, teamRole: FRONTEND, assigneeAgentId: null, branchName: null, blockedReason: null, retryCount: 0, claimedAt: null }
        '403':
          description: 대표가 아니거나 다른 조직
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: this action requires the organization representative }
        '409':
          description: 끝났거나 멈춘 프로젝트
          content:
            application/json:
              example:
                error: { code: PROJECT_NOT_OPEN, message: 'project is halted; specs and tasks can be added only while planning or active' }
        '422':
          description: 검증 위반 전부
          content:
            application/json:
              example:
                error:
                  code: PLAN_INVALID
                  message: 명세·태스크 검증 실패 2건
                  details:
                    - { where: 'tasks[task]', message: '레포 … 는 이 프로젝트에 연결돼 있지 않다 (연결된 레포: acme/study-api)' }
                    - { where: 'tasks[task]', message: '구현(IMPLEMENT) 태스크에는 명세가 필요하다 (명세 없이 만들 수 있는 건 INTEGRATION·REWORK)' }
    get:
      tags: [태스크·노트]
      summary: 태스크 목록
      description: |
        웹 UI(사람 토큰)와 Executor 폴링(에이전트 토큰)이 **같은 엔드포인트**를 쓴다.

        에이전트 토큰이면 `teamRole` 질의를 무시하고 자기 역할로 강제 필터한다 — 남의 역할 태스크가
        목록에 아예 없어야 "잡아보고 403"을 반복하지 않는다.
      security: [{ agentToken: [] }, { userToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - { name: state, in: query, schema: { type: string, enum: [READY, CLAIMED, IN_PROGRESS, VERIFYING, AWAITING_APPROVAL, BLOCKED, ESCALATED, DONE] } }
        - { name: teamRole, in: query, schema: { type: string, enum: [FRONTEND, BACKEND] }, description: 에이전트 토큰이면 무시된다 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: 생성 순서대로. 정렬이 결정적이어야 폴링이 같은 태스크를 두고 경합하지 않는다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [tasks], properties: { tasks: { type: array, items: { $ref: '#/components/schemas/Task' } } } } } }
              example:
                data:
                  tasks:
                    - { id: '{{TASK_BE}}', title: 'T-001 참여 신청 API 구현', state: READY, teamRole: BACKEND, retryCount: 0 }

  /tasks/{taskId}/briefing:
    get:
      tags: [태스크·노트]
      summary: 태스크 브리핑 — 프롬프트·settings.json 재료 한 번에
      description: |
        Executor는 팀원 노트북에서 돌아 DB를 직접 못 본다. 여러 엔드포인트를 조합하게 하면 조합 방식이
        Executor마다 갈리므로 서버가 한 번에 준다 — 명세, 서버가 렌더한 인계 노트 블록(`notesBlock`),
        쓸 수 있는 경로, `.claude/settings.json`에 그대로 깔 `claudeSettings`, 그리고 V2가 돌릴 `specTests`.

        **CLAIM 전에도 받을 수 있다.** Executor가 작업공간을 먼저 만들고, claim은 모델이 도구로 하기 때문이다.
        남의 역할 태스크는 403이다 — 명세·노트를 미리 보지 못하게 한다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/TaskBriefing' } } }
              example:
                data:
                  task: { id: '{{TASK_BE}}', title: 'T-001 참여 신청 API 구현', state: READY }
                  repo: { id: '{{REPO_API}}', fullName: acme/study-api, defaultBranch: main, devBranch: dev, cloneUrl: null }
                  spec: { featureKey: F-03, title: 참여 신청 API, content: 'WHEN 정원이 찬 스터디에 신청하면 THEN 409를 반환한다' }
                  notesBlock: "[인계 노트]\n#1 [명세 이탈] quota check moved to service\n  · handler was too late\n  영향: contracts/F-03.yaml"
                  writablePaths: [{ pathPattern: 'src/**', access: write, ownerRole: BACKEND }]
                  claudeSettings:
                    permissions:
                      deny: ['Read(**/.env*)', 'Read(!**/.env.example)', 'Edit(/contracts/**)', 'Edit(**/secrets/**)']
                  specTests: [{ id: 5f0e..., criterion: 정원이 찬 스터디 신청은 409다, lockedAt: '2026-09-21T00:00:00.000Z' }]
                  policyHash: '{{POLICY_HASH}}'

  /tasks/{taskId}/runs/start:
    post:
      tags: [룸]
      summary: Claude 실행 시작 보고 (Executor)
      description: |
        Executor가 Claude를 띄우기 직전에 부른다. 룸에 "에이전트를 실행합니다"가 남는다(이벤트 `AGENT_RUN_STARTED`).
        태스크를 잡는 것(`claim_task`)은 실행 **안에서** 모델이 하므로, 이 에이전트가 그 태스크를 잡고 있거나(CLAIMED·IN_PROGRESS)
        **지금 잡을 수 있으면**(READY·담당 없음·내 역할 또는 역할 제한 없음) 받는다. 아니면 409 `RUN_NOT_ALLOWED`.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '201':
          description: 시작 기록. attempt는 그때의 재시도 횟수
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [taskId, attempt], properties: { taskId: { type: string, format: uuid }, attempt: { type: integer } } } } }
        '409':
          description: 이 에이전트가 잡고 있지도, 잡을 수도 없는 태스크
          content:
            application/json:
              example:
                error: { code: RUN_NOT_ALLOWED, message: task ... is not held by this agent (state READY) }

  /tasks/{taskId}/runs/end:
    post:
      tags: [룸]
      summary: Claude 실행 종료 보고 (Executor)
      description: |
        Claude가 끝나면 부른다(이벤트 `AGENT_RUN_ENDED`). **제출 여부는 서버가 태스크 상태로 정한다** — 이 에이전트가 아직 잡고 있으면
        제출하지 않은 것이다. 그때는 같은 트랜잭션에서 태스크가 **BLOCKED(AGENT_STOPPED)**로 바뀌고(이벤트 `TASK_BLOCKED`), 룸에
        "멈췄습니다 — 사유 / 거부된 명령 → 대표 확인 후 재개가 필요합니다"가 남는다. 재시도 횟수는 오르지 않는다.
        Executor가 꺼져 이 보고조차 오지 않으면 서버 감시가 45분 동안 응답이 없는 수령을 같은 방식으로 멈춘다.
        열린 실행(시작하고 아직 안 끝낸 것)이 없으면 409 `RUN_NOT_OPEN`.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, committed, durationMs, exitCode]
              properties:
                outcome: { type: string, enum: [completed, timeout, failed], description: 'completed=정상 종료, timeout=시간 제한, failed=비정상 종료' }
                committed: { type: boolean, description: '실행 동안 새 커밋이 생겼나' }
                durationMs: { type: integer, minimum: 0 }
                exitCode: { type: integer, nullable: true }
                lastMessage: { type: string, maxLength: 2000, nullable: true, description: '모델의 마지막 말. 제출하지 않았으면 멈춤 사유로 룸에 보인다' }
                deniedCommands: { type: array, maxItems: 20, items: { type: string, maxLength: 300 }, description: '실행 중 거부된 쉘 명령(Executor가 실행 기록에서 뽑는다)' }
            example: { outcome: completed, committed: false, durationMs: 48000, exitCode: 0, lastMessage: 'git merge 권한이 없어 통합 확인을 할 수 없습니다', deniedCommands: ['git fetch --all'] }
      responses:
        '200':
          description: 종료 기록
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [submitted, taskState, blocked], properties: { submitted: { type: boolean }, taskState: { type: string }, blocked: { type: boolean, description: '제출하지 않아 BLOCKED(AGENT_STOPPED)로 멈췄다' } } } } }
        '409':
          description: 열린 실행이 없음
          content:
            application/json:
              example:
                error: { code: RUN_NOT_OPEN, message: no open run for task ... }

  /tasks/{taskId}/activity:
    post:
      tags: [룸]
      summary: 실행 중 도구 사용 보고 (Executor)
      description: |
        Executor가 Claude 출력에서 도구 사용을 뽑아 2초마다 묶어 보낸다(최대 50줄). **도구 종류와 대상(작업공간 기준 경로·명령 첫 줄, 300자)만** 받는다 —
        파일 내용·명령 결과·모델 설명은 받지 않는다(설명은 인계 노트의 몫). 열린 실행에만 붙는다(409 `RUN_NOT_OPEN`).
        이벤트가 아니라 `agent_activity`에 쌓이고, 화면 스트림에는 `room` 토픽으로 알린다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [kind, target]
                    properties:
                      kind: { type: string, enum: [read, edit, write, run, search, other] }
                      target: { type: string, maxLength: 300 }
            example:
              items:
                - { kind: read, target: src/routes/auth.ts }
                - { kind: edit, target: src/routes/auth.ts }
                - { kind: run, target: npm test }
      responses:
        '201':
          description: 기록함
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [recorded], properties: { recorded: { type: integer } } } } }
        '409':
          description: 열린 실행이 없음
          content:
            application/json:
              example:
                error: { code: RUN_NOT_OPEN, message: no open run for task ... }

  /tasks/{taskId}/resume:
    post:
      tags: [룸]
      summary: 멈춘 태스크 재개 (대표 전용)
      description: |
        에이전트가 제출 없이 멈춘 태스크(BLOCKED·`AGENT_STOPPED`)를 원인을 해결한 뒤 다시 돌린다. READY로 돌아가고 담당이 비어
        같은 역할의 에이전트가 다시 가져간다(룸에 "다시 실행해 주세요 (재개)"). **재시도 횟수는 그대로다** — 권한·환경 탓은 에이전트 실패가 아니다.
        멈춘 상태가 아니면 409 `TASK_NOT_STOPPED`.
      security: [{ userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, nullable: true, description: '무엇을 해결했는지(룸에 보인다)' }
            example: { note: 'python 실행을 허용했습니다' }
      responses:
        '200':
          description: 재개됨(READY)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
        '403':
          description: 대표가 아님
          content:
            application/json:
              example:
                error: { code: NOT_REPRESENTATIVE, message: only the representative can resume a stopped task }
        '409':
          description: 멈춘 태스크가 아님
          content:
            application/json:
              example:
                error: { code: TASK_NOT_STOPPED, message: 'task ... is not stopped (state CLAIMED, reason -)' }

  /tasks/{taskId}/branch:
    patch:
      tags: [태스크·노트]
      summary: 작업 브랜치 보고
      description: |
        Executor가 worktree를 만들면서 정한 브랜치 이름을 서버에 알린다. 서버가 정본을 들고 있어야
        재실행·이어받기에서 같은 브랜치를 쓰고 나중에 PR을 열 때도 이 값을 본다.

        **이미 값이 있으면 덮어쓰지 않는다** — 브랜치가 바뀌면 이전 작업물을 찾을 수 없게 된다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchName]
              properties:
                branchName: { type: string, maxLength: 200, pattern: '^[A-Za-z0-9._/-]+$' }
            example: { branchName: 'task/1d5c8f2a' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Task' } } }
              example:
                data: { id: '{{TASK_BE}}', branchName: 'task/1d5c8f2a', state: CLAIMED }

  /artifacts/{artifactId}/verifications:
    post:
      tags: [검증]
      summary: 브릿지 단계(V2·V4) 보고
      description: |
        V2(PM 시험지)와 V4(린트)는 작업공간이 있어야 돌 수 있어 제출 시점에는 결과가 물리적으로
        존재할 수 없다. 그래서 이 단계만 브릿지가 나중에 보고한다.

        **V1A·V1B·V3은 받지 않는다**(403 `VERIFICATION_STAGE_NOT_REPORTABLE`). 로컬이 보고한 V3를
        서버가 받으면 "로컬을 신뢰하지 않는다"는 V3의 전제가 무너진다.

        `SKIPPED`는 반드시 `detail.reason`을 함께 보낸다 — 사유 없는 SKIPPED는 나중에 PASS와 구분되지 않는다.

        V2를 `PASS`로 보고해도 서버가 `spec_tests.locked_at < artifacts.created_at`을 다시 확인하고,
        산출물보다 늦게 잠긴 시험지가 있으면 `FAIL`로 뒤집는다.
      security: [{ agentToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, result]
              properties:
                stage: { type: string, enum: [V2, V4] }
                result: { type: string, enum: [PASS, FAIL, SKIPPED] }
                detail: { type: object }
                durationMs: { type: integer, minimum: 0 }
            examples:
              린트통과:
                value: { stage: V4, result: PASS, detail: { command: 'npm run lint' }, durationMs: 4200 }
              시험지없음:
                value: { stage: V2, result: SKIPPED, detail: { reason: '작업공간에 vitest가 설치돼 있지 않다' } }
              린트실패:
                value: { stage: V4, result: FAIL, detail: { exitCode: 1, output: "src/index.ts:3:1 error" } }
      responses:
        '201':
          description: |
            기록됨. 응답은 이 산출물의 **전체** 결론이다 — 필요한 단계(V3·V2·V4)가 모두 들어오고
            하나도 FAIL이 아니면 `DONE`(gateMode가 AUTO가 아니면 `AWAITING_APPROVAL`)이 된다.
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/VerificationSummary' } } }
              example:
                data:
                  artifactId: 44444444-4444-4444-4444-444444444444
                  attempt: 1
                  stages:
                    - { stage: V1A, result: SKIPPED }
                    - { stage: V1B, result: SKIPPED }
                    - { stage: V2, result: SKIPPED }
                    - { stage: V3, result: PASS }
                    - { stage: V4, result: PASS }
                  outcome: DONE
                  taskState: DONE
                  retryCount: 0
        '400':
          description: 사유 없는 SKIPPED
          content:
            application/json:
              example:
                error: { code: VALIDATION_ERROR, message: SKIPPED must carry detail.reason }
        '403':
          description: 서버가 판정하는 단계이거나, 남의 태스크다
          content:
            application/json:
              examples:
                서버판정단계:
                  value: { error: { code: VERIFICATION_STAGE_NOT_REPORTABLE, message: stage V3 is judged by the server } }
                남의태스크:
                  value: { error: { code: NOT_TASK_ASSIGNEE, message: task is assigned to another agent } }
        '409':
          description: |
            같은 단계를 두 번 보고했다. 재제출은 attempt가 올라간 **새 산출물**이므로, FAIL을 PASS로
            갈아치우는 경로는 없다.
          content:
            application/json:
              example:
                error: { code: VERIFICATION_ALREADY_RECORDED, message: V4 is already recorded for this artifact }
    get:
      tags: [검증]
      summary: 검증 결과 조회
      description: 무엇이 PASS였고 무엇을 **왜** 못 돌렸는지 본다. SKIPPED의 `detail.reason`이 그 답이다.
      security: [{ agentToken: [] }, { userToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ArtifactId' }]
      responses:
        '200':
          description: stage 순
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { type: object, required: [verifications], properties: { verifications: { type: array, items: { $ref: '#/components/schemas/Verification' } } } } } }
              example:
                data:
                  verifications:
                    - stage: V1A
                      result: SKIPPED
                      executedBy: server
                      detail: { reason: 'contracts 테이블 미구현 — ⑦ 이후 가능' }
                    - stage: V3
                      result: FAIL
                      executedBy: server
                      durationMs: 732
                      detail:
                        reason: 'changed_paths가 커밋의 실제 diff와 다르다'
                        undeclared: [README.md]
                        overdeclared: []
