  /questions/{questionId}/draft:
    post:
      tags: [질문]
      summary: 상담 초안 올리기 (대상 역할 에이전트, 실험)
      description: |
        읽기 전용 상담 실행이 코드·명세를 보고 만든 답. **질문 전부가 decided=true면 초안이 곧 답이다**(agent_answered — 묻는 쪽에 바로 간다,
        사람은 나중에 확인하거나 뒤집는다). 하나라도 false면 초안은 참고로만 남고 대상 역할의 사람이 답한다. 초안은 한 번만 받는다.
      security: [{ agentToken: [] }]
      parameters:
        - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers, decided]
              properties:
                answers: { type: object, additionalProperties: { type: string } }
                decided: { type: object, additionalProperties: { type: boolean } }
                basis: { type: object, additionalProperties: { type: array, items: { type: string } } }
      responses:
        '200':
          description: 저장됨(전부 decided면 status=agent_answered)
          content:
            application/json:
              schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AgentQuestion' } } }
  /me/questions:
    get:
      tags: [질문]
      summary: 내가 답할 질문 (조직 전체, 실험)
      description: |
        알림 배지와 "답할 질문" 목록용. **대표는 조직의 모든 질문, 팀원은 자기 에이전트가 맡은 역할을 대상으로 한 질문만**(답할 수 있는 사람과 같은 정의).
        기본은 대기(pending) — 사람이 답해야 하는 것. `agent_answered`는 상대 에이전트가 코드에서 찾아 이미 답한 것(사람이 확인·뒤집기 가능).
        실시간: `/api/stream`의 조직 토픽 `questions`가 오면 다시 읽는다.
