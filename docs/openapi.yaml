        브릿지가 정한 시간(기본 3분)만 기다렸는데 답이 없으면 부른다. 태스크가 BLOCKED(QUESTION)가 되고 담당이 비워진다 —
        에이전트 실행은 커밋 없이 끝나고 노트북은 다른 태스크로 간다. 답이 오면 READY로 돌아가 같은 브랜치에서 이어 간다.
        그 사이 답이 왔으면 아무것도 바꾸지 않고 질문을 돌려준다(status로 판단).
