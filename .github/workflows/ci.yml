# 타입체크 + 전체 테스트. **지금은 자동으로 돌지 않는다**(2026-11-13 대표 결정 — 발표 전 배포 속도 우선).
# Actions → ci → Run workflow로 손으로 돌린다. 다시 켜려면 아래 on:에 pull_request·push(dev)를 되살리고
# deploy.yml의 ci 잡을 되살린다. 꺼 둔 동안에는 PR을 올리기 전에 로컬에서 `npm run typecheck && npm test`를 돌린다.
#
# 테스트는 실제 PostgreSQL을 쓴다(DB 목킹 금지). vitest.config.ts가 localhost:55432/nomos_test에 붙으므로
# 서비스 컨테이너를 같은 포트·이름으로 띄운다 — 접속 문자열을 CI용으로 따로 두지 않는다.
name: ci

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomos_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 테스트 일부가 임시 git 저장소에 커밋한다(mirror 검사기·브릿지 push). 러너에는 신원이 없다.
      - run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main

      - run: npm run typecheck

      - run: npm test
